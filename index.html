        <div class="champ"><label for="f-notes">Note (facultative)</label><textarea id="f-notes" name="notes" style="min-height:90px">${echapper(v.notes)}</textarea></div>
        <p class="vide"><span class="req">*</span> Champs obligatoires.</p>
        <div class="actions"><button class="btn" type="submit">Enregistrer</button><a class="btn sec" href="${retourRdv}">Annuler</a></div></form></div>`;
  },
  enregistrer(f) {
    const d = {}; new FormData(f).forEach((x, k) => d[k] = String(x).trim());
    d.debut = d.debut.slice(0, 5); d.fin = d.fin.slice(0, 5);
    const err = {}, heure = /^\d{2}:\d{2}$/;
    if (!d.titre) err.titre = "Indiquez le titre du rendez-vous.";
    if (!isoValide(d.date)) err.date = "Indiquez une date valide.";
    if (!heure.test(d.debut)) err.debut = "Indiquez l’heure de début.";
    if (d.fin && !heure.test(d.fin)) err.fin = "Heure invalide.";
    else if (d.fin && heure.test(d.debut) && d.fin <= d.debut) err.fin = "La fin doit être après le début.";
    if (d.contactId && !Stockage.get(d.contactId)) err.contactId = "Ce contact n’existe plus. Recherchez un autre contact ou retirez-le.";
    if (d.dossierId && !StockageDossiers.get(d.dossierId)) err.dossierId = "Cet événement n’existe plus. Choisissez-en un autre.";
    ["titre", "date", "debut", "fin", "contactId", "dossierId"].forEach(k => Contacts.erreur(k, err[k]));
    const premier = Object.keys(err)[0];
    if (premier) { const el = $("#f-" + premier) || $("#selecteur button"); if (el) el.focus(); return; }
    const ev = StockageDossiers.get(d.dossierId);
    const data = { titre: d.titre, date: d.date, debut: d.debut, fin: d.fin, contactId: ev ? ev.contactId : d.contactId, dossierId: ev ? ev.id : "", notes: d.notes };
    const id = f.dataset.id;
    if (id) {
      if (!StockageRdv.get(id)) { toast("Ce rendez-vous n’existe plus.", "err"); location.hash = "#calendrier"; return; }
      const av = { ...StockageRdv.get(id) }, ok = StockageRdv.modifier(id, data), dif = Diff.texte("rdv", av, data);
      if (dif) Journal.noter("modification", "rdv", `Rendez-vous modifié : ${data.titre}`, { ref: id, details: dif });
      retour(ok, "Rendez-vous modifié.", "Rendez-vous modifié." + MSG_NON_SAUVE);
    } else {
      if (f.dataset.enCours) return; f.dataset.enCours = "1";
      const r = StockageRdv.creer(data);
      Journal.noter("creation", "rdv", `Rendez-vous créé : ${data.titre}`, { ref: r.r.id, details: [dateSimple(data.date) + " à " + fmtH(data.debut), data.contactId ? Diff.val("rdv", "contactId", data.contactId) : ""].filter(Boolean).join(" · ") });
      retour(r.ok, "Rendez-vous créé.", "Rendez-vous créé." + MSG_NON_SAUVE);
    }
    location.hash = `#calendrier/${CalEtat.vue || (estMobile() ? "liste" : "mois")}/${data.date}`;  // affiche la période du rendez-vous
  },
  async supprimer(id) {
    const r = StockageRdv.get(id); if (!r) return;
    if (!await confirmer("Supprimer ce rendez-vous ?", `<b>${echapper(r.titre)}</b> (${dateLongue(r.date)} à ${fmtH(r.debut)}) sera définitivement supprimé. Le contact et l’événement associés ne sont pas affectés.`, "Supprimer")) return;
    fermerDialogue("#dlg-rdv");
    Journal.noter("suppression", "rdv", `Rendez-vous supprimé : ${r.titre}`, { details: dateSimple(r.date) + " à " + fmtH(r.debut) });

/* ---------- 2k. Sauvegarde, restauration et export ----------
   Fichier de sauvegarde (JSON lisible) : { format, version, application, creeLe, resume, donnees: { contacts, evenements
   (avec leurs opérations), taches, rendezvous, parametres } }. Les identifiants et les liens sont conservés tels quels.
   Restauration : le fichier est entièrement vérifié AVANT toute écriture ; une copie de sécurité des données actuelles
   est conservée ; si l’écriture échoue, l’état précédent est remis en place. */
const FORMAT_SAUVEGARDE = "atelier-crm-photographe", VERSION_SAUVEGARDE = 1;
const CLE_COPIE = "atelier.sauvegarde.copieDeSecurite";
const CLES_DONNEES = [CLE_STOCKAGE, CLE_DOSSIERS, CLE_TACHES, CLE_RDV, CLE_PARAMETRES];

function informer(titre, texte) {  // message simple avec un seul bouton
  const d = $("#dlg");
  if (typeof d.showModal !== "function") { window.alert(titre + "\n\n" + texte.replace(/<[^>]+>/g, "")); return Promise.resolve(); }
  d.innerHTML = `<form method="dialog"><h2 id="dlg-titre">${titre}</h2><div class="dlg-t">${texte}</div><div class="actions"><button class="btn" value="ok" autofocus>J’ai compris</button></div></form>`;
  return new Promise(res => { d.addEventListener("close", () => res(), { once: true }); d.showModal(); });
}
function telechargerFichier(contenu, nom, type) {
  const a = document.createElement("a"), url = URL.createObjectURL(new Blob([contenu], { type }));
  a.href = url; a.download = nom; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

const Sauvegarde = {
  /* --- Construction --- */
  compter(d) {
    return { contacts: d.contacts.length, evenements: d.evenements.length, operations: d.evenements.reduce((n, e) => n + (Array.isArray(e.operations) ? e.operations.length : 0), 0),
      taches: d.taches.length, rendezvous: d.rendezvous.length };
  },
  construire(motif, avecJournal) {
    const donnees = { contacts: Stockage.contacts, evenements: StockageDossiers.dossiers, taches: StockageTaches.taches, rendezvous: StockageRdv.rdv, parametres: { automatisations: Parametres.auto } };
    if (avecJournal) { const j = Journal.lire(); if (j) donnees.journal = j; }
    const illisibles = {};  // données illisibles conservées telles quelles (rien n’est perdu)
    [["contacts", Stockage], ["evenements", StockageDossiers], ["taches", StockageTaches], ["rendezvous", StockageRdv], ["parametres", Parametres]]
      .forEach(([k, S]) => { if (S.etat === "corrompu" && S.brut) illisibles[k] = S.brut; });
    return { format: FORMAT_SAUVEGARDE, version: VERSION_SAUVEGARDE, application: "Atelier — CRM photographe", creeLe: new Date().toISOString(),
      ...(motif ? { motif } : {}), resume: this.compter(donnees), donnees, ...(Object.keys(illisibles).length ? { illisibles } : {}) };
  },
  nom: prefixe => `${prefixe}-${isoJour(new Date())}.json`,
  telechargerTout() {
    const nom = this.nom("sauvegarde-crm-photographe");
    try { telechargerFichier(JSON.stringify(this.construire(undefined, true), null, 2), nom, "application/json"); }
    catch (e) { informer("Le téléchargement a échoué", "La sauvegarde n’a pas pu être créée. Réessayez ; si le problème persiste, essayez avec un autre navigateur."); return; }
    try { localStorage.setItem(CLE_META_SAUVEGARDE, new Date().toISOString()); } catch (e) { /* sans gravité */ }
    Journal.noter("donnees", "donnees", "Sauvegarde téléchargée", { details: nom });
    toast(`Sauvegarde téléchargée (${nom}). Rangez-la en lieu sûr.`);
    if (location.hash.startsWith("#parametres/sauvegarde")) App.afficher(true);
  },
  /* --- Vérification complète d’un fichier (aucune écriture) --- */
  valider(o) {
    const pasNous = "Ce fichier n’est pas une sauvegarde de l’application.";
    if (!o || typeof o !== "object" || Array.isArray(o) || o.format !== FORMAT_SAUVEGARDE) throw new Error(pasNous);
    if (typeof o.version !== "number") throw new Error(pasNous);
    if (o.version > VERSION_SAUVEGARDE) throw new Error("Cette sauvegarde a été créée par une version plus récente de l’application.");
    const d = o.donnees;
    if (!d || typeof d !== "object") throw new Error("La sauvegarde est incomplète.");
    const liste = (x, nom, champs) => {
      if (x === undefined) return [];
      if (!Array.isArray(x)) throw new Error(`La partie « ${nom} » de la sauvegarde est endommagée.`);
      const ids = new Set();
      x.forEach(e => {
        if (!e || typeof e !== "object" || champs.some(c => typeof e[c] !== "string")) throw new Error(`La partie « ${nom} » de la sauvegarde est endommagée.`);
        if (ids.has(e.id)) throw new Error(`La partie « ${nom} » contient des éléments en double.`);
        ids.add(e.id);
      });
      return x;
    };
    const contacts = liste(d.contacts, "contacts", ["id", "prenom", "nom"]);
    const evenements = liste(d.evenements, "événements", ["id", "titre", "contactId"]);
    evenements.forEach(e => {
      if (e.operations !== undefined && (!Array.isArray(e.operations) || !e.operations.every(x => x && typeof x.id === "string" && typeof x.titre === "string")))
        throw new Error("L’historique des opérations de la sauvegarde est endommagé.");
    });
    const taches = liste(d.taches, "tâches", ["id", "titre"]);
    const rendezvous = liste(d.rendezvous, "rendez-vous", ["id", "titre", "date"]);
    const p = d.parametres;
    if (p !== undefined && (!p || !p.automatisations || !Array.isArray(p.automatisations.regles) || !p.automatisations.regles.every(r => r && typeof r.id === "string" && typeof r.titre === "string")))
      throw new Error("Les réglages contenus dans la sauvegarde sont endommagés.");
    const ill = o.illisibles && typeof o.illisibles === "object" ? o.illisibles : {};
    Object.values(ill).forEach(v => { if (typeof v !== "string") throw new Error("La sauvegarde est endommagée."); });
    const journal = Array.isArray(d.journal) ? d.journal.filter(e => e && typeof e.t === "string" && typeof e.libelle === "string") : null;  // facultatif
    return { contacts, evenements, taches, rendezvous, parametres: p || null, illisibles: ill, creeLe: o.creeLe, motif: o.motif, journal };
  },
  resumeHtml(r) {
    const l = (n, un, plusieurs) => `<li><b>${n}</b> ${n > 1 ? plusieurs : un}</li>`;
    return `<ul>${l(r.contacts, "contact", "contacts")}${l(r.evenements, "événement", "événements")}${l(r.operations, "opération", "opérations")}${l(r.taches, "tâche", "tâches")}${l(r.rendezvous, "rendez-vous", "rendez-vous")}</ul>`;
  },
  /* --- Restauration --- */
  async restaurerFichier(f) {
    if (f.size > 50 * 1024 * 1024) { informer("Fichier trop volumineux", "Ce fichier est bien trop gros pour être une sauvegarde de l’application. Vos données n’ont pas été modifiées."); return; }
    let texte;
    try { texte = await f.text(); } catch (e) { informer("Lecture impossible", "Le fichier n’a pas pu être lu. Vos données n’ont pas été modifiées."); return; }
    this.restaurerTexte(texte, `le fichier « ${echapper(f.name)} »`);
  },
  async restaurerTexte(texte, source) {
    let v;
    try { v = this.valider(JSON.parse(texte)); }
    catch (e) {
      const msg = e instanceof SyntaxError ? "Ce fichier n’est pas une sauvegarde valide : son contenu est illisible." : e.message;
      informer("Restauration impossible", `${msg}<p style="margin-top:10px"><b>Vos données actuelles n’ont pas été modifiées.</b></p>`); return;
    }
    const r = this.compter(v), actuel = this.construire().resume;
    const quand = v.creeLe && !isNaN(new Date(v.creeLe)) ? ` du ${dateLongue(isoJour(new Date(v.creeLe)))} à ${new Date(v.creeLe).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })}` : "";
    const ok = await confirmer("Restaurer cette sauvegarde ?",
      `Sauvegarde${quand} (${source}). Elle contient :${this.resumeHtml(r)}
      <p style="margin-top:10px">Les données actuellement présentes dans ce navigateur (${actuel.contacts} contacts, ${actuel.evenements} événements, ${actuel.taches} tâches, ${actuel.rendezvous} rendez-vous) <b>seront remplacées</b>.
      Une copie de sécurité en est conservée automatiquement : vous pourrez revenir en arrière depuis cette page.</p>${Nuage.actif && Nuage.session ? `<p style="margin-top:10px"><b>Synchronisation en ligne :</b> ces données remplaceront aussi celles enregistrées en ligne, sur tous vos appareils connectés.</p>` : ""}`, "Remplacer mes données");
    if (ok) this.appliquer(v);
  },
  appliquer(v) {
    // 1. Copie de sécurité des données actuelles (dans le navigateur, sinon téléchargée)
    const copie = JSON.stringify(this.construire("Copie automatique avant restauration", true), null, 2);
    let copieGardee = true;
    try { localStorage.setItem(CLE_COPIE, copie); if (localStorage.getItem(CLE_COPIE) !== copie) throw new Error("verification"); }
    catch (e) { copieGardee = false; try { telechargerFichier(copie, this.nom("copie-de-securite-crm-photographe"), "application/json"); } catch (x) { /* rien */ } }
    // 2. Préparation complète avant écriture
    const ill = v.illisibles, j = x => JSON.stringify(x);
    const cibles = [
      [CLE_STOCKAGE, ill.contacts ?? j({ version: 1, contacts: v.contacts })],
      [CLE_DOSSIERS, ill.evenements ?? j({ version: VERSION_DOSSIERS, dossiers: v.evenements })],
      [CLE_TACHES, ill.taches ?? j({ version: 1, taches: v.taches })],
      [CLE_RDV, ill.rendezvous ?? j({ version: 1, rendezvous: v.rendezvous })],
      [CLE_PARAMETRES, ill.parametres ?? (v.parametres ? j({ version: 1, automatisations: v.parametres.automatisations }) : null)]];
    const avant = cibles.map(([k]) => [k, Disque.lire(k)]);
    const ecrireTout = () => {
      cibles.forEach(([k, val]) => val === null ? localStorage.removeItem(k) : localStorage.setItem(k, val));
      if (cibles.some(([k, val]) => localStorage.getItem(k) !== val)) throw new Error("verification");
    };
    const remettre = () => avant.forEach(([k, val]) => { try { val === null ? localStorage.removeItem(k) : localStorage.setItem(k, val); } catch (x) { /* au mieux */ } });
    // 3. Écriture, vérification, et retour arrière en cas d’échec
    try { ecrireTout(); }
    catch (e) {
      remettre();
      if (estQuota(e) && copieGardee) {  // manque de place : on télécharge la copie, on libère sa place et on réessaie une fois
        try { telechargerFichier(copie, this.nom("copie-de-securite-crm-photographe"), "application/json"); localStorage.removeItem(CLE_COPIE); ecrireTout(); }
        catch (e2) { remettre(); informer("La restauration a échoué", "L’espace de stockage du navigateur est insuffisant pour cette sauvegarde. <b>Vos données précédentes ont été remises en place.</b> Une copie de sécurité a été téléchargée par précaution."); return; }
      } else {
        informer("La restauration a échoué", `${estQuota(e) ? "L’espace de stockage du navigateur est insuffisant. " : ""}<b>Vos données précédentes ont été remises en place.</b>`); return;
      }
    }
    if (v.journal) Journal.fusionner(v.journal);  // le journal de la sauvegarde rejoint celui de ce navigateur
    { const rr = this.compter(v); Journal.noter("donnees", "donnees", v.motif ? "Retour à la copie de sécurité" : "Sauvegarde restaurée", { details: `${v.creeLe && !isNaN(new Date(v.creeLe)) ? "Sauvegarde du " + new Date(v.creeLe).toLocaleString("fr-FR", { dateStyle: "short", timeStyle: "short" }) + " · " : ""}${rr.contacts} contacts, ${rr.evenements} événements, ${rr.taches} tâches, ${rr.rendezvous} rendez-vous` }); }
    try { sessionStorage.setItem("atelier.message", "Sauvegarde restaurée : vos données ont été remplacées. Une copie de sécurité de l’état précédent est disponible dans Paramétrage › Sauvegarde."); } catch (e) { /* rien */ }
    try { localStorage.setItem(CLE_META_MODIF, new Date().toISOString()); } catch (e) { /* rien */ }
    location.hash = "#accueil"; location.reload();  // recharge l’application avec les données restaurées
  },
  copie() { const t = Disque.lire(CLE_COPIE); if (!t) return null; try { const o = JSON.parse(t); return { texte: t, creeLe: o.creeLe, resume: o.resume || {} }; } catch (e) { return null; } },
  /* --- Export CSV des contacts (Excel, Google Sheets : UTF-8 avec BOM, séparateur « ; ») --- */
  exporterCsv() {
    if (!Stockage.contacts.length) return;
    const cell = v => {
      let s = String(v == null ? "" : v).replace(/\r\n?/g, "\n");
      if (/^[=+\-@\t]/.test(s)) s = "'" + s;  // empêche le tableur d’interpréter le texte comme une formule
      return /[";\n]/.test(s) || s !== s.trim() ? `"${s.replace(/"/g, '""')}"` : s;
    };
    const tel = t => t ? `"=""${t.replace(/"/g, "")}"""` : "";  // conserve le 0 initial et le + des numéros
    const lignes = [["Prénom", "Nom", "E-mail", "Téléphone", "Type de contact", "Source", "Notes", "Entreprise", "Adresse", "Code postal", "Ville", "Créé le"].join(";")];
    [...Stockage.contacts].sort((a, b) => a.nom.localeCompare(b.nom, "fr", { sensitivity: "base" }) || a.prenom.localeCompare(b.prenom, "fr", { sensitivity: "base" })).forEach(c => {
      lignes.push([cell(c.prenom), cell(c.nom), cell(c.email), tel(c.telephone), cell(TYPES[c.type] || "Autre"), cell(ORIGINES[c.origine] || ""), cell(c.notes), cell(c.entreprise), cell(c.adresse), cell(c.codePostal), cell(c.ville),
        cell(c.creeLe && !isNaN(new Date(c.creeLe)) ? new Date(c.creeLe).toLocaleDateString("fr-FR") : "")].join(";"));
    });
    const nom = `contacts-crm-photographe-${isoJour(new Date())}.csv`;
    telechargerFichier("﻿" + lignes.join("\r\n") + "\r\n", nom, "text/csv;charset=utf-8");
    Journal.noter("donnees", "donnees", "Contacts exportés (CSV)", { details: `${Stockage.contacts.length} contacts · ${nom}` });
    toast(`${Stockage.contacts.length} contact${Stockage.contacts.length > 1 ? "s" : ""} exporté${Stockage.contacts.length > 1 ? "s" : ""} (${nom}).`);
  },
  /* --- Rappel : aucune sauvegarde, ou dernière sauvegarde ancienne alors que des modifications ont eu lieu --- */
  rappel() {

    this.actif = /^https?:$/.test(location.protocol) || forcer;
    if (!this.actif) return;
    this.lireSession(); this.lireMeta();
    nuagePlanifier = () => this.planifier();
    window.addEventListener("storage", e => {  // un autre onglet a synchronisé ou s’est connecté
      if (e.key === CLE_NUAGE_ETAT) this.lireMeta();
      else if (e.key === CLE_NUAGE_SESSION) this.lireSession();
    });
  },
  lireSession() { try { this.session = JSON.parse(localStorage.getItem(CLE_NUAGE_SESSION)) || null; } catch (e) { this.session = null; } },
  lireMeta() { try { const m = JSON.parse(localStorage.getItem(CLE_NUAGE_ETAT)); if (m && m.versions && m.base) this.meta = m; } catch (e) { /* on garde l’état en mémoire */ } },
  sauverMeta() { try { localStorage.setItem(CLE_NUAGE_ETAT, JSON.stringify(this.meta)); } catch (e) { /* gardé en mémoire : sans gravité */ } },
  garderSession(d) {
    const email = (d.user && d.user.email) || (this.session && this.session.email) || "";
    this.session = { access_token: d.access_token, refresh_token: d.refresh_token, expires_at: d.expires_at || Math.floor(Date.now() / 1000) + (d.expires_in || 3600), email };
    try { localStorage.setItem(CLE_NUAGE_SESSION, JSON.stringify(this.session)); localStorage.setItem(CLE_NUAGE_EMAIL, email); } catch (e) { /* session gardée en mémoire */ }
  },
  oublierSession() { this.session = null; try { localStorage.removeItem(CLE_NUAGE_SESSION); } catch (e) { /* rien */ } },

  /* --- Démarrage, déclencheurs --- */
  demarrer() {
    if (!this.actif) return;
    $("#nuage").hidden = false;
    window.addEventListener("online", () => this.synchroniser());
    window.addEventListener("offline", () => { this.etat = "horsligne"; this.statut(); });
    window.addEventListener("focus", () => this.synchroniser());
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") this.forcerJournal = true; this.synchroniser(); });
    window.addEventListener("hashchange", () => { if (this.differe) this.synchroniser(); });
    setInterval(() => { if (document.visibilityState !== "hidden") this.synchroniser(); }, 60000);
    if (this.session) this.synchroniser(); else this.afficherConnexion();
  },
  planifier(delai = 1200) {
    if (!this.actif || !this.session) return;
    clearTimeout(this.minuteur); this.minuteur = setTimeout(() => this.synchroniser(), delai);
    if (!this.enCours && this.etat !== "horsligne" && this.etat !== "session") { this.etat = "attente"; this.statut(); }
  },
  enAttente() { return CLES_DONNEES.some(k => { const l = Disque.lire(k); return l !== null && l !== this.meta.base[k]; }); },
  statut() {
    const z = $("#nuage"); if (!z) return;
    const s = STATUTS_NUAGE[this.etat] || STATUTS_NUAGE.synchro;
    const heure = this.etat === "ok" && this.derniere ? ` à ${this.derniere.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })}` : "";
    z.dataset.etat = this.etat; z.querySelector(".nuage-l").textContent = s.l;
    z.title = s.t + (heure ? ` Dernière synchronisation${heure}.` : "") + (this.etat === "erreur" && this.message ? ` (${this.message})` : "");
    if (location.hash.startsWith("#parametres/sauvegarde")) { const c = $("#carte-nuage"); if (c) c.outerHTML = this.carte(); }
  },

  /* --- Appels au serveur --- */
  async requete(chemin, o = {}, auth = true) {
    const h = { apikey: NUAGE_CLE, "Content-Type": "application/json", ...(o.headers || {}) };
    if (auth) { await this.jetonValide(); h.Authorization = "Bearer " + this.session.access_token; }
    let r;
    try { r = await fetch(NUAGE_URL + chemin, { method: o.method || "GET", headers: h, body: o.body === undefined ? undefined : JSON.stringify(o.body), cache: "no-store" }); }
    catch (e) { const x = new Error("réseau indisponible"); x.reseau = true; throw x; }
    if (auth && r.status === 401 && !o.deja) { await this.rafraichir(); return this.requete(chemin, { ...o, deja: true }, auth); }
    const t = await r.text(); let d = null;
    if (t) { try { d = JSON.parse(t); } catch (e) { d = t; } }
    if (!r.ok) {
      const x = new Error((d && typeof d === "object" && (d.msg || d.message || d.error_description || d.error)) || "erreur " + r.status);
      x.statut = r.status; x.code = d && typeof d === "object" ? (d.error_code || d.code || d.error) : ""; throw x;
    }
    return d;
  },
  async jetonValide() {
    if (!this.session) { const x = new Error("session"); x.session = true; throw x; }
    if ((this.session.expires_at || 0) * 1000 - Date.now() < 60000) await this.rafraichir();
  },
  rafraichir() {
    if (this.rafraichissement) return this.rafraichissement;
    this.rafraichissement = (async () => {
      try { this.garderSession(await this.requete("/auth/v1/token?grant_type=refresh_token", { method: "POST", body: { refresh_token: this.session.refresh_token } }, false)); }
      catch (e) { if (e.reseau) throw e; this.oublierSession(); const x = new Error("session"); x.session = true; throw x; }
      finally { this.rafraichissement = null; }
    })();
    return this.rafraichissement;
  },
  async connecter(email, mdp) {
    this.garderSession(await this.requete("/auth/v1/token?grant_type=password", { method: "POST", body: { email, password: mdp } }, false));
    const m = await this.requete("/rest/v1/atelier_membres?select=user_id");
    if (!Array.isArray(m) || !m.length) { await this.deconnecter(true); const x = new Error("membre"); x.membre = true; throw x; }
    Journal.noter("donnees", "donnees", "Connexion à la synchronisation en ligne", { details: this.session.email });
  },
  async deconnecter(silencieux) {
    if (this.session) { try { await this.requete("/auth/v1/logout", { method: "POST" }); } catch (e) { /* la session locale est oubliée quand même */ } }
    this.oublierSession(); clearTimeout(this.minuteur);
    this.etat = "session"; this.statut();
    if (!silencieux) { Journal.noter("donnees", "donnees", "Déconnexion de la synchronisation en ligne"); this.afficherConnexion(); }
  },
  versionDistante: async function (cle) {
    const r = await this.requete(`/rest/v1/atelier_donnees?select=version&cle=eq.${encodeURIComponent(cle)}`);
    return Array.isArray(r) && r.length ? r[0].version : undefined;
  },

  /* --- Synchronisation --- */
  saisieEnCours() {  // une fiche est en cours de saisie : on ne remplace pas les données sous ses yeux
    const a = document.activeElement;
    return !!($("#vue form[data-form]") || $("#dlg-op").open || $("#dlg-rdv").open || $("#dlg").open || (a && a.dataset && a.dataset.edit));
  },
  async synchroniser(manuel) {
    if (!this.actif || !this.session) return;
    if (this.enCours) { this.encore = true; return; }
    if (navigator.onLine === false) { this.etat = "horsligne"; this.statut(); return; }
    clearTimeout(this.minuteur);
    this.enCours = true; this.differe = false; this.illisible = false;
    if (manuel) this.forcerJournal = true;
    let recharger = false, journal = false, conflits = 0;
    this.etat = "synchro"; this.statut();
    try {
      const distants = await this.requete("/rest/v1/atelier_donnees?select=cle,version");
      const vers = {}; (Array.isArray(distants) ? distants : []).forEach(r => { vers[r.cle] = r.version; });
      for (const cle of CLES_NUAGE) {
        const res = await this.synchroCle(cle, vers[cle], 0);
        if (res.applique) { if (cle === CLE_JOURNAL) journal = true; else recharger = true; }
        conflits += res.conflits || 0;
      }
      this.derniere = new Date();
      this.etat = this.differe || this.enAttente() ? "attente" : "ok";
      if (this.differe) setTimeout(() => this.synchroniser(), 15000);  // nouvel essai une fois la saisie terminée
    } catch (e) {
      if (e.session) { this.etat = "session"; this.afficherConnexion("Votre session a expiré : reconnectez-vous. Vos modifications sont gardées sur cet appareil et seront envoyées ensuite."); }
      else if (e.reseau) this.etat = "horsligne";
      else { this.etat = "erreur"; this.message = e.message; }
    } finally {
      this.enCours = false; this.forcerJournal = false;
      this.sauverMeta(); this.statut();
    }
    if (recharger) App.rechargerDonnees("Données mises à jour depuis un autre appareil.");
    else if (journal && location.hash.startsWith("#parametres/journal")) JournalUI.majZone();
    if (conflits) Journal.noter("donnees", "donnees", "Synchronisation : modifications simultanées fusionnées",
      { details: `${conflits} fiche${conflits > 1 ? "s" : ""} modifiée${conflits > 1 ? "s" : ""} en même temps sur deux appareils : la version la plus récente a été gardée` });
    if (this.encore) { this.encore = false; this.planifier(300); }
  },
  async synchroCle(cle, vDistante, essai) {
    const local = Disque.lire(cle), base = this.meta.base[cle], vLocale = this.meta.versions[cle];
    if (local !== null && !jsonValide(local)) { this.illisible = true; return {}; }  // illisible : ni envoyé ni remplacé
    const sale = local !== null && local !== base;
    const change = vDistante !== undefined && vDistante !== vLocale;
    if (!sale && !change) return {};
    if (change && this.saisieEnCours()) { this.differe = true; return {}; }
    if (cle === CLE_JOURNAL && sale && !change && !this.forcerJournal && Date.now() - this.dernierJournal < NUAGE_DELAI_JOURNAL) return {};
    let distant = null;
    if (change) {
      const r = await this.requete(`/rest/v1/atelier_donnees?select=valeur,version&cle=eq.${encodeURIComponent(cle)}`);
      if (!Array.isArray(r) || !r.length) return this.synchroCle(cle, undefined, essai);
      distant = typeof r[0].valeur === "string" ? r[0].valeur : JSON.stringify(r[0].valeur); vDistante = r[0].version;
      if (!jsonValide(distant)) return {};
      if (!sale || local === distant) return this.appliquer(cle, local, distant, vDistante) ? { applique: local !== distant } : {};
    }
    let envoi = local, conflits = 0;
    if (change) {
      const f = this.fusionner(cle, base, local, distant, vLocale === undefined);
      envoi = f.texte; conflits = f.conflits;
      if (envoi === distant) return this.appliquer(cle, local, distant, vDistante) ? { applique: true, conflits } : {};
    }
    let nv;
    if (vDistante === undefined) {
      try { const r = await this.requete("/rest/v1/atelier_donnees?select=version", { method: "POST", headers: { Prefer: "return=representation" }, body: { cle, valeur: envoi, version: 1 } }); nv = r[0].version; }
      catch (e) { if (e.statut === 409 && essai < 3) return this.synchroCle(cle, await this.versionDistante(cle), essai + 1); throw e; }
    } else {
      const r = await this.requete(`/rest/v1/atelier_donnees?select=version&cle=eq.${encodeURIComponent(cle)}&version=eq.${vDistante}`,
        { method: "PATCH", headers: { Prefer: "return=representation" }, body: { valeur: envoi, version: vDistante + 1, modifie_le: new Date().toISOString() } });
      if (!Array.isArray(r) || !r.length) {  // quelqu’un a modifié entre-temps : on recommence avec sa version
        if (essai < 3) return this.synchroCle(cle, await this.versionDistante(cle), essai + 1);
        throw new Error("modifications concurrentes répétées");
      }
      nv = r[0].version;
    }
    if (cle === CLE_JOURNAL) this.dernierJournal = Date.now();
    if (envoi === local) { this.meta.versions[cle] = nv; this.meta.base[cle] = envoi; return { conflits }; }
    // Résultat fusionné : on l’écrit sur cet appareil, sauf si une saisie a eu lieu pendant l’envoi
    if (this.ecrireLocal(cle, local, envoi)) { this.meta.versions[cle] = nv; this.meta.base[cle] = envoi; return { applique: true, conflits }; }
    this.meta.versions[cle] = null; this.meta.base[cle] = local;  // prochaine synchronisation : nouvelle fusion avec ce qui a été saisi
    return { conflits };
  },
  appliquer(cle, attendu, texte, version) {
    if (!this.ecrireLocal(cle, attendu, texte)) return false;
    this.meta.versions[cle] = version; this.meta.base[cle] = texte; return true;
  },
  ecrireLocal(cle, attendu, texte) {
    if (Disque.lire(cle) !== attendu) return false;  // modifié pendant l’échange : rien n’est écrasé
    if (attendu === texte) return true;
    try { localStorage.setItem(cle, texte); return localStorage.getItem(cle) === texte; }
    catch (e) { try { if (attendu === null) localStorage.removeItem(cle); else localStorage.setItem(cle, attendu); } catch (x) { /* au mieux */ } this.message = "stockage du navigateur plein"; return false; }
  },
  /* Fusion fiche par fiche : base = état commun lors de la dernière synchronisation */
  fusionner(cle, base, local, distant, premiere) {
    const P = s => { if (s === undefined || s === null) return null; try { return JSON.parse(s); } catch (e) { return null; } };
    const b = P(base), l = P(local), d = P(distant);
    if (cle === CLE_JOURNAL) {
      const vus = new Set(), tout = [];
      [...((d && Array.isArray(d.entrees)) ? d.entrees : []), ...((l && Array.isArray(l.entrees)) ? l.entrees : [])].forEach(e => {
        if (!e || typeof e.t !== "string") return;
        const k = e.id || e.t + e.libelle; if (!vus.has(k)) { vus.add(k); tout.push(e); }
      });
      tout.sort((x, y) => x.t.localeCompare(y.t));
      return { texte: JSON.stringify({ version: 1, entrees: tout.slice(-JOURNAL_MAX) }), conflits: 0 };
    }
    const prop = LISTES_NUAGE[cle];
    if (!prop || !l || !d || !Array.isArray(l[prop]) || !Array.isArray(d[prop])) return { texte: premiere ? distant : local, conflits: 1 };  // réglages
    let conflits = 0;
    const idx = x => new Map((x && Array.isArray(x[prop]) ? x[prop] : []).filter(e => e && e.id).map(e => [e.id, JSON.stringify(e)]));
    const mb = idx(b), ml = idx(l), md = idx(d);
    const choisir = id => {
      const vb = mb.get(id), vl = ml.get(id), vd = md.get(id);
      if (vl === vd) return vl;
      if (vl === vb) return vd;          // inchangée ici : la version en ligne s’impose (y compris une suppression)
      if (vd === vb) return vl;          // inchangée en ligne : la version de cet appareil s’impose
      if (vl === undefined) return vd;   // supprimée d’un côté, modifiée de l’autre : on la garde
      if (vd === undefined) return vl;
      conflits++;
      if (premiere) return vd;
      const tl = JSON.parse(vl).modifieLe || "", td = JSON.parse(vd).modifieLe || "";
      return td > tl ? vd : vl;
    };
    const ids = [...md.keys(), ...[...ml.keys()].filter(k => !md.has(k))];
    const liste = ids.map(choisir).filter(v => v !== undefined).map(v => JSON.parse(v));
    return { texte: JSON.stringify({ ...d, ...l, [prop]: liste }), conflits };
  },

  /* --- Écran de connexion --- */
  afficherConnexion(msg) {
    document.body.classList.add("verrou");
    let z = $("#connexion");
    if (!z) {
      let email = ""; try { email = localStorage.getItem(CLE_NUAGE_EMAIL) || ""; } catch (e) { /* rien */ }
      document.body.insertAdjacentHTML("beforeend", `<div id="connexion" class="connexion"><form class="cx-carte" novalidate aria-labelledby="cx-titre">
        <img class="portrait" src="${PHOTOS.profil}" alt="" width="76" height="76">
        <h1 id="cx-titre" class="signature">Maëlys Lainé</h1>
        <p class="cx-sous">Atelier · connectez-vous pour retrouver vos données sur tous vos appareils.</p>
        <p class="cx-msg" id="cx-msg" role="alert"></p>
        <label for="cx-email">E-mail</label><input id="cx-email" type="email" autocomplete="username" inputmode="email" value="${echapper(email)}" required>
        <label for="cx-mdp">Mot de passe</label><input id="cx-mdp" type="password" autocomplete="current-password" required>
        <button class="btn" type="submit" id="cx-ok">Se connecter</button>
        <p class="aide">Mot de passe oublié ? Il peut être changé depuis Supabase (Authentication › Users).</p></form></div>`);
      z = $("#connexion");
      z.querySelector("form").addEventListener("submit", e => { e.preventDefault(); this.envoyerConnexion(); });
    }
    $("#cx-msg").textContent = msg || "";
    setTimeout(() => { const i = $("#cx-email").value ? $("#cx-mdp") : $("#cx-email"); i.focus(); }, 50);
  },
  async envoyerConnexion() {
    const email = $("#cx-email").value.trim(), mdp = $("#cx-mdp").value, b = $("#cx-ok"), m = $("#cx-msg");
    if (!email || !mdp) { m.textContent = "Saisissez votre e-mail et votre mot de passe."; return; }
    b.disabled = true; b.textContent = "Connexion…"; m.textContent = "";
    try {
      await this.connecter(email, mdp);
      $("#connexion").remove(); document.body.classList.remove("verrou");
      toast("Connexion réussie : vos données vont se synchroniser.");
      this.synchroniser(true);
    } catch (e) {
      m.textContent = e.membre ? "Ce compte n’est pas autorisé à accéder aux données de l’Atelier."
        : e.reseau ? "Impossible de joindre le serveur : vérifiez votre connexion internet."
        : (e.code === "invalid_credentials" || e.statut === 400) ? "E-mail ou mot de passe incorrect."
        : `Connexion impossible (${e.message}).`;
      b.disabled = false; b.textContent = "Se connecter"; $("#cx-mdp").focus();
    }
  },

  /* --- Carte de la page Paramétrage › Sauvegarde --- */
  carte() {
    if (!this.actif) return "";
    const s = STATUTS_NUAGE[this.etat] || STATUTS_NUAGE.synchro;
    const h = this.derniere ? this.derniere.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }) : "";
    return `<section class="card carte-nuage" id="carte-nuage" style="margin-bottom:18px"><h2>Synchronisation en ligne</h2>
      ${this.session ? `<p>Connecté avec <b>${echapper(this.session.email || "votre compte")}</b>.</p>
      <p class="nuage-etat" data-etat="${this.etat}"><span class="pastille" aria-hidden="true"></span><b>${s.l}</b>${this.etat === "ok" && h ? ` · dernière synchronisation à ${h}` : ""}</p>
      <p class="aide">${s.t}${this.etat === "erreur" && this.message ? ` (${echapper(this.message)})` : ""}${this.illisible ? " Une partie des données de cet appareil est illisible : elle n’est ni envoyée ni remplacée." : ""}</p>
      <p class="aide">Vos données sont enregistrées en ligne et sur chacun de vos appareils connectés ; les modifications passent de l’un à l’autre automatiquement. Télécharger une sauvegarde de temps en temps reste une bonne précaution.</p>
      <div class="actions" style="margin-top:14px"><button class="btn sec" data-action="nuage-synchro"${this.enCours ? " disabled" : ""}>Synchroniser maintenant</button><button class="btn sec" data-action="nuage-deconnexion">Se déconnecter</button></div>`
      : `<p>Vous n’êtes pas connecté : les données ne sont pas synchronisées.</p><div class="actions" style="margin-top:14px"><button class="btn" data-action="nuage-connexion">Se connecter</button></div>`}</section>`;
  }
};
Nuage.init();

/* ---------- 2l. Page Paramétrage › Journal ---------- */
const ACTIONS_J = { creation: { l: "Création", g: "c" }, modification: { l: "Modification", g: "a" }, suppression: { l: "Suppression", g: "e" },
  statut: { l: "Statut", g: "b" }, auto: { l: "Automatique", g: "" }, reglage: { l: "Réglage", g: "d" }, donnees: { l: "Données", g: "d" } };
const OBJETS_J = { contact: "Contacts", evenement: "Événements", operation: "Opérations", tache: "Tâches", rdv: "Rendez-vous", systeme: "Réglages et données" };
const FiltresJ = { q: "", objet: "", max: 100 };
const JournalUI = {
  lien(e) {
    const r = e.ref;
    if (!r) return null;
    if (e.objet === "contact" && Stockage.get(r)) return "#contacts/" + r;
    if ((e.objet === "evenement" || e.objet === "operation") && StockageDossiers.get(r)) return "#dossiers/" + r;
    if (e.objet === "tache" && StockageTaches.get(r)) return "#taches/" + r;
    if (e.objet === "rdv" && StockageRdv.get(r)) return "#calendrier/rdv/" + r;
    return null;
  },
  filtrer(l) {
    const mots = norm(FiltresJ.q).split(/\s+/).filter(Boolean);
    return l.filter(e => {
      if (FiltresJ.objet && (FiltresJ.objet === "systeme" ? !["regle", "donnees"].includes(e.objet) : e.objet !== FiltresJ.objet)) return false;
      const foin = norm(e.libelle + " " + (e.details || "") + " " + ((ACTIONS_J[e.action] || {}).l || ""));
      return mots.every(m => foin.includes(m));
    }).reverse();  // les plus récentes d’abord
  },
  zone() {
    const tout = Journal.lire();
    if (tout === null) return "";
    if (!tout.length) return `<div class="card etat-vide"><h2>Le journal est vide</h2><p>Chaque création, modification ou suppression sera notée ici, avec sa date et son heure.</p></div>`;
    const l = this.filtrer(tout);
    if (!l.length) return `<div class="card etat-vide"><p style="margin:0">Aucune entrée ne correspond à cette recherche.</p></div>`;
    const auj = isoJour(new Date()), hier = plusJours(auj, -1);
    let html = "", jourCourant = "";
    l.slice(0, FiltresJ.max).forEach(e => {
      const dt = new Date(e.t), jour = isoJour(dt);
      if (jour !== jourCourant) {
        if (jourCourant) html += "</ul>";
        jourCourant = jour;
        html += `<h3 class="groupe">${jour === auj ? "Aujourd’hui" : jour === hier ? "Hier" : majuscule(dt.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long", year: "numeric" }))}</h3><ul class="liste journal">`;
      }
      const a = ACTIONS_J[e.action] || { l: e.action, g: "" }, href = this.lien(e);
      html += `<li><span class="log-h">${dt.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })}</span><span class="puce s${a.g}">${a.l}</span>
        <div class="infos">${href ? `<a href="${href}"><b>${echapper(e.libelle)}</b></a>` : `<b>${echapper(e.libelle)}</b>`}${e.details ? `<small>${echapper(e.details)}</small>` : ""}</div></li>`;
    });
    html += "</ul>";
    return `<div class="card">${html}${l.length > FiltresJ.max ? `<div style="margin-top:16px"><button class="btn sec" data-action="journal-plus">Afficher les entrées plus anciennes (${l.length - FiltresJ.max} restantes)</button></div>` : ""}</div>`;
  },
  majZone() {
    const z = $("#zone-journal"); if (!z) return;
    const l = Journal.lire();
    if (l && l.length && !$("[data-fj=q]")) { App.afficher(true); return; }  // le journal était vide : on réaffiche la page complète (filtres, boutons)

      ${l.length ? `<div class="outils"><input class="recherche" type="search" data-fj="q" value="${echapper(FiltresJ.q)}" placeholder="Rechercher (nom, titre, action…)" aria-label="Rechercher dans le journal">
        <select data-fj="objet" aria-label="Filtrer par type d’élément"><option value="">Tous les éléments</option>${Object.entries(OBJETS_J).map(([k, v]) => `<option value="${k}"${k === FiltresJ.objet ? " selected" : ""}>${v}</option>`).join("")}</select></div>` : ""}

  },
  exporterCsv() {

    const lignes = [["Date", "Heure", "Action", "Élément", "Description", "Détails"].join(";")];
    l.forEach(e => { const dt = new Date(e.t); lignes.push([dt.toLocaleDateString("fr-FR"), dt.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }), (ACTIONS_J[e.action] || {}).l || e.action,
      { contact: "Contact", evenement: "Événement", operation: "Opération", tache: "Tâche", rdv: "Rendez-vous", regle: "Automatisation", donnees: "Données" }[e.objet] || e.objet || "", e.libelle, e.details || ""].map(cell).join(";")); });
    const nom = `journal-crm-photographe-${isoJour(new Date())}.csv`;
    telechargerFichier("﻿" + lignes.join("\r\n") + "\r\n", nom, "text/csv;charset=utf-8");
    toast(`Journal exporté (${nom}).`);
  },
  async vider() {
    const l = Journal.lire();
    if (!await confirmer("Vider le journal ?", `${l ? `Les ${l.length} entrées du journal seront effacées. ` : ""}Vos données (contacts, événements, tâches, rendez-vous) ne sont pas concernées.<p style="margin-top:10px">Conseil : exportez-le d’abord si vous souhaitez en garder une trace.</p>`, "Vider le journal")) return;
    try { localStorage.setItem(CLE_JOURNAL, JSON.stringify({ version: 1, entrees: [] })); } catch (e) { informer("Impossible de vider le journal", "Le stockage du navigateur n’a pas pu être modifié."); return; }
    Journal.noter("donnees", "donnees", "Journal vidé", { details: l ? `${l.length} entrées effacées` : "journal illisible remplacé" });
    toast("Journal vidé."); App.afficher(true);
  }
};

/* ---------- 2m. Import de contacts (Excel .xlsx ou CSV) ----------
   Lecture 100 % locale, sans bibliothèque : un .xlsx est une archive ZIP de fichiers XML, décompressée par le
   navigateur (DecompressionStream). Parcours : fichier → correspondance des colonnes → aperçu (doublons, erreurs)
   → import en une seule fois → possibilité d’annuler l’import. */
const LecteurTableur = {
  async zip(buf) {
    const v = new DataView(buf), u8 = new Uint8Array(buf), fichiers = {};
    let e = -1;
    for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 65557); i--) if (v.getUint32(i, true) === 0x06054b50) { e = i; break; }
    if (e < 0) throw new Error("Ce fichier n’est pas un classeur Excel valide (.xlsx).");
    let p = v.getUint32(e + 16, true);
    for (let k = 0, n = v.getUint16(e + 10, true); k < n; k++) {
      if (v.getUint32(p, true) !== 0x02014b50) throw new Error("Ce classeur Excel est endommagé.");
      const lNom = v.getUint16(p + 28, true);
      fichiers[new TextDecoder().decode(u8.subarray(p + 46, p + 46 + lNom))] = { methode: v.getUint16(p + 10, true), taille: v.getUint32(p + 20, true), off: v.getUint32(p + 42, true) };
      p += 46 + lNom + v.getUint16(p + 30, true) + v.getUint16(p + 32, true);
    }
    return async nom => {
      const f = fichiers[nom]; if (!f) return null;
      const debut = f.off + 30 + v.getUint16(f.off + 26, true) + v.getUint16(f.off + 28, true), data = u8.subarray(debut, debut + f.taille);
      if (f.methode === 0) return new TextDecoder().decode(data);
      if (f.methode !== 8 || typeof DecompressionStream !== "function") throw new Error("Ce navigateur ne sait pas lire ce classeur. Enregistrez-le au format CSV depuis Excel, puis importez le fichier CSV.");
      return new TextDecoder().decode(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer());
    };
  },
  async xlsx(buf) {
    const lire = await this.zip(buf), xml = t => new DOMParser().parseFromString(t, "application/xml");
    const wb = await lire("xl/workbook.xml");
    if (!wb) throw new Error("Ce fichier n’est pas un classeur Excel (.xlsx).");
    const feuille = xml(wb).getElementsByTagName("sheet")[0];  // première feuille du classeur
    let chemin = "xl/worksheets/sheet1.xml";
    const rid = feuille && (feuille.getAttribute("r:id") || feuille.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships", "id"));
    const rels = await lire("xl/_rels/workbook.xml.rels");
    if (rels && rid) {
      const r = [...xml(rels).getElementsByTagName("Relationship")].find(x => x.getAttribute("Id") === rid);
      if (r) { const t = r.getAttribute("Target"); chemin = t.startsWith("/") ? t.slice(1) : "xl/" + t.replace(/^\.\//, ""); }
    }
    const ssT = await lire("xl/sharedStrings.xml");
    const textes = el => [...el.getElementsByTagName("t")].filter(t => t.parentNode.nodeName !== "rPh").map(t => t.textContent).join("");
    const partages = ssT ? [...xml(ssT).getElementsByTagName("si")].map(textes) : [];
    const ws = await lire(chemin);
    if (!ws) throw new Error("La première feuille du classeur est introuvable.");
    const col = ref => { let n = 0; for (const ch of ref.replace(/[^A-Z]/gi, "").toUpperCase()) n = n * 26 + ch.charCodeAt(0) - 64; return n - 1; };
    const lignes = [];
    for (const row of xml(ws).getElementsByTagName("row")) {
      const cells = []; let i = 0;
      for (const c of row.getElementsByTagName("c")) {
        const ref = c.getAttribute("r"); if (ref) i = col(ref);
        const t = c.getAttribute("t"), vEl = c.getElementsByTagName("v")[0];
        cells[i++] = t === "s" ? (partages[+(vEl && vEl.textContent)] ?? "") : t === "inlineStr" ? textes(c) : t === "b" ? (vEl && vEl.textContent === "1" ? "VRAI" : "FAUX") : (vEl ? vEl.textContent : "");
      }
      lignes.push(Array.from(cells, x => (x ?? "").trim()));
    }
    return lignes;
  },
  csv(texte) {
    texte = texte.replace(/^﻿/, "");
    const premiere = texte.split(/\r?\n/)[0] || "";
    const sep = [";", ",", "\t"].sort((a, b) => premiere.split(b).length - premiere.split(a).length)[0];
    const lignes = []; let ligne = [], champ = "", guill = false;
    for (let i = 0; i < texte.length; i++) {
      const ch = texte[i];
      if (guill) { if (ch === '"') { if (texte[i + 1] === '"') { champ += '"'; i++; } else guill = false; } else champ += ch; }
      else if (ch === '"' && champ === "") guill = true;
      else if (ch === sep) { ligne.push(champ.trim()); champ = ""; }
      else if (ch === "\n" || ch === "\r") { if (ch === "\r" && texte[i + 1] === "\n") i++; ligne.push(champ.trim()); lignes.push(ligne); ligne = []; champ = ""; }
      else champ += ch;
    }
    if (champ || ligne.length) { ligne.push(champ.trim()); lignes.push(ligne); }
    return lignes;
  },
  async lire(f) {
    const nom = f.name.toLowerCase(), buf = await f.arrayBuffer();
    if (nom.endsWith(".xls") && !nom.endsWith(".xlsx")) throw new Error("Les anciens fichiers Excel (.xls) ne sont pas pris en charge. Dans Excel, choisissez « Enregistrer sous » puis le format « Classeur Excel (.xlsx) » ou « CSV UTF-8 ».");
    if (nom.endsWith(".xlsx") || new Uint8Array(buf.slice(0, 2)).join() === "80,75") return this.xlsx(buf);
    let texte;
    try { texte = new TextDecoder("utf-8", { fatal: true }).decode(buf); } catch (e) { texte = new TextDecoder("windows-1252").decode(buf); }  // anciens CSV d’Excel
    return this.csv(texte);
  }
};

const CHAMPS_IMPORT = { "": "— Ignorer cette colonne —", prenom: "Prénom", nom: "Nom", nomComplet: "Prénom et nom (même colonne)", email: "E-mail", telephone: "Téléphone",
  entreprise: "Entreprise", adresse: "Adresse", codePostal: "Code postal", ville: "Ville", type: "Type de contact", origine: "Source", notes: "Notes" };
const SYNONYMES_IMPORT = {
  prenom: ["prenom", "prenoms", "firstname", "givenname"], nom: ["nom", "nomdefamille", "lastname", "surname", "familyname"],
  nomComplet: ["nomcomplet", "name", "nometprenom", "prenometnom", "nomprenom", "prenomnom", "client", "cliente", "contact", "fullname", "displayname"],
  email: ["email", "mail", "courriel", "adresseemail", "adressemail", "adresseelectronique", "emailaddress"],
  telephone: ["telephone", "tel", "portable", "mobile", "phone", "numero", "numerodetelephone", "gsm", "telephonemobile", "telportable"],
  entreprise: ["entreprise", "societe", "company", "organisation", "organization", "raisonsociale"],
  adresse: ["adresse", "adressepostale", "rue", "address", "street", "voie", "adresse1"], codePostal: ["codepostal", "cp", "postalcode", "zip", "zipcode"],
  ville: ["ville", "commune", "city", "localite"], type: ["type", "typedecontact", "categorie", "category"],
  origine: ["source", "origine", "provenance", "canal", "originecontact", "origineducontact"], notes: ["notes", "note", "commentaire", "commentaires", "remarque", "remarques", "observations"]
};

const ImportC = {
  etat: null,  // { fichier, entetes, lignes, mapping, doublons, resultat }
  deviner(entete) {
    const n = norm(entete).replace(/[^a-z0-9]/g, "");
    return Object.keys(SYNONYMES_IMPORT).find(k => SYNONYMES_IMPORT[k].includes(n)) || "";
  },
  async charger(f) {
    if (f.size > 15 * 1024 * 1024) { informer("Fichier trop volumineux", "Ce fichier dépasse 15 Mo. Gardez uniquement la feuille des contacts, puis réessayez."); return; }
    let lignes;
    try { lignes = await LecteurTableur.lire(f); }
    catch (e) { informer("Lecture impossible", `${e.message && !/^[A-Z][a-z]+Error/.test(e.name) ? e.message : "Ce fichier n’a pas pu être lu."}<p style="margin-top:10px">Formats acceptés : Excel (.xlsx) et CSV. Rien n’a été importé.</p>`); return; }
    lignes = lignes.filter(l => l.some(x => x !== ""));
    if (lignes.length < 2) { informer("Aucun contact trouvé", "Le fichier doit contenir une ligne de titres (Prénom, Nom, E-mail…) puis au moins une ligne de contact. Rien n’a été importé."); return; }
    if (lignes.length > 5001) { informer("Trop de lignes", "L’import est limité à 5 000 contacts à la fois. Découpez le fichier en plusieurs parties. Rien n’a été importé."); return; }
    const larg = Math.max(...lignes.map(l => l.length)), entetes = Array.from({ length: larg }, (_, i) => lignes[0][i] || `Colonne ${i + 1}`);
    const mapping = entetes.map(h => this.deviner(h));
    // Une même cible devinée deux fois : seule la première colonne est retenue (sauf les notes, qui s’additionnent)
    mapping.forEach((m, i) => { if (m && m !== "notes" && mapping.indexOf(m) !== i) mapping[i] = ""; });
    this.etat = { fichier: f.name, entetes, lignes: lignes.slice(1).map(l => Array.from({ length: larg }, (_, i) => l[i] || "")), mapping, doublons: "ignorer", resultat: null };
    App.afficher();
  },
  /* Transforme une ligne en contact, avec les corrections utiles */
  convertir(l) {
    const m = this.etat.mapping, c = { prenom: "", nom: "", entreprise: "", email: "", telephone: "", adresse: "", codePostal: "", ville: "", type: "particulier", origine: "", notes: "" }, notes = [], alertes = [];
    m.forEach((k, i) => {
      const v = (l[i] || "").replace(/\s+/g, " ").trim(); if (!k || !v) return;
      if (k === "notes") notes.push(l[i].trim());
      else if (k === "nomComplet") { const mots = v.split(" "); if (!c.prenom && !c.nom) { c.prenom = mots.length > 1 ? mots[0] : ""; c.nom = mots.length > 1 ? mots.slice(1).join(" ") : mots[0]; } }
      else if (k === "type") { const t = Object.keys(TYPES).find(x => norm(TYPES[x]) === norm(v) || norm(x) === norm(v)); if (t) c.type = t; else { c.type = "autre"; notes.push("Type : " + v); } }
      else if (k === "origine") { const o = Object.keys(ORIGINES).find(x => norm(ORIGINES[x]) === norm(v) || norm(x) === norm(v)); if (o) c.origine = o; else { c.origine = "autre"; notes.push("Source : " + v); } }
      else c[k] = v;
    });
    if (!c.prenom && !c.nom && c.entreprise) c.nom = c.entreprise;
    // Téléphone : Excel enlève souvent le 0 initial (612345678) ou transforme +33… en 33…
    let tel = c.telephone.replace(/\.0$/, "");
    if (/^\d{9}$/.test(tel) && /^[1-9]/.test(tel)) tel = "0" + tel;
    if (/^33\d{9}$/.test(tel)) tel = "+" + tel;
    if (/^0\d{9}$/.test(tel)) tel = tel.replace(/(\d{2})(?=\d)/g, "$1 ");
    c.telephone = tel;
    if (c.email && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(c.email)) { notes.push("E-mail d’origine (invalide) : " + c.email); alertes.push("e-mail invalide déplacé dans les notes"); c.email = ""; }
    if (c.telephone && (!/^[+\d\s().-]+$/.test(c.telephone) || c.telephone.replace(/\D/g, "").length < 6)) { notes.push("Téléphone d’origine (invalide) : " + c.telephone); alertes.push("téléphone invalide déplacé dans les notes"); c.telephone = ""; }
    c.codePostal = c.codePostal.replace(/\.0$/, "");
    if (/^\d{4}$/.test(c.codePostal)) c.codePostal = "0" + c.codePostal;  // 1000 → 01000
    c.notes = notes.join("\n");
    return { c, alertes };
  },
  /* Analyse complète : contacts valides, lignes sans nom, doublons (déjà présents ou répétés dans le fichier) */
  analyser() {
    const cles = c => [c.email ? "m:" + c.email.toLowerCase() : "", c.telephone.replace(/\D/g, "").length >= 9 ? "t:" + c.telephone.replace(/\D/g, "").slice(-9) : "", "n:" + norm(c.prenom + " " + c.nom).replace(/\s+/g, " ").trim()].filter(Boolean);
    const existants = new Set(Stockage.contacts.flatMap(c => cles({ ...c, telephone: c.telephone || "" })));
    const vus = new Set(), res = { ok: [], doublons: [], sansNom: [], alertes: 0 };
    this.etat.lignes.forEach((l, i) => {
      if (!l.some(x => x)) return;
      const { c, alertes } = this.convertir(l);
      if (!c.prenom && !c.nom) { res.sansNom.push(i + 2); return; }
      const k = cles(c), dup = k.some(x => existants.has(x) || vus.has(x));
      k.forEach(x => vus.add(x));
      if (alertes.length) res.alertes++;
      (dup ? res.doublons : res.ok).push({ c, ligne: i + 2, alertes });
    });
    return res;
  },
  page() {
    const E = this.etat;
    const entete = `<a class="retour" href="#contacts">Retour aux contacts</a><div class="entete"><div><h1>Importer des contacts</h1><p>Depuis un fichier Excel (.xlsx) ou CSV.</p></div></div>`;
    if (Stockage.etat === "corrompu") return `<div class="page narrow">${entete}${Contacts.bandeau()}</div>`;
    if (E && E.resultat) {
      const r = E.resultat;
      return `<div class="page narrow">${entete}<section class="card"><h2><em>${r.n} contact${r.n > 1 ? "s" : ""} importé${r.n > 1 ? "s" : ""}</em></h2>
        <p style="margin:10px 0 18px">Depuis « ${echapper(E.fichier)} »${r.ignores ? ` · ${r.ignores} ligne${r.ignores > 1 ? "s" : ""} non importée${r.ignores > 1 ? "s" : ""} (doublons ou sans nom)` : ""}.</p>
        <div class="actions"><a class="btn" href="#contacts" data-action="import-fin">Voir les contacts</a>${r.annulable ? `<button class="btn danger sec" data-action="import-annuler">Annuler cet import</button>` : ""}</div>
        ${r.annulable ? `<p class="aide" style="margin-top:14px">Une erreur ? « Annuler cet import » supprime les contacts qui viennent d’être ajoutés (sauf ceux que vous avez déjà reliés à un événement, une tâche ou un rendez-vous).</p>` : ""}</section></div>`;
    }
    if (!E) return `<div class="page narrow">${entete}
      <section class="card"><h2>1. Choisir le fichier</h2>
        <p style="margin:8px 0 16px">La première ligne doit contenir les titres des colonnes (par exemple : Prénom, Nom, E-mail, Téléphone, Adresse, Code postal, Ville). Les colonnes sont reconnues automatiquement, et vous pourrez vérifier avant d’importer : rien n’est enregistré à cette étape.</p>
        <input type="file" id="fichier-import" accept=".xlsx,.csv,.txt,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv" hidden>
        <div class="actions"><button class="btn" data-action="import-choisir">Choisir un fichier…</button><button class="btn sec" data-action="import-modele">Télécharger un modèle</button></div>
        <p class="aide" style="margin-top:14px">Formats acceptés : Excel (.xlsx) et CSV. Pour un ancien fichier .xls, ouvrez-le dans Excel puis « Enregistrer sous » au format .xlsx. Seule la première feuille du classeur est lue.</p></section></div>`;
    const a = this.analyser(), choisi = E.doublons === "importer" ? a.ok.length + a.doublons.length : a.ok.length;
    const exemple = i => { const v = E.lignes.map(l => l[i]).find(x => x); return v ? echapper(v.length > 40 ? v.slice(0, 38) + "…" : v) : '<span class="vide">vide</span>'; };
    const apercu = [...a.ok, ...(E.doublons === "importer" ? a.doublons : [])].sort((x, y) => x.ligne - y.ligne).slice(0, 8);
    const sansNomOuPrenom = !E.mapping.some(m => ["prenom", "nom", "nomComplet", "entreprise"].includes(m));
    return `<div class="page">${entete}
      <section class="card"><div class="sec-tete"><h2>2. Vérifier les colonnes</h2><button class="btn sec petit" data-action="import-recommencer">Choisir un autre fichier</button></div>
        <p class="vide" style="margin:-6px 0 14px">Fichier « ${echapper(E.fichier)} » · ${E.lignes.length} ligne${E.lignes.length > 1 ? "s" : ""}. Indiquez à quoi correspond chaque colonne.</p>
        <div class="table-import"><table class="mapping"><thead><tr><th>Colonne du fichier</th><th>Exemple</th><th>Correspond à</th></tr></thead><tbody>
        ${E.entetes.map((h, i) => `<tr><td><b>${echapper(h)}</b></td><td>${exemple(i)}</td><td><select data-map="${i}" aria-label="Correspondance de la colonne ${echapper(h)}">${Object.entries(CHAMPS_IMPORT).map(([k, l]) => `<option value="${k}"${k === E.mapping[i] ? " selected" : ""}>${l}</option>`).join("")}</select></td></tr>`).join("")}
        </tbody></table></div>
        ${sansNomOuPrenom ? `<div class="bandeau r" style="margin:14px 0 0">Aucune colonne ne correspond au nom : choisissez au moins « Prénom », « Nom » ou « Prénom et nom ».</div>` : ""}</section>
      <section class="card" style="margin-top:18px"><h2>3. Vérifier avant d’importer</h2>
        <ul class="bilan-import">
          <li><b>${a.ok.length}</b> nouveau${a.ok.length > 1 ? "x" : ""} contact${a.ok.length > 1 ? "s" : ""} prêt${a.ok.length > 1 ? "s" : ""} à importer</li>
          ${a.doublons.length ? `<li class="att"><b>${a.doublons.length}</b> doublon${a.doublons.length > 1 ? "s" : ""} : même e-mail, même téléphone ou même nom qu’un contact existant (ou répété dans le fichier)</li>` : ""}
          ${a.sansNom.length ? `<li class="att"><b>${a.sansNom.length}</b> ligne${a.sansNom.length > 1 ? "s" : ""} sans nom, ignorée${a.sansNom.length > 1 ? "s" : ""} (ligne${a.sansNom.length > 1 ? "s" : ""} ${a.sansNom.slice(0, 10).join(", ")}${a.sansNom.length > 10 ? "…" : ""})</li>` : ""}
          ${a.alertes ? `<li class="att"><b>${a.alertes}</b> contact${a.alertes > 1 ? "s" : ""} avec un e-mail ou un téléphone incorrect : la valeur d’origine est conservée dans les notes</li>` : ""}
        </ul>
        ${a.doublons.length ? `<fieldset class="choix-doublons"><legend>Que faire des doublons ?</legend>
          <label class="coche"><input type="radio" name="doublons" value="ignorer" data-doublons${E.doublons === "ignorer" ? " checked" : ""}> Ne pas les importer (recommandé)</label>

        ${apercu.length ? `<p class="vide" style="margin:16px 0 8px">Aperçu${choisi > apercu.length ? ` des ${apercu.length} premiers` : ""} :</p>
          <div class="table-import"><table><thead><tr><th>Prénom</th><th>Nom</th><th>E-mail</th><th>Téléphone</th><th>Ville</th></tr></thead><tbody>
          ${apercu.map(({ c, alertes }) => `<tr${alertes.length ? ' class="alerte-l" title="' + echapper(alertes.join(", ")) + '"' : ""}><td>${echapper(c.prenom)}</td><td>${echapper(c.nom)}</td><td>${echapper(c.email)}</td><td>${echapper(c.telephone)}</td><td>${echapper(c.ville)}</td></tr>`).join("")}
          </tbody></table></div>` : ""}
        <div class="actions" style="margin-top:20px"><button class="btn" data-action="import-valider"${choisi && !sansNomOuPrenom ? "" : " disabled"}>Importer ${choisi} contact${choisi > 1 ? "s" : ""}</button><a class="btn sec" href="#contacts" data-action="import-fin">Annuler</a></div></section></div>`;
  },
  valider() {
    const E = this.etat; if (!E || Stockage.etat === "corrompu") return;
    const a = this.analyser(), liste = [...a.ok, ...(E.doublons === "importer" ? a.doublons : [])].sort((x, y) => x.ligne - y.ligne).map(x => x.c);
    if (!liste.length) return;
    const r = Stockage.creerPlusieurs(liste);
    Journal.noter("creation", "contact", `Import de ${liste.length} contact${liste.length > 1 ? "s" : ""}`, { details: `Fichier « ${E.fichier} »${a.doublons.length && E.doublons !== "importer" ? ` · ${a.doublons.length} doublon(s) ignoré(s)` : ""}${a.sansNom.length ? ` · ${a.sansNom.length} ligne(s) sans nom ignorée(s)` : ""}` });
    E.resultat = { n: liste.length, ids: r.ids, ignores: E.lignes.filter(l => l.some(x => x)).length - liste.length, annulable: true };
    retour(r.ok, `${liste.length} contact${liste.length > 1 ? "s" : ""} importé${liste.length > 1 ? "s" : ""}.`, "Contacts importés." + MSG_NON_SAUVE);

  },
  async annuler() {
    const r = this.etat && this.etat.resultat; if (!r) return;
    const lies = new Set([...StockageDossiers.dossiers.map(d => d.contactId), ...StockageTaches.taches.map(t => t.contactId), ...StockageRdv.rdv.map(x => x.contactId)]);
    const supp = r.ids.filter(id => Stockage.get(id) && !lies.has(id)), gardes = r.ids.filter(id => Stockage.get(id) && lies.has(id)).length;
    if (!await confirmer("Annuler cet import ?", `${supp.length} contact${supp.length > 1 ? "s" : ""} importé${supp.length > 1 ? "s" : ""} ser${supp.length > 1 ? "ont" : "a"} supprimé${supp.length > 1 ? "s" : ""}.${gardes ? `<p style="margin-top:10px">${gardes} contact${gardes > 1 ? "s" : ""} déjà relié${gardes > 1 ? "s" : ""} à un événement, une tâche ou un rendez-vous ser${gardes > 1 ? "ont" : "a"} conservé${gardes > 1 ? "s" : ""}.</p>` : ""}`, "Annuler l’import")) return;
    const asupp = new Set(supp);
    Stockage.contacts = Stockage.contacts.filter(c => !asupp.has(c.id));
    const ok = Stockage.enregistrer();
    Journal.noter("suppression", "contact", `Import annulé : ${supp.length} contact${supp.length > 1 ? "s" : ""} retiré${supp.length > 1 ? "s" : ""}`, { details: `Fichier « ${this.etat.fichier} »${gardes ? ` · ${gardes} conservé(s) car déjà utilisé(s)` : ""}` });
    this.etat = null;
    retour(ok, "Import annulé.", "Import annulé." + MSG_NON_SAUVE);
    location.hash = "#contacts";
  },
  modele() {
    const l = ["Prénom", "Nom", "E-mail", "Téléphone", "Entreprise", "Adresse", "Code postal", "Ville", "Type de contact", "Source", "Notes"].join(";");
    telechargerFichier("﻿" + l + "\r\n", "modele-import-contacts.csv", "text/csv;charset=utf-8");
  }
};

/* ---------- 2n. Import d’événements (Excel .xlsx ou CSV) ----------
   Même parcours que les contacts. Chaque événement est rattaché à un contact : retrouvé par e-mail, téléphone ou
   nom, ou créé s’il manque (au choix). Les automatisations ne sont déclenchées que si on le demande. */
const normTel = t => {
  t = String(t || "").replace(/\.0$/, "").trim();
  if (/^\d{9}$/.test(t) && /^[1-9]/.test(t)) t = "0" + t;  // 0 initial supprimé par Excel
  if (/^33\d{9}$/.test(t)) t = "+" + t;
  return /^0\d{9}$/.test(t) ? t.replace(/(\d{2})(?=\d)/g, "$1 ") : t;
};
const MOIS_FR = { janvier: 1, janv: 1, jan: 1, fevrier: 2, fevr: 2, fev: 2, mars: 3, avril: 4, avr: 4, mai: 5, juin: 6, juillet: 7, juil: 7, aout: 8, septembre: 9, sept: 9, sep: 9, octobre: 10, oct: 10, novembre: 11, nov: 11, decembre: 12, dec: 12 };
/* Date de prestation : nombre Excel (46376), 20/12/2026, 20/12/26, 2026-12-20, « samedi 20 décembre 2026 »… → AAAA-MM-JJ ; null si illisible */
const lireDateImport = v => {
  v = String(v || "").trim(); if (!v) return "";
  const ok = (y, m, d) => { const iso = `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`, dt = new Date(+y, m - 1, d, 12); return !isNaN(dt) && isoJour(dt) === iso ? iso : null; };  // refuse le 30/02
  if (/^\d{5}(\.\d+)?$/.test(v)) { const n = Math.floor(+v); if (n > 20000 && n < 80000) return new Date(Date.UTC(1899, 11, 30) + n * 864e5).toISOString().slice(0, 10); }
  let m = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if (m) return ok(m[1], +m[2], +m[3]);
  m = v.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2}|\d{4})(\s.*)?$/); if (m) return ok(m[3].length === 2 ? "20" + m[3] : m[3], +m[2], +m[1]);
  m = norm(v).replace(/,/g, " ").match(/^(?:[a-z]+\.?\s+)?(\d{1,2})(?:er)?\s+([a-z]+)\.?\s+(\d{4})$/);
  if (m && MOIS_FR[m[2]]) return ok(m[3], MOIS_FR[m[2]], +m[1]);
  return null;
};

const CHAMPS_IMPORT_EV = { "": "— Ignorer cette colonne —", titre: "Titre de l’événement", date: "Date de prestation", type: "Type de prestation", statut: "Statut", montant: "Montant (€)", acompte: "Montant de l’acompte (€)", acompteVerse: "Acompte versé (oui / non)", notes: "Notes",
  contactNomComplet: "Contact : prénom et nom (même colonne)", contactPrenom: "Contact : prénom", contactNom: "Contact : nom", contactEmail: "Contact : e-mail", contactTel: "Contact : téléphone" };
const SYNONYMES_IMPORT_EV = {
  titre: ["titre", "evenement", "intitule", "nomdelevenement", "titredelevenement", "libelle", "seance", "projet", "dossier"],
  date: ["date", "datedeprestation", "dateprestation", "jour", "dateevenement", "datedelevenement", "datedelaseance", "dateseance", "datemariage"],
  type: ["type", "prestation", "typedeprestation", "typedeseance", "categorie", "formule"],
  statut: ["statut", "etat", "status", "avancement", "etape"],
  montant: ["montant", "prix", "tarif", "montantestime", "total", "budget", "ttc", "montantttc", "devis"],
  acompte: ["acompte", "montantacompte", "montantdelacompte", "arrhes", "acompteeur"], acompteVerse: ["acompteverse", "acomptepaye", "acompterecu", "acompteregle", "acompteencaisse", "verse"],
  notes: ["notes", "note", "commentaire", "commentaires", "remarque", "remarques", "observations"],
  contactNomComplet: ["client", "cliente", "contact", "nomcomplet", "nomduclient", "nomdelacliente", "clients", "couple", "nometprenom", "prenometnom"],
  contactPrenom: ["prenom", "prenomduclient", "prenomclient", "firstname"], contactNom: ["nom", "nomclient", "lastname", "nomdefamille"],
  contactEmail: ["email", "mail", "courriel", "adresseemail", "adressemail", "emailclient"],
  contactTel: ["telephone", "tel", "portable", "mobile", "phone", "telephoneclient", "numero"]
};

const ImportE = {
  etat: null,  // { fichier, entetes, lignes, mapping, doublons, manquants, auto, resultat }
  deviner(h) { const n = norm(h).replace(/[^a-z0-9]/g, ""); return Object.keys(SYNONYMES_IMPORT_EV).find(k => SYNONYMES_IMPORT_EV[k].includes(n)) || ""; },
  async charger(f) {
    if (f.size > 15 * 1024 * 1024) { informer("Fichier trop volumineux", "Ce fichier dépasse 15 Mo. Gardez uniquement la feuille des événements, puis réessayez."); return; }
    let lignes;
    try { lignes = await LecteurTableur.lire(f); }
    catch (e) { informer("Lecture impossible", `${e.message && !/^[A-Z][a-z]+Error/.test(e.name) ? e.message : "Ce fichier n’a pas pu être lu."}<p style="margin-top:10px">Formats acceptés : Excel (.xlsx) et CSV. Rien n’a été importé.</p>`); return; }
    lignes = lignes.filter(l => l.some(x => x !== ""));
    if (lignes.length < 2) { informer("Aucun événement trouvé", "Le fichier doit contenir une ligne de titres (Date, Titre, Client…) puis au moins une ligne d’événement. Rien n’a été importé."); return; }
    if (lignes.length > 3001) { informer("Trop de lignes", "L’import est limité à 3 000 événements à la fois. Découpez le fichier en plusieurs parties. Rien n’a été importé."); return; }
    const larg = Math.max(...lignes.map(l => l.length)), entetes = Array.from({ length: larg }, (_, i) => lignes[0][i] || `Colonne ${i + 1}`);
    const mapping = entetes.map(h => this.deviner(h));
    mapping.forEach((m, i) => { if (m && m !== "notes" && mapping.indexOf(m) !== i) mapping[i] = ""; });
    this.etat = { fichier: f.name, entetes, lignes: lignes.slice(1).map(l => Array.from({ length: larg }, (_, i) => l[i] || "")), mapping, doublons: "ignorer", manquants: "creer", auto: false, resultat: null };
    App.afficher();
  },
  /* Index des contacts existants (e-mail, téléphone, nom) */
  index() {
    const m = new Map();
    Stockage.contacts.forEach(c => this.cles(c).forEach(k => { if (!m.has(k)) m.set(k, c); }));
    return m;
  },
  cles(c) {
    const t = String(c.telephone || "").replace(/\D/g, "");
    return [c.email ? "m:" + c.email.toLowerCase() : "", t.length >= 9 ? "t:" + t.slice(-9) : "", (c.prenom || c.nom) ? "n:" + norm(`${c.prenom || ""} ${c.nom || ""}`).replace(/\s+/g, " ").trim() : ""].filter(Boolean);
  },
  convertir(l, idx) {
    const ev = { titre: "", type: "autre", statut: "nouvelle", datePrestation: "", montant: null, acompte: null, acompteVerse: false, notes: "" }, ct = { prenom: "", nom: "", email: "", telephone: "" }, notes = [], alertes = [];
    this.etat.mapping.forEach((k, i) => {
      const brut = (l[i] || "").trim(), v = brut.replace(/\s+/g, " "); if (!k || !v) return;
      if (k === "titre") ev.titre = v;
      else if (k === "notes") notes.push(brut);
      else if (k === "date") { const d = lireDateImport(v); if (d === null) { notes.push("Date d’origine : " + v); alertes.push("date illisible"); } else ev.datePrestation = d; }
      else if (k === "montant") { const n = parseMontant(v.replace(/\s/g, "").replace(/EUR$/i, "")); if (n === null || Number.isNaN(n)) { notes.push("Montant d’origine : " + v); alertes.push("montant illisible"); } else ev.montant = Math.round(n * 100) / 100; }
      else if (k === "acompte") { const n = parseMontant(v.replace(/\s/g, "").replace(/EUR$/i, "")); if (n === null || Number.isNaN(n)) { notes.push("Acompte d’origine : " + v); alertes.push("acompte illisible"); } else ev.acompte = Math.round(n * 100) / 100; }
      else if (k === "acompteVerse") ev.acompteVerse = /^(oui|o|yes|y|x|vrai|true|1|ok|verse|versee|paye|payee|recu|recue|regle|reglee|encaisse)$/.test(norm(v).replace(/[^a-z0-9]/g, ""));
      else if (k === "type") { const t = Object.keys(PRESTATIONS).find(x => norm(PRESTATIONS[x]) === norm(v) || norm(x) === norm(v)) || Object.keys(PRESTATIONS).find(x => x !== "autre" && norm(v).includes(norm(PRESTATIONS[x]))); if (t) ev.type = t; else notes.push("Prestation : " + v); }
      else if (k === "statut") { const s = Object.keys(STATUTS).find(x => norm(STATUTS[x].l) === norm(v)) || Object.keys(STATUTS).find(x => norm(STATUTS[x].l).includes(norm(v))); if (s) ev.statut = s; else { notes.push("Statut d’origine : " + v); alertes.push("statut inconnu"); } }
      else if (k === "contactNomComplet") { if (!ct.prenom && !ct.nom) { const mots = v.split(" "); ct.prenom = mots.length > 1 ? mots[0] : ""; ct.nom = mots.length > 1 ? mots.slice(1).join(" ") : mots[0]; } }
      else if (k === "contactPrenom") ct.prenom = v;
      else if (k === "contactNom") ct.nom = v;
      else if (k === "contactEmail") ct.email = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v) ? v.toLowerCase() : (notes.push("E-mail du contact (invalide) : " + v), "");
      else if (k === "contactTel") ct.telephone = normTel(v);
    });
    if (ev.acompteVerse && ev.acompte === null) { ev.acompteVerse = false; notes.push("Acompte indiqué comme versé, sans montant"); alertes.push("acompte sans montant"); }
    if (ev.acompte !== null && ev.montant !== null && ev.acompte > ev.montant) { notes.push(`Acompte d’origine (supérieur au montant) : ${euros(ev.acompte)}`); alertes.push("acompte supérieur au montant"); ev.acompte = null; ev.acompteVerse = false; }
    ev.notes = notes.join("\n");
    if (ct.telephone && (!/^[+\d\s().-]+$/.test(ct.telephone) || ct.telephone.replace(/\D/g, "").length < 6)) ct.telephone = "";
    const cles = this.cles(ct), existant = cles.map(k => idx.get(k)).find(Boolean) || null;
    return { ev, ct, cles, existant, alertes };
  },
  analyser() {
    const idx = this.index(), res = { ok: [], doublons: [], sansContact: [], nouveaux: new Map(), alertes: 0 }, vus = new Set();
    const evCle = (cid, date, titre) => `${cid}|${date}|${norm(titre)}`;
    const existants = new Set(StockageDossiers.dossiers.map(d => evCle(d.contactId, d.datePrestation, d.titre)));
    this.etat.lignes.forEach((l, i) => {
      if (!l.some(x => x)) return;
      const r = this.convertir(l, idx);
      if (!r.cles.length) { res.sansContact.push(i + 2); return; }
      let cid;
      if (r.existant) cid = r.existant.id;
      else {  // contact à créer (un seul par personne, même s’il apparaît sur plusieurs lignes)
        let cle = r.cles.find(k => res.nouveaux.has(k));
        if (!cle) { cle = r.cles[0]; res.nouveaux.set(cle, { prenom: r.ct.prenom, nom: r.ct.nom || r.ct.email || r.ct.telephone, email: r.ct.email, telephone: r.ct.telephone }); }
        r.cles.forEach(k => { if (!res.nouveaux.has(k)) res.nouveaux.set(k, res.nouveaux.get(cle)); });
        r.nouveau = res.nouveaux.get(cle); cid = "nouveau:" + cle;
      }
      const c = r.existant || r.nouveau;
      if (!r.ev.titre) r.ev.titre = `${r.ev.type !== "autre" ? PRESTATIONS[r.ev.type] : "Événement"} ${c.nom || c.prenom}`.trim();
      const k = evCle(cid, r.ev.datePrestation, r.ev.titre), dup = existants.has(k) || vus.has(k);
      vus.add(k); if (r.alertes.length) res.alertes++;
      (dup ? res.doublons : res.ok).push({ ...r, ligne: i + 2 });
    });
    return res;
  },
  selection(a) {
    const E = this.etat;
    return [...a.ok, ...(E.doublons === "importer" ? a.doublons : [])].filter(x => x.existant || E.manquants === "creer").sort((x, y) => x.ligne - y.ligne);
  },
  page() {
    const E = this.etat;
    const entete = `<a class="retour" href="#dossiers">Retour aux événements</a><div class="entete"><div><h1>Importer des événements</h1><p>Depuis un fichier Excel (.xlsx) ou CSV.</p></div></div>`;
    if (StockageDossiers.etat === "corrompu" || Stockage.etat === "corrompu") return `<div class="page narrow">${entete}${Dossiers.bandeau()}${Contacts.bandeau()}</div>`;
    if (E && E.resultat) {

    }
    if (!E) return `<div class="page narrow">${entete}

        <input type="file" id="fichier-import-ev" accept=".xlsx,.csv,.txt,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv" hidden>

    const a = this.analyser(), sel = this.selection(a);

    const contactsManquants = new Set([...a.ok, ...a.doublons].filter(x => x.nouveau).map(x => x.nouveau)).size;
    const exemple = i => {

    };
    const sansContactCol = !E.mapping.some(m => m.startsWith("contact"));
    const radio = (nom, val, lib, attr) => `<label class="coche"><input type="radio" name="${nom}" value="${val}" ${attr}${E[nom] === val ? " checked" : ""}> ${lib}</label>`;
    return `<div class="page">${entete}
      <section class="card"><div class="sec-tete"><h2>2. Vérifier les colonnes</h2><button class="btn sec petit" data-action="import-ev-recommencer">Choisir un autre fichier</button></div>
        <p class="vide" style="margin:-6px 0 14px">Fichier « ${echapper(E.fichier)} » · ${E.lignes.length} ligne${E.lignes.length > 1 ? "s" : ""}. Indiquez à quoi correspond chaque colonne.</p>
        <div class="table-import"><table class="mapping"><thead><tr><th>Colonne du fichier</th><th>Exemple</th><th>Correspond à</th></tr></thead><tbody>

        </tbody></table></div>
        ${sansContactCol ? `<div class="bandeau r" style="margin:14px 0 0">Aucune colonne ne permet de retrouver le contact : choisissez au moins « Contact : nom », « Contact : prénom et nom », « Contact : e-mail » ou « Contact : téléphone ».</div>` : ""}</section>
      <section class="card" style="margin-top:18px"><h2>3. Vérifier avant d’importer</h2>
