          ${contactsManquants ? `<li class="att"><b>${contactsManquants}</b> contact${contactsManquants > 1 ? "s" : ""} introuvable${contactsManquants > 1 ? "s" : ""} parmi vos contacts</li>` : ""}
          ${a.doublons.length ? `<li class="att"><b>${a.doublons.length}</b> doublon${a.doublons.length > 1 ? "s" : ""} : même contact, même date et même titre qu’un événement existant (ou répété dans le fichier)</li>` : ""}
          ${a.sansContact.length ? `<li class="att"><b>${a.sansContact.length}</b> ligne${a.sansContact.length > 1 ? "s" : ""} sans contact, ignorée${a.sansContact.length > 1 ? "s" : ""} (ligne${a.sansContact.length > 1 ? "s" : ""} ${a.sansContact.slice(0, 10).join(", ")}${a.sansContact.length > 10 ? "…" : ""})</li>` : ""}
          ${a.alertes ? `<li class="att"><b>${a.alertes}</b> événement${a.alertes > 1 ? "s" : ""} avec une date, un montant, un acompte ou un statut illisible : la valeur d’origine est conservée dans les notes</li>` : ""}
        </ul>
        ${contactsManquants ? `<fieldset class="choix-doublons"><legend>Contacts introuvables</legend>${radio("manquants", "creer", "Les créer automatiquement (recommandé)", "data-manquants-ev")}${radio("manquants", "ignorer", "Ne pas importer ces événements", "data-manquants-ev")}</fieldset>` : ""}
        ${a.doublons.length ? `<fieldset class="choix-doublons"><legend>Que faire des doublons ?</legend>${radio("doublons", "ignorer", "Ne pas les importer (recommandé)", "data-doublons-ev")}${radio("doublons", "importer", "Les importer quand même", "data-doublons-ev")}</fieldset>` : ""}
        <fieldset class="choix-doublons"><legend>Automatisations</legend><label class="coche"><input type="checkbox" data-auto-ev${E.auto ? " checked" : ""}> Créer aussi les tâches automatiques prévues pour le statut de chaque événement</label>
          <p class="aide" style="margin:0 0 0 28px">Décoché par défaut : utile pour des événements à venir, à éviter pour un historique d’anciens événements.</p></fieldset>
        ${sel.length ? `<p class="vide" style="margin:16px 0 8px">Aperçu${sel.length > 8 ? " des 8 premiers" : ""} :</p>
          <div class="table-import"><table><thead><tr><th>Date</th><th>Titre</th><th>Contact</th><th>Prestation</th><th>Statut</th><th>Montant</th></tr></thead><tbody>
          ${sel.slice(0, 8).map(({ ev, existant, nouveau, alertes }) => `<tr${alertes.length ? ' class="alerte-l" title="' + echapper(alertes.join(", ")) + '"' : ""}><td>${ev.datePrestation ? dateSimple(ev.datePrestation) : '<span class="vide">—</span>'}</td><td>${echapper(ev.titre)}</td>
            <td>${echapper(nomComplet(existant || nouveau))}${nouveau ? ' <span class="puce l">nouveau</span>' : ""}</td><td>${PRESTATIONS[ev.type]}</td><td>${STATUTS[ev.statut].l}</td><td>${ev.montant === null ? "—" : euros(ev.montant)}</td></tr>`).join("")}
          </tbody></table></div>` : ""}
        <div class="actions" style="margin-top:20px"><button class="btn" data-action="import-ev-valider"${sel.length && !sansContactCol ? "" : " disabled"}>Importer ${sel.length} événement${sel.length > 1 ? "s" : ""}${nouveauxSel ? ` et créer ${nouveauxSel} contact${nouveauxSel > 1 ? "s" : ""}` : ""}</button><a class="btn sec" href="#dossiers" data-action="import-ev-fin">Annuler</a></div></section></div>`;
  },
  valider() {
    const E = this.etat; if (!E || StockageDossiers.etat === "corrompu" || Stockage.etat === "corrompu") return;
    const a = this.analyser(), sel = this.selection(a); if (!sel.length) return;
    // 1. Contacts à créer (une seule fois chacun)
    const aCreer = [...new Set(sel.filter(x => x.nouveau).map(x => x.nouveau))];
    const rc = aCreer.length ? Stockage.creerPlusieurs(aCreer.map(c => ({ prenom: c.prenom, nom: c.nom, entreprise: "", email: c.email, telephone: c.telephone, adresse: "", codePostal: "", ville: "", type: "particulier", origine: "", notes: "" }))) : { ids: [], ok: true };
    const idDe = new Map(aCreer.map((c, i) => [c, rc.ids[i]]));
    // 2. Événements, en un seul enregistrement
    const re = StockageDossiers.creerPlusieurs(sel.map(x => ({ ...x.ev, contactId: x.existant ? x.existant.id : idDe.get(x.nouveau) })));
    // 3. Automatisations (seulement si demandé)
    const tachesAvant = new Set(StockageTaches.taches.map(t => t.id));
    let nAuto = 0;
    if (E.auto) re.ids.forEach(id => { const d = StockageDossiers.get(id); nAuto += Automatisations.declencher("statut", d.statut, d); });
    const tachesAuto = StockageTaches.taches.filter(t => !tachesAvant.has(t.id)).map(t => t.id);
    Journal.noter("creation", "evenement", `Import de ${sel.length} événement${sel.length > 1 ? "s" : ""}`, { details: `Fichier « ${E.fichier} »${aCreer.length ? ` · ${aCreer.length} contact(s) créé(s)` : ""}${nAuto ? ` · ${nAuto} tâche(s) automatique(s)` : ""}${a.doublons.length && E.doublons !== "importer" ? ` · ${a.doublons.length} doublon(s) ignoré(s)` : ""}${a.sansContact.length ? ` · ${a.sansContact.length} ligne(s) sans contact ignorée(s)` : ""}` });
    E.resultat = { n: sel.length, nContacts: aCreer.length, nAuto, evIds: re.ids, ctIds: rc.ids, tacheIds: tachesAuto, ignores: E.lignes.filter(l => l.some(x => x)).length - sel.length };
    retour(re.ok && rc.ok, `${sel.length} événement${sel.length > 1 ? "s" : ""} importé${sel.length > 1 ? "s" : ""}.`, "Événements importés." + MSG_NON_SAUVE);
    App.afficher();
  },
  async annuler() {
    const r = this.etat && this.etat.resultat; if (!r) return;
    const tachesAuto = new Set(r.tacheIds);
    const evUtilise = id => { const d = StockageDossiers.get(id); return d && (d.operations.length || StockageTaches.taches.some(t => t.dossierId === id && !tachesAuto.has(t.id)) || StockageRdv.rdv.some(x => x.dossierId === id)); };
    const evSupp = r.evIds.filter(id => StockageDossiers.get(id) && !evUtilise(id)), evGardes = r.evIds.filter(id => evUtilise(id)).length;
    const restants = new Set(StockageDossiers.dossiers.filter(d => !evSupp.includes(d.id)).map(d => d.contactId));
    const ctUtilise = id => restants.has(id) || StockageTaches.taches.some(t => t.contactId === id && !tachesAuto.has(t.id)) || StockageRdv.rdv.some(x => x.contactId === id);
    const ctSupp = r.ctIds.filter(id => Stockage.get(id) && !ctUtilise(id));
    if (!await confirmer("Annuler cet import ?", `${evSupp.length} événement${evSupp.length > 1 ? "s" : ""} ${evSupp.length > 1 ? "seront supprimés" : "sera supprimé"}${ctSupp.length ? `, ainsi que ${ctSupp.length} contact${ctSupp.length > 1 ? "s" : ""} créé${ctSupp.length > 1 ? "s" : ""} par l’import` : ""}${r.tacheIds.length ? " et les tâches automatiques" : ""}.${evGardes ? `<p style="margin-top:10px">${evGardes} événement${evGardes > 1 ? "s" : ""} déjà complété${evGardes > 1 ? "s" : ""} (opérations, tâches ou rendez-vous) ser${evGardes > 1 ? "ont" : "a"} conservé${evGardes > 1 ? "s" : ""}.</p>` : ""}`, "Annuler l’import")) return;
    const sE = new Set(evSupp), sC = new Set(ctSupp);
    StockageTaches.taches = StockageTaches.taches.filter(t => !(tachesAuto.has(t.id) && sE.has(t.dossierId)));
    StockageDossiers.dossiers = StockageDossiers.dossiers.filter(d => !sE.has(d.id));
    Stockage.contacts = Stockage.contacts.filter(c => !sC.has(c.id));
    const ok = [StockageTaches.enregistrer(), StockageDossiers.enregistrer(), Stockage.enregistrer()].every(Boolean);
    Journal.noter("suppression", "evenement", `Import annulé : ${evSupp.length} événement${evSupp.length > 1 ? "s" : ""} retiré${evSupp.length > 1 ? "s" : ""}`, { details: `Fichier « ${this.etat.fichier} »${ctSupp.length ? ` · ${ctSupp.length} contact(s) retiré(s)` : ""}${evGardes ? ` · ${evGardes} conservé(s) car déjà complété(s)` : ""}` });
    this.etat = null;
    retour(ok, "Import annulé.", "Import annulé." + MSG_NON_SAUVE);
    location.hash = "#dossiers";
  },
  modele() {
    const l = ["Date", "Titre", "Prénom", "Nom", "E-mail", "Téléphone", "Prestation", "Statut", "Montant", "Acompte", "Acompte versé", "Notes"].join(";");
    telechargerFichier("﻿" + l + "\r\n", "modele-import-evenements.csv", "text/csv;charset=utf-8");
  }
};

/* ---------- 2o. Statistiques ----------
   Calculées uniquement à partir des données enregistrées, à chaque affichage. Règles :
   • la date d’un événement = sa date de prestation (jamais la date de création de la fiche) ;
   • les événements annulés sont exclus de toutes les statistiques de prestations ;
   • chaque événement est compté une seule fois ;
   • les montants sont des estimations : rien n’est présenté comme un encaissement ;
   • le panier moyen ignore les événements sans montant. */
const STATUTS_REALISES = ["realisee", "livraison", "termine"];   // la prestation a eu lieu
const STATUTS_ATTENTE = ["devis-envoye", "attente"];            // en attente de réponse ou de confirmation
const StatEtat = { periode: "annee", du: "", au: "", comparer: true };
const PERIODES_STAT = { mois: "Ce mois", trimestre: "Ce trimestre", annee: "Cette année", precedente: "Année précédente", tout: "Toute la période", perso: "Période personnalisée" };

const Stats = {
  cache: null,
  /* Bornes de la période choisie (dates AAAA-MM-JJ incluses) */
  periode() {
    const auj = new Date(), y = auj.getFullYear(), m = auj.getMonth(), j = (a, mo, d) => isoJour(new Date(a, mo, d));
    const datees = StockageDossiers.dossiers.filter(d => d.statut !== "annule" && d.datePrestation).map(d => d.datePrestation).sort();
    const p = StatEtat.periode;
    let du, au, libelle;
    if (p === "mois") { du = j(y, m, 1); au = j(y, m + 1, 0); libelle = majuscule(auj.toLocaleDateString("fr-FR", { month: "long", year: "numeric" })); }
    else if (p === "trimestre") { const t = Math.floor(m / 3); du = j(y, t * 3, 1); au = j(y, t * 3 + 3, 0); libelle = `${t + 1}${t ? "e" : "er"} trimestre ${y}`; }
    else if (p === "precedente") { du = j(y - 1, 0, 1); au = j(y - 1, 11, 31); libelle = `Année ${y - 1}`; }
    else if (p === "tout") { du = datees[0] || ""; au = datees[datees.length - 1] || ""; libelle = "Toute la période"; }
    else if (p === "perso") {
      du = isoValide(StatEtat.du) ? StatEtat.du : j(y, 0, 1); au = isoValide(StatEtat.au) ? StatEtat.au : j(y, 11, 31);
      if (au < du) [du, au] = [au, du];
      libelle = `Du ${dateSimple(du)} au ${dateSimple(au)}`;
    }
    else { du = j(y, 0, 1); au = j(y, 11, 31); libelle = `Année ${y}`; }
    return { du, au, libelle, tout: p === "tout" };
  },
  /* Découpage du graphique : semaines (≤ 2 mois), mois (≤ 2 ans) ou années */
  decoupage(du, au) {
    const jours = (parseJour(au) - parseJour(du)) / 864e5;
    const gran = jours <= 62 ? "semaine" : jours <= 731 ? "mois" : "annee";
    const cle = iso => gran === "annee" ? iso.slice(0, 4) : gran === "mois" ? iso.slice(0, 7) : lundi(iso);
    const seaux = [];
    let c = gran === "semaine" ? lundi(du) : gran === "mois" ? du.slice(0, 7) + "-01" : du.slice(0, 4) + "-01-01";
    while (c <= au) {
      const d = parseJour(c);
      const court = gran === "annee" ? c.slice(0, 4) : gran === "mois" ? d.toLocaleDateString("fr-FR", { month: "short" }).replace(".", "") + (du.slice(0, 4) !== au.slice(0, 4) ? " " + c.slice(2, 4) : "") : d.toLocaleDateString("fr-FR", { day: "numeric", month: "short" }).replace(".", "");
      const long = gran === "annee" ? `Année ${c.slice(0, 4)}` : gran === "mois" ? majuscule(d.toLocaleDateString("fr-FR", { month: "long", year: "numeric" })) : `Semaine du ${d.toLocaleDateString("fr-FR", { day: "numeric", month: "long" })}`;
      seaux.push({ cle: cle(c), court, long });
      c = gran === "semaine" ? plusJours(c, 7) : gran === "mois" ? isoJour(new Date(d.getFullYear(), d.getMonth() + 1, 1)) : `${+c.slice(0, 4) + 1}-01-01`;
    }
    return { gran, cle, seaux };
  },
  calculer() {
    const P = this.periode(), tous = StockageDossiers.dossiers;
    const dans = d => d.datePrestation && d.datePrestation >= P.du && d.datePrestation <= P.au;
    const nonAnnules = tous.filter(d => d.statut !== "annule");
    const evs = P.tout ? nonAnnules : nonAnnules.filter(dans);            // un événement = une seule fois
    const realises = evs.filter(d => STATUTS_REALISES.includes(d.statut));
    const avecMontant = evs.filter(d => typeof d.montant === "number");
    const realisesMontant = realises.filter(d => typeof d.montant === "number");
    const k = {
      ca: avecMontant.reduce((s, d) => s + d.montant, 0), nbMontant: avecMontant.length, sansMontant: evs.length - avecMontant.length,
      realisees: realises.length, enCours: evs.filter(d => d.statut !== "termine").length,
      panier: realisesMontant.length ? realisesMontant.reduce((s, d) => s + d.montant, 0) / realisesMontant.length : null, nbPanier: realisesMontant.length,
      attente: evs.filter(d => STATUTS_ATTENTE.includes(d.statut)).length,
      acomptes: evs.filter(d => d.acompteVerse && typeof d.acompte === "number").reduce((s, d) => s + d.acompte, 0),
      nbAcomptes: evs.filter(d => d.acompteVerse && typeof d.acompte === "number").length,
      nouveauxContacts: Stockage.contacts.filter(c => P.tout || (c.creeLe && isoJour(new Date(c.creeLe)) >= P.du && isoJour(new Date(c.creeLe)) <= P.au)).length,
      annules: tous.filter(d => d.statut === "annule" && (P.tout || dans(d))).length,
      sansDate: nonAnnules.filter(d => !d.datePrestation).length, total: evs.length
    };
    // Graphiques : uniquement les événements datés
    const dates = evs.filter(d => d.datePrestation);
    let graph = null;
    if (P.du && P.au && dates.length) {
      const D = this.decoupage(P.du, P.au), idx = new Map(D.seaux.map((s, i) => [s.cle, i]));
      const vide = () => D.seaux.map(() => ({ realisees: 0, mtRealise: 0, mtAVenir: 0, prec: { realisees: 0, mt: 0 } }));
      const v = vide();
      dates.forEach(d => { const i = idx.get(D.cle(d.datePrestation)); if (i === undefined) return; const r = STATUTS_REALISES.includes(d.statut);
        if (r) v[i].realisees++; if (typeof d.montant === "number") v[i][r ? "mtRealise" : "mtAVenir"] += d.montant; });
      // Comparaison : même période un an plus tôt (semaines décalées de 52 semaines pour garder les jours)
      const comparable = !P.tout && D.gran !== "annee";
      let precExiste = false;
      if (comparable) {
        const dec = iso => D.gran === "semaine" ? plusJours(iso, 364) : `${+iso.slice(0, 4) + 1}${iso.slice(4)}`;
        const pDu = D.gran === "semaine" ? plusJours(P.du, -364) : `${+P.du.slice(0, 4) - 1}${P.du.slice(4)}`, pAu = D.gran === "semaine" ? plusJours(P.au, -364) : `${+P.au.slice(0, 4) - 1}${P.au.slice(4)}`;
        nonAnnules.filter(d => d.datePrestation && d.datePrestation >= pDu && d.datePrestation <= pAu).forEach(d => {
          const i = idx.get(D.cle(dec(d.datePrestation))); if (i === undefined) return; precExiste = true;
          if (STATUTS_REALISES.includes(d.statut)) v[i].prec.realisees++; if (typeof d.montant === "number") v[i].prec.mt += d.montant;
        });
      }
      graph = { D, v, comparable, precExiste, comparer: comparable && precExiste && StatEtat.comparer };
    }
    // Répartition par type de prestation (catégories existantes du CRM, hors annulés)
    const parType = Object.keys(PRESTATIONS).map(t => ({ t, n: evs.filter(d => (PRESTATIONS[d.type] ? d.type : "autre") === t).length })).filter(x => x.n).sort((a, b) => b.n - a.n);
    return { P, k, graph, parType };
  },
  page() {
    const C = this.cache = this.calculer(), { P, k, graph, parType } = C;
    const opt = Object.entries(PERIODES_STAT).map(([v, l]) => `<option value="${v}"${v === StatEtat.periode ? " selected" : ""}>${l}</option>`).join("");
    const pl = (n, s, p) => `${n} ${n > 1 ? p : s}`;
    const aucun = !StockageDossiers.dossiers.length;
    const tuile = (titre, valeur, sous, cls = "") => `<div class="card stat ${cls}"><span class="stat-titre">${titre}</span><b>${valeur}</b><span>${sous}</span></div>`;
    const notes = [];
    if (!P.tout && k.sansDate) notes.push(`${pl(k.sansDate, "événement sans date de prestation n’est pas compté", "événements sans date de prestation ne sont pas comptés")} sur cette période (choisissez « Toute la période » pour les inclure).`);
    if (P.tout && k.sansDate) notes.push(`${pl(k.sansDate, "événement sans date de prestation est compté", "événements sans date de prestation sont comptés")} dans les indicateurs, mais n’apparai${k.sansDate > 1 ? "ssent" : "t"} pas dans les graphiques.`);
    if (k.annules) notes.push(`${pl(k.annules, "événement annulé est exclu", "événements annulés sont exclus")} de ces statistiques.`);
    return `<div class="page">
      <div class="entete"><div><h1>Statistiques</h1><p>${echapper(P.libelle)}${P.tout || !P.du ? "" : ` · du ${dateSimple(P.du)} au ${dateSimple(P.au)}`}</p></div></div>
      <div class="outils filtres-stat">
        <select data-stat="periode" aria-label="Période">${opt}</select>
        ${StatEtat.periode === "perso" ? `<label class="date-stat">Du <input type="date" data-stat="du" value="${P.du}"></label><label class="date-stat">au <input type="date" data-stat="au" value="${P.au}"></label>` : ""}
        ${graph && graph.comparable ? (graph.precExiste ? `<label class="coche"><input type="checkbox" data-stat="comparer"${StatEtat.comparer ? " checked" : ""}> Comparer avec l’année précédente</label>` : `<span class="vide" style="align-self:center;font-size:.9rem">Pas de données l’année précédente pour comparer.</span>`) : ""}
      </div>
      ${aucun ? `<div class="card etat-vide"><h2>Pas encore de statistiques</h2><p>Les statistiques se construisent à partir de vos événements (date de prestation, statut et montant). Créez ou importez vos premiers événements pour les voir apparaître ici.</p><a class="btn" href="#dossiers/nouveau">Créer un événement</a></div>` : `
      <div class="grille g4 indicateurs">
        ${tuile("Chiffre d’affaires prévisionnel", k.nbMontant ? euros(k.ca) : "—", k.nbMontant ? `montants estimés de ${pl(k.nbMontant, "événement", "événements")}${k.sansMontant ? ` · ${k.sansMontant} sans montant` : ""}` : "aucun montant renseigné", "prev")}
        ${tuile("Prestations réalisées", k.realisees, `statut « réalisée », « livraison » ou « terminé »`)}
        ${tuile("Événements en cours", k.enCours, "ni terminés ni annulés")}
        ${tuile("Panier moyen", k.panier === null ? "—" : euros(Math.round(k.panier)), k.panier === null ? "aucune prestation réalisée avec montant" : `estimé, sur ${pl(k.nbPanier, "prestation réalisée", "prestations réalisées")} avec montant`)}
      </div>
      <p class="aide note-stat"><b>Prévisionnel, pas encaissé :</b> ces montants sont les estimations saisies sur les événements. Les seules sommes encaissées que le CRM connaît sont les acomptes cochés « versé » : ${k.nbAcomptes ? `<b>${euros(k.acomptes)}</b> pour ${pl(k.nbAcomptes, "événement", "événements")} de cette période` : "aucun pour cette période"}. Le solde réglé après la prestation n’est pas suivi.</p>
      <section class="card demandes-stat"><h2>Suivi des demandes</h2>
        <div class="duo-stat"><div><b>${k.nouveauxContacts}</b><span>${k.nouveauxContacts > 1 ? "nouveaux contacts" : "nouveau contact"} ${P.tout ? "au total" : "sur la période"}<small>selon la date d’ajout de la fiche</small></span></div>
        <div><b>${k.attente}</b><span>${pl(k.attente, "événement", "événements")} en attente de réponse ou de confirmation<small>statut « devis envoyé » ou « en attente de réponse »</small></span></div></div></section>
      ${graph ? `
      <section class="card graph-stat"><h2>Prestations réalisées${graph.D.gran === "semaine" ? " par semaine" : graph.D.gran === "mois" ? " par mois" : " par année"}</h2>
        <p class="vide sous-graph">Nombre d’événements dont la prestation a eu lieu, selon leur date de prestation.</p>
        ${graph.comparer ? `<div class="legende-stat"><span><i class="cle c1"></i>${echapper(P.libelle)}</span><span><i class="cle cp"></i>Même période, année précédente</span></div>` : ""}
        ${k.realisees || (graph.comparer && graph.v.some(x => x.prec.realisees)) ? `<div class="zone-graph" id="graph-realisees"></div>` : `<p class="vide graph-vide">Aucune prestation réalisée sur cette période.</p>`}
        ${this.tableau("realisees")}</section>
      <section class="card graph-stat"><h2>Montants estimés${graph.D.gran === "semaine" ? " par semaine" : graph.D.gran === "mois" ? " par mois" : " par année"}</h2>
        <p class="vide sous-graph">Somme des montants estimés, selon la date de prestation. Prévisionnel, pas encaissé.</p>
        <div class="legende-stat"><span><i class="cle c1"></i>Prestations réalisées</span><span><i class="cle c2"></i>À réaliser</span>${graph.comparer ? `<span><i class="cle cp"></i>Année précédente (total)</span>` : ""}</div>
        ${graph.v.some(x => x.mtRealise || x.mtAVenir || (graph.comparer && x.prec.mt)) ? `<div class="zone-graph" id="graph-montants"></div>` : `<p class="vide graph-vide">Aucun montant renseigné pour les événements de cette période.</p>`}
        ${this.tableau("montants")}</section>` : `<div class="card etat-vide"><p style="margin:0">Aucun événement daté sur cette période : rien à afficher dans les graphiques.</p></div>`}
      <section class="card graph-stat"><h2>Répartition par prestation</h2>
        <p class="vide sous-graph">${k.total ? `${pl(k.total, "événement", "événements")} sur la période, hors annulés.` : ""}</p>
        ${parType.length ? `<ul class="repart">${parType.map(x => `<li><span class="r-nom">${PRESTATIONS[x.t]}</span><span class="r-piste"><i style="width:${(x.n / parType[0].n) * 100}%"></i></span><span class="r-val"><b>${x.n}</b> <small>${Math.round(x.n / k.total * 100)} %</small></span></li>`).join("")}</ul>` : `<p class="vide graph-vide">Aucun événement sur cette période.</p>`}</section>
      ${notes.length ? `<p class="aide" style="margin-top:14px">${notes.join(" ")}</p>` : ""}`}</div>`;
  },
  /* Les chiffres sous forme de tableau simple (accessibles sans survol) */
  tableau(quoi) {
    const g = this.cache.graph; if (!g) return "";
    const lignes = g.D.seaux.map((s, i) => { const x = g.v[i];
      return quoi === "realisees" ? `<tr><td>${s.long}</td><td>${x.realisees}</td>${g.comparer ? `<td>${x.prec.realisees}</td>` : ""}</tr>`
        : `<tr><td>${s.long}</td><td>${euros(x.mtRealise)}</td><td>${euros(x.mtAVenir)}</td><td>${euros(x.mtRealise + x.mtAVenir)}</td>${g.comparer ? `<td>${euros(x.prec.mt)}</td>` : ""}</tr>`; }).join("");
    const tete = quoi === "realisees" ? `<th>Période</th><th>Réalisées</th>${g.comparer ? "<th>Année précédente</th>" : ""}` : `<th>Période</th><th>Réalisées</th><th>À réaliser</th><th>Total</th>${g.comparer ? "<th>Année précédente</th>" : ""}`;
    return `<details class="chiffres"><summary>Voir les chiffres</summary><div class="table-import"><table><thead><tr>${tete}</tr></thead><tbody>${lignes}</tbody></table></div></details>`;
  },
  /* Dessin des graphiques (après l’affichage, pour connaître la largeur disponible) */
  dessiner() {
    const g = this.cache && this.cache.graph; if (!g) return;
    const lab = this.cache.P.libelle;
    const z1 = $("#graph-realisees");
    if (z1) this.barres(z1, g, [{ cle: "realisees", nom: "Prestations réalisées", cls: "c1" }], x => x.prec.realisees, n => String(n), (s, x) => [[`${x.realisees}`, g.comparer ? lab : "Prestations réalisées"], ...(g.comparer ? [[`${x.prec.realisees}`, "Année précédente"]] : [])], true);
    const z2 = $("#graph-montants");
    if (z2) this.barres(z2, g, [{ cle: "mtRealise", nom: "Prestations réalisées", cls: "c1" }, { cle: "mtAVenir", nom: "À réaliser", cls: "c2" }], x => x.prec.mt, n => euroCourt(n),
      (s, x) => [[euros(x.mtRealise + x.mtAVenir), "Total estimé"], [euros(x.mtRealise), "Prestations réalisées"], [euros(x.mtAVenir), "À réaliser"], ...(g.comparer ? [[euros(x.prec.mt), "Année précédente"]] : [])]);
  },
  barres(zone, g, series, prec, fmt, infos, entier) {
    const W = Math.max(280, zone.clientWidth), H = W < 500 ? 200 : 230, mg = { g: W < 500 ? 40 : 52, d: 8, h: 18, b: 26 };
    const pw = W - mg.g - mg.d, ph = H - mg.h - mg.b, n = g.D.seaux.length, slot = pw / n;
    const tot = x => series.reduce((s, se) => s + x[se.cle], 0);
    const max = Math.max(1, ...g.v.map(x => Math.max(tot(x), g.comparer ? prec(x) : 0)));
    let pas = (() => { const brut = max / 4, p = Math.pow(10, Math.floor(Math.log10(brut))), r = brut / p; return (r <= 1 ? 1 : r <= 2 ? 2 : r <= 2.5 ? 2.5 : r <= 5 ? 5 : 10) * p; })();
    if (entier) pas = Math.max(1, Math.ceil(pas));  // un nombre de prestations n’a pas de demi
    const haut = Math.ceil(max / pas) * pas, y = v => mg.h + ph - (v / haut) * ph;
    const bw = Math.min(24, g.comparer ? slot * 0.34 : slot * 0.56);
    const barre = (x, y0, y1, arrondi) => {  // rectangle, coins supérieurs arrondis (4 px) s’il est en haut de pile
      const h = y0 - y1; if (h <= 0) return "";
      const r = arrondi ? Math.min(4, h, bw / 2) : 0;
      return `M${x},${y0} V${y1 + r} Q${x},${y1} ${x + r},${y1} H${x + bw - r} Q${x + bw},${y1} ${x + bw},${y1 + r} V${y0} Z`;
    };
    let svg = "";
    for (let v = 0; v <= haut + 1e-9; v += pas) svg += `<line x1="${mg.g}" x2="${W - mg.d}" y1="${y(v)}" y2="${y(v)}" class="grille-l"/><text x="${mg.g - 8}" y="${y(v) + 4}" class="axe" text-anchor="end">${fmt(v)}</text>`;
    const tous = Math.max(1, Math.ceil(n / Math.floor(pw / 46)));
    let iMax = -1, vMax = -1; g.v.forEach((x, i) => { if (tot(x) > vMax) { vMax = tot(x); iMax = i; } });
    g.D.seaux.forEach((s, i) => {
      const x = g.v[i], cx = mg.g + slot * i + slot / 2;
      let xb = cx - bw / 2;
      if (g.comparer) { const xp = cx - bw - 1; svg += `<path class="cp" d="${barre(xp, y(0), y(prec(x)), true)}"/>`; xb = cx + 1; }
      let base = y(0), cumul = 0;
      const actives = series.filter(se => x[se.cle] > 0);
      actives.forEach((se, k) => {
        cumul += x[se.cle]; const yt = y(cumul), dernier = k === actives.length - 1;
        svg += `<path class="${se.cls}" d="${barre(xb, base, yt + (dernier ? 0 : 0), dernier)}"/>`;
        base = yt - 2;  // 2 px d’écart entre deux segments empilés
      });
      if (i % tous === 0) svg += `<text x="${cx}" y="${H - 8}" class="axe" text-anchor="middle">${s.court}</text>`;
      if (i === iMax && vMax > 0) svg += `<text x="${xb + bw / 2}" y="${y(vMax) - 6}" class="val" text-anchor="middle">${fmt(vMax)}</text>`;
      svg += `<rect class="cible" x="${mg.g + slot * i}" y="${mg.h}" width="${slot}" height="${ph}" tabindex="0" data-i="${i}"><title>${s.long}</title></rect>`;
    });
    svg += `<line x1="${mg.g}" x2="${W - mg.d}" y1="${y(0)}" y2="${y(0)}" class="base-l"/>`;
    zone.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${echapper(zone.closest("section").querySelector("h2").textContent)}">${svg}</svg>`;
    // Infobulle au survol et au clavier (le texte est inséré avec textContent)
    const bulle = $("#bulle-stat");
    const montrer = (el, ev) => {
      const i = +el.dataset.i, s = g.D.seaux[i];
      zone.querySelectorAll(".cible.actif").forEach(c => c.classList.remove("actif")); el.classList.add("actif");
      bulle.replaceChildren();
      const t = document.createElement("div"); t.className = "b-titre"; t.textContent = s.long; bulle.append(t);
      infos(s, g.v[i]).forEach(([val, nom]) => { const l = document.createElement("div"), b = document.createElement("b"), sp = document.createElement("span"); b.textContent = val; sp.textContent = " " + nom; l.append(b, sp); bulle.append(l); });
      bulle.hidden = false;
      const r = el.getBoundingClientRect(), bx = ev && ev.clientX ? ev.clientX : r.left + r.width / 2, by = ev && ev.clientY ? ev.clientY : r.top + 20;
      bulle.style.left = Math.min(window.innerWidth - bulle.offsetWidth - 8, Math.max(8, bx + 14)) + "px";
      bulle.style.top = Math.max(8, by - bulle.offsetHeight - 10) + "px";
    };
    const cacher = () => { bulle.hidden = true; zone.querySelectorAll(".cible.actif").forEach(c => c.classList.remove("actif")); };
    zone.querySelectorAll(".cible").forEach(el => {
      el.addEventListener("pointermove", e => montrer(el, e)); el.addEventListener("pointerleave", cacher);
      el.addEventListener("focus", () => montrer(el)); el.addEventListener("blur", cacher);
    });
  }
};
const euroCourt = n => n >= 10000 ? Math.round(n / 1000).toLocaleString("fr-FR") + " k€" : n >= 1000 ? (Math.round(n / 100) / 10).toLocaleString("fr-FR") + " k€" : Math.round(n).toLocaleString("fr-FR") + " €";

/* ---------- 3. Vues (une fonction = une page) ---------- */
const Vues = {
  /* Tableau de bord : tout est recalculé à chaque affichage à partir des données enregistrées (aucune copie, aucun chiffre fixe) */
  accueil() {
    const maint = new Date(), auj = isoJour(maint), h = maint.getHours();
    const enCours = StockageDossiers.dossiers.filter(d => d.statut !== "termine" && d.statut !== "annule");
    const potentiel = enCours.reduce((s, d) => s + (d.montant || 0), 0);
    const af = Taches.aFaire(), retard = af.filter(t => Taches.enRetard(t));
    const rdv7 = StockageRdv.rdv.filter(r => r.date >= auj && r.date <= plusJours(auj, 6));
    const pl = (n, mot) => `${mot}${n > 1 ? "s" : ""}`;

    /* Planche-contact : uniquement ce qui est prévu (séances photo et rendez-vous à venir), sans cases vides */
    const dem = plusJours(auj, 1), nowH = `${String(maint.getHours()).padStart(2, "0")}:${String(maint.getMinutes()).padStart(2, "0")}`;
    const prevus = Agenda.elements(auj, plusJours(auj, 365), false)
      .filter(e => (e.type === "evenement" && !e.annule) || (e.type === "rdv" && !(e.date === auj && (e.fin || e.heure) < nowH)))  // rdv déjà passés aujourd’hui exclus
      .slice(0, 6);
    const quandP = iso => iso === auj ? "Aujourd’hui" : iso === dem ? "Demain" : majuscule(parseJour(iso).toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "short" }));
    const planche = prevus.length ? prevus.map((e, i) => {
      const c = Stockage.get(e.contactId), photo = PHOTOS[PHOTOS_PLANCHE[i % PHOTOS_PLANCHE.length]];
      const detail = [e.type === "rdv" ? Agenda.horaire(e) : "Séance photo", c ? nomComplet(c) : ""].filter(Boolean).join(" · ");
      return `
      <a class="vue" role="listitem" href="${e.type === "rdv" ? "#calendrier/rdv/" + e.id : e.href}">
        <div class="cadre" style="background-image:url(${photo})"><span class="tag" style="background:${TEINTES_CAL[e.type]}">${e.type === "rdv" ? "Rendez-vous" : "Séance"}</span></div>
        <b>${quandP(e.date)}</b>${echapper(e.titre)}<br><span>${echapper(detail)}</span>
      </a>`;
    }).join("") + `<a class="vue suite" role="listitem" href="#calendrier/liste/${auj}"><div class="cadre libre"><span>Tout le calendrier →</span></div></a>`
      : `<div class="planche-vide"><p>Aucune séance ni aucun rendez-vous de prévu pour l’instant.</p><a class="btn sec" href="#calendrier/rdv/nouveau/${auj}">Planifier un rendez-vous</a></div>`;

    const resume = retard.length ? `${retard.length} ${pl(retard.length, "tâche")} en retard à traiter en priorité.`
      : af.length ? `${af.length} ${pl(af.length, "tâche")} à faire, aucune en retard.` : "Aucune tâche en attente.";
    return `<div class="page">
      <header class="hero"><div>
        <p class="surtitre">${majuscule(maint.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" }))}</p>
        <h1>${h >= 5 && h < 18 ? "Bonjour" : "Bonsoir"} <em>Maëlys</em></h1>
        <p class="resume">${resume}</p>
      <div class="acces" role="group" aria-label="Accès rapides">
        <a class="btn sec" href="#contacts/nouveau"><span aria-hidden="true">+</span> Contact</a>
        <a class="btn sec" href="#dossiers/nouveau"><span aria-hidden="true">+</span> Événement</a>
        <a class="btn sec" href="#taches/nouveau"><span aria-hidden="true">+</span> Tâche</a>
        <a class="btn sec" href="#calendrier/rdv/nouveau/${auj}"><span aria-hidden="true">+</span> Rendez-vous</a></div></div>
        <div class="hero-photos" aria-hidden="true"><img src="${PHOTOS["baignade-soleil"]}" alt=""><img src="${PHOTOS["couple-eau-nb"]}" alt=""><img src="${PHOTOS["vignes-or"]}" alt=""></div></header>
      ${Sauvegarde.rappel() ? `<p class="rappel-accueil">${Sauvegarde.rappel()} <a href="#parametres/sauvegarde">Sauvegarder mes données</a></p>` : ""}
      <div class="planche"${prevus.length ? ' role="list"' : ""} aria-label="Prochaines séances et rendez-vous">${planche}</div>
      <div class="grille g4 indicateurs">
        <a class="card stat" href="#dossiers"><b>${enCours.length}</b><span>${pl(enCours.length, "événement")} en cours${potentiel ? ` · ${euro(potentiel)} estimés` : ""}</span></a>
        <a class="card stat" href="#taches" data-vue-tache="afaire"><b>${af.length}</b><span>${pl(af.length, "tâche")} à faire</span></a>
        <a class="card stat${retard.length ? " alerte" : ""}" href="#taches" data-vue-tache="retard"><b>${retard.length}</b><span>${pl(retard.length, "tâche")} en retard</span></a>
        <a class="card stat" href="#calendrier/liste/${auj}"><b>${rdv7.length}</b><span>rendez-vous dans les 7 jours</span></a>
      </div>
      <div class="grille g2">${this.blocATraiter(af, auj)}${this.blocAVenir(auj)}</div>
      <div class="grille g2">${this.blocEvenements(enCours)}${this.blocActivite()}</div></div>`;
  },

  /* « À traiter » : en retard d’abord, puis les 14 prochains jours, puis sans échéance */
  blocATraiter(af, auj) {
    const lim = plusJours(auj, 14), max = 8;
    const groupes = [
      ["En retard", af.filter(t => Taches.enRetard(t)), " retard"],
      ["Prochainement", af.filter(t => t.echeance && t.echeance >= auj && t.echeance <= lim), ""],
      ["Sans échéance", af.filter(t => !t.echeance), ""]];
    let reste = max, html = "", affiches = 0;
    groupes.forEach(([titre, l, c]) => {
      if (!l.length || reste <= 0) return;
      const vus = l.slice(0, reste); reste -= vus.length; affiches += vus.length;
      html += `<h3 class="groupe${c}">${titre} <span>${l.length}</span></h3><ul class="liste">${vus.map(t => Taches.ligne(t)).join("")}</ul>`;
    });
    const plus = af.length - affiches;
    return `<section class="card"><div class="sec-tete"><h2>À traiter</h2><a href="#taches">Toutes les tâches${af.length ? ` (${af.length})` : ""}</a></div>
      ${html || `<p class="vide">Rien à traiter pour le moment : aucune tâche en retard ni prévue dans les 14 prochains jours. <a href="#taches/nouveau">Ajouter une tâche</a></p>`}
      ${plus > 0 && html ? `<p class="aide" style="margin-top:12px">${plus} autre${plus > 1 ? "s" : ""} tâche${plus > 1 ? "s" : ""} plus lointaine${plus > 1 ? "s" : ""} dans la rubrique <a href="#taches">Tâches</a>.</p>` : ""}</section>`;
  },

  /* « À venir » : événements photo, rendez-vous et échéances, dans l’ordre chronologique (8 maximum) */
  blocAVenir(auj) {
    const dem = plusJours(auj, 1);
    const l = Agenda.elements(auj, plusJours(auj, 90), false).filter(e => !e.annule).slice(0, 8);
    const jour = iso => iso === auj ? "Aujourd’hui" : iso === dem ? "Demain" : jourCourt(parseJour(iso));
    return `<section class="card"><div class="sec-tete"><h2>À venir</h2><a href="#calendrier/liste/${auj}">Calendrier</a></div>
      ${l.length ? `<ul class="liste avenir">${l.map(e => {
        const c = Stockage.get(e.contactId);
        const titre = e.type === "rdv" ? `<button type="button" class="it-titre" data-rdv="${e.id}">${echapper(e.titre)}</button>` : `<a class="it-titre" href="${e.href}">${echapper(e.titre)}</a>`;
        return `<li><span class="av-date"><b>${jour(e.date)}</b>${e.type === "rdv" ? fmtH(e.heure) : ""}</span><span class="av-type av-${Agenda.cls(e)}" title="${TYPES_CAL[e.type]}"></span>
          <div class="infos">${titre}<small>${TYPES_CAL[e.type]}${c ? ` · <a href="#contacts/${c.id}">${echapper(nomComplet(c))}</a>` : ""}</small></div></li>`;
      }).join("")}</ul>` : `<p class="vide">Rien de prévu dans les trois prochains mois. <a href="#calendrier/rdv/nouveau/${auj}">Planifier un rendez-vous</a></p>`}</section>`;
  },

  /* « Événements en cours » : hors « Terminé » et « Annulé » ; les plus proches d’abord */
  blocEvenements(enCours) {
    const l = enCours.slice().sort((a, b) => (!a.datePrestation && !b.datePrestation) ? b.creeLe.localeCompare(a.creeLe)
      : !a.datePrestation ? 1 : !b.datePrestation ? -1 : a.datePrestation.localeCompare(b.datePrestation));
    return `<section class="card"><div class="sec-tete"><h2>Événements en cours</h2><a href="#dossiers">Tous les événements${enCours.length ? ` (${enCours.length})` : ""}</a></div>
      ${l.length ? `<ul class="liste">${l.slice(0, 6).map(d => `
        <li class="dos"><a class="ligne" href="#dossiers/${d.id}"><div class="infos"><b>${echapper(d.titre)}</b>
          <small>${echapper(Dossiers.client(d))} · ${PRESTATIONS[d.type] || "Autre"} · ${d.datePrestation ? dateSimple(d.datePrestation) : "Date non fixée"}</small></div></a>${puceStatut(d.statut)}</li>`).join("")}</ul>
        ${l.length > 6 ? `<p class="aide" style="margin-top:12px">Et ${l.length - 6} autre${l.length > 7 ? "s" : ""} : <a href="#dossiers">voir tous les événements</a>.</p>` : ""}`
        : `<p class="vide">Aucun événement en cours. <a href="#dossiers/nouveau">Créer un événement</a></p>`}</section>`;
  },

  /* « Activité récente » : les 5 dernières opérations des historiques (hors opérations datées dans le futur) */
  blocActivite() {
    const n = maintenantLocal(), ops = Operations.de(StockageDossiers.dossiers).filter(x => !x.o.date || x.o.date <= n).slice(0, 5);
    return `<section class="card"><h2>Activité récente</h2>${ops.length ? `<ul class="liste">${ops.map(({ o, d }) => {
        const t = TYPES_OP[o.type] || TYPES_OP.autre;
        return `<li><div class="infos" style="min-width:0;flex:1"><span class="puce s${t.g}">${t.l}</span> <b>${echapper(o.titre)}</b>
          <small><a href="#dossiers/${d.id}">${echapper(d.titre)}</a> · ${dateHeure(o.date)}</small></div></li>`;
      }).join("")}</ul>` : `<p class="vide">Aucune opération enregistrée. Notez vos échanges depuis la fiche d’un événement (bouton « Ajouter une opération »).</p>`}</section>`;
  },

  contacts: (a, b) => Contacts.route(a, b),

  dossiers: (a, b) => Dossiers.route(a, b),

  calendrier: (a, b, c) => a === "rdv" ? Rdv.route(b, c) : Cal.page(a, b),

  taches: (a, b, c) => Taches.route(a, b, c),

  parametres: a => Reglages.route(a),

  statistiques: () => Stats.page(),

  /* Bloc « Tâches à venir » (tableau de bord et calendrier) : vraies tâches, les plus urgentes d’abord */
  blocTaches(af, max) {
    return `<section class="card"><div class="sec-tete"><h2>Tâches à venir</h2><a href="#taches">Toutes les tâches${af.length > max ? ` (${af.length})` : ""}</a></div>
      ${af.length ? `<ul class="liste">${af.slice(0, max).map(t => Taches.ligne(t)).join("")}</ul>`
        : `<p class="vide">Aucune tâche à faire. <a href="#taches/nouveau">Ajouter une tâche</a></p>`}</section>`;
  }
};

    { const l = document.createElement("link"); l.rel = "apple-touch-icon"; l.href = PHOTOS.profil; document.head.appendChild(l); }  // icône sur l’écran d’accueil de l’iPhone

    });
    $("#vue").addEventListener("click", e => { if (e.target.closest("[data-action=sauvegarder-global]")) Sauvegarde.telechargerTout(); });
    let msg = null; try { msg = sessionStorage.getItem("atelier.message"); sessionStorage.removeItem("atelier.message"); } catch (e) { /* rien */ }
    if (msg) setTimeout(() => toast(msg), 300);
    window.addEventListener("hashchange", () => this.afficher());
    this.lier();
    /* Fenêtre des opérations (hors de la zone principale) */
    const dlgOp = $("#dlg-op");
    dlgOp.addEventListener("submit", e => { if (e.target.matches("[data-op-form]")) { e.preventDefault(); Operations.enregistrer(e.target); } });
    dlgOp.addEventListener("click", e => { if (e.target.closest("[data-fermer]")) Operations.fermer(); });
    $("#dlg-rdv").addEventListener("click", e => {  // fenêtre de détails d’un rendez-vous
      if (e.target.closest("[data-fermer]")) fermerDialogue("#dlg-rdv");
      const sr = e.target.closest("[data-supprimer-rdv]"); if (sr) Rdv.supprimer(sr.dataset.supprimerRdv);
    });
    dlgOp.addEventListener("input", e => { if (e.target.name) Operations.erreur(e.target.name, ""); });
    this.afficher();
    Nuage.demarrer();
  },
  /* Un seul jeu d’écouteurs sur la zone principale (délégation d’événements) */
  lier() {
    const vue = $("#vue");
    const filtre = e => {
      const t = e.target, d = t.dataset || {};
      if (d.filtre) { Filtres[d.filtre] = t.value; Contacts.majListe(); }
      else if (d.fj) { FiltresJ[d.fj] = t.value; FiltresJ.max = 100; JournalUI.majZone(); }
      else if (d.fd) { FiltresD[d.fd] = t.value; Dossiers.majListe(); }
      else if (d.statut && e.type === "change") Dossiers.changerStatut(d.statut, t.value);  // changement de statut manuel uniquement
    };
    vue.addEventListener("input", e => {
      const fd = e.target.closest && e.target.closest("form[data-form=dossier]");
      if (fd && ["montant", "acompte", "acompteVerse"].includes(e.target.name)) Dossiers.majReste(fd);
      if (e.target.matches("[data-recherche-contact]")) { Selecteur.chercher(e.target.value); return; }
      filtre(e); const f = e.target.closest && e.target.closest("[data-form]"); if (f && e.target.name) Contacts.erreur(e.target.name, "");
    });
    vue.addEventListener("keydown", e => {
      if (e.target.matches("[data-recherche-contact]")) Selecteur.clavier(e);
      if (e.target.dataset && e.target.dataset.edit) {
        if (e.key === "Escape") { Dossiers.annulerChamp(e.target); e.target.blur(); }
        else if (e.key === "Enter" && e.target.tagName === "INPUT") { e.preventDefault(); e.target.blur(); }  // Entrée = enregistrer
      }
    });
    vue.addEventListener("change", e => {
      if (e.target.id === "f-dossierId" && e.target.closest("form[data-form=tache], form[data-form=rdv]")) { Taches.evenementChoisi(e.target.value); return; }
      const t = e.target;
      if (t.dataset.regleActif) { Reglages.basculer(t.dataset.regleActif, t.checked); return; }
      if (t.id === "fichier-import-ev") { const f = t.files && t.files[0]; t.value = ""; if (f) ImportE.charger(f); return; }
      if (t.dataset.mapEv !== undefined && ImportE.etat) { ImportE.etat.mapping[+t.dataset.mapEv] = t.value; App.afficher(true); return; }
      if (t.hasAttribute("data-doublons-ev") && ImportE.etat) { ImportE.etat.doublons = t.value; App.afficher(true); return; }
      if (t.hasAttribute("data-manquants-ev") && ImportE.etat) { ImportE.etat.manquants = t.value; App.afficher(true); return; }
      if (t.hasAttribute("data-auto-ev") && ImportE.etat) { ImportE.etat.auto = t.checked; App.afficher(true); return; }
      if (t.id === "fichier-import") { const f = t.files && t.files[0]; t.value = ""; if (f) ImportC.charger(f); return; }
      if (t.dataset.map !== undefined && ImportC.etat) { ImportC.etat.mapping[+t.dataset.map] = t.value; App.afficher(true); return; }
      if (t.hasAttribute("data-doublons") && ImportC.etat) { ImportC.etat.doublons = t.value; App.afficher(true); return; }
      if (t.id === "fichier-restauration") { const f = t.files && t.files[0]; t.value = ""; if (f) Sauvegarde.restaurerFichier(f); return; }
      if (t.dataset.stat) { if (t.dataset.stat === "comparer") StatEtat.comparer = t.checked; else StatEtat[t.dataset.stat] = t.value;
        if (t.dataset.stat === "periode" && t.value === "perso" && !StatEtat.du) { const P = Stats.periode(); StatEtat.du = P.du; StatEtat.au = P.au; }
        App.afficher(true); return; }
      if (t.dataset.acompte) { Dossiers.basculerAcompte(t.dataset.acompte, t.checked); return; }
      if (t.dataset.edit) { Dossiers.enregistrerChamp(t); return; }
      if (t.closest && t.closest("form[data-form=dossier]") && t.name === "acompteVerse") { Dossiers.majReste(t.closest("form")); return; }
      if (t.hasAttribute("data-cal-terminees")) { CalEtat.terminees = t.checked; App.afficher(true); return; }
      if (t.hasAttribute("data-auto-global")) { Reglages.basculerGlobal(t.checked); return; }
      if (t.id === "f-declencheur") { $("#ch-statut").hidden = t.value !== "statut"; $("#ch-operation").hidden = t.value !== "operation"; return; }
      if (t.id === "f-reference") { $("#ch-jours").hidden = t.value === "aucune"; return; }
      filtre(e);
    });
    vue.addEventListener("submit", e => { if (e.target.matches("[data-form]")) { e.preventDefault(); ({ dossier: Dossiers, tache: Taches, regle: Reglages, rdv: Rdv }[e.target.dataset.form] || Contacts).enregistrer(e.target); } });
    vue.addEventListener("click", e => {
      const ch = e.target.closest("[data-choisir]"); if (ch) { Selecteur.choisir(ch.dataset.choisir); return; }
      const vtd = e.target.closest("[data-vue-tache]"); if (vtd) FiltresT.vue = vtd.dataset.vueTache;  // puis le lien s’ouvre normalement
      const rv = e.target.closest("[data-rdv]"); if (rv) { Rdv.details(rv.dataset.rdv); return; }
      const nr = e.target.closest("[data-nouveau-rdv]"); if (nr) { location.hash = "#calendrier/rdv/nouveau/" + nr.dataset.nouveauRdv; return; }
      const sr = e.target.closest("[data-supprimer-rdv]"); if (sr) { Rdv.supprimer(sr.dataset.supprimerRdv); return; }
      const jr = e.target.closest("[data-jour]"); if (jr && !e.target.closest("a, button")) { Cal.clicJour(jr); return; }
      const vt = e.target.closest("[data-vue-t]"); if (vt) { FiltresT.vue = vt.dataset.vueT; this.afficher(true); return; }
      const sm = e.target.closest("details.faites > summary"); if (sm) Taches.detailsOuvert = !sm.parentNode.open;
      const b = e.target.closest("[data-action]"); if (!b) return;
      const act = b.dataset.action;
      if (act === "changer-contact" || act === "retirer-contact") Selecteur.vider();
      else if (act === "creer-contact-evenement") Selecteur.creerContact(b);
      else if (act === "ajouter-op") Operations.ouvrir(b.dataset.dos);
      else if (act === "modifier-op") Operations.ouvrir(b.dataset.dos, b.dataset.op);
      else if (act === "supprimer-op") Operations.supprimer(b.dataset.dos, b.dataset.op);
      else if (act === "basculer-tache") Taches.basculer(b.dataset.id);
      else if (act === "supprimer-tache") Taches.supprimer(b.dataset.id);
      else if (act === "telecharger-brut-t") StockageTaches.telechargerBrut();
      else if (act === "reinitialiser-t") Taches.reinitialiser();
      else if (act === "supprimer-regle") Reglages.supprimer(b.dataset.id);
      else if (act === "regles-defaut") Reglages.retablir();
      else if (act === "telecharger-brut-p") Parametres.telechargerBrut();
      else if (act === "reinitialiser-p") Reglages.reinitialiser();
      else if (act === "telecharger-brut-r") StockageRdv.telechargerBrut();
      else if (act === "reinitialiser-r") Cal.reinitialiser();
      else if (act === "sauvegarder") Sauvegarde.telechargerTout();
      else if (act === "restaurer") $("#fichier-restauration").click();
      else if (act === "nuage-synchro") Nuage.synchroniser(true);
      else if (act === "nuage-deconnexion") confirmer("Se déconnecter ?", `Vos données restent enregistrées sur cet appareil${Nuage.enAttente() ? ", y compris les modifications pas encore envoyées, qui partiront à la prochaine connexion" : ""}. Il faudra vous reconnecter pour les retrouver et les synchroniser.`, "Se déconnecter").then(ok => { if (ok) Nuage.deconnecter(); });
      else if (act === "nuage-connexion") Nuage.afficherConnexion();
      else if (act === "exporter-csv") Sauvegarde.exporterCsv();
      else if (act === "telecharger-copie") { const c = Sauvegarde.copie(); if (c) telechargerFichier(c.texte, Sauvegarde.nom("copie-de-securite-crm-photographe"), "application/json"); }
      else if (act === "revenir-copie") { const c = Sauvegarde.copie(); if (c) Sauvegarde.restaurerTexte(c.texte, "copie de sécurité"); }
      else if (act === "recharger") location.reload();
      else if (act === "import-choisir") $("#fichier-import").click();
      else if (act === "import-ev-choisir") $("#fichier-import-ev").click();
      else if (act === "import-ev-modele") ImportE.modele();
      else if (act === "import-ev-recommencer") { ImportE.etat = null; App.afficher(); }
      else if (act === "import-ev-valider") ImportE.valider();
      else if (act === "import-ev-annuler") ImportE.annuler();
      else if (act === "import-ev-reset" || act === "import-ev-fin") ImportE.etat = null;
      else if (act === "import-modele") ImportC.modele();
      else if (act === "import-recommencer") { ImportC.etat = null; App.afficher(); }
      else if (act === "import-valider") ImportC.valider();
      else if (act === "import-annuler") ImportC.annuler();
      else if (act === "import-reset" || act === "import-fin") ImportC.etat = null;  // puis le lien s’ouvre normalement
      else if (act === "journal-plus") { FiltresJ.max += 200; JournalUI.majZone(); }
      else if (act === "journal-csv") JournalUI.exporterCsv();
      else if (act === "journal-vider") JournalUI.vider();
      else if (act === "journal-brut") telechargerFichier(Disque.lire(CLE_JOURNAL) || "", "journal-illisible.json", "application/json");
      else if (act === "effacer-filtres") { Filtres.q = ""; Filtres.type = ""; this.afficher(); }
      else if (act === "supprimer") Contacts.supprimer(b.dataset.id);
      else if (act === "telecharger-brut") Stockage.telechargerBrut();
      else if (act === "reinitialiser") Contacts.reinitialiser();
      else if (act === "effacer-filtres-d") { FiltresD.q = ""; FiltresD.statut = ""; FiltresD.type = ""; this.afficher(); }
      else if (act === "supprimer-dossier") Dossiers.supprimer(b.dataset.id);
      else if (act === "telecharger-brut-d") StockageDossiers.telechargerBrut();
      else if (act === "reinitialiser-d") Dossiers.reinitialiser();
    });
  },
  /* Message général (une seule fois en haut de page) quand le stockage pose problème */
  bandeauGlobal() {
    const S = [Stockage, StockageDossiers, StockageTaches, StockageRdv, Parametres];
    if (this.autreOnglet) return `<div class="bandeau r" role="alert"><b>Vos données ont été modifiées dans un autre onglet ou une autre fenêtre.</b> Pour ne pas écraser ces changements, rechargez cette page avant de continuer (la saisie en cours sera perdue).<div class="actions"><button class="btn" data-action="recharger">Recharger la page</button></div></div>`;
    if (S.some(x => x.ecritureEchouee)) return `<div class="bandeau r" role="alert"><b>Vos dernières modifications n’ont pas pu être enregistrées dans ce navigateur${Disque.plein ? " : son espace de stockage est plein" : ""}.</b> Elles sont toujours affichées, mais seront perdues si vous fermez la page. Téléchargez une sauvegarde maintenant pour les conserver${Disque.plein ? ", puis libérez de la place (par exemple en supprimant des éléments devenus inutiles)" : ""}.<div class="actions"><button class="btn" data-action="sauvegarder-global">Télécharger une sauvegarde</button></div></div>`;
    if (S.some(x => x.etat === "indisponible")) return `<div class="bandeau" role="alert"><b>Ce navigateur ne permet pas d’enregistrer vos données</b> (navigation privée ou réglages de confidentialité). Vous pouvez travailler normalement, mais tout sera perdu à la fermeture de la page : pensez à télécharger une sauvegarde.<div class="actions"><button class="btn sec" data-action="sauvegarder-global">Télécharger une sauvegarde</button></div></div>`;
    return "";
  },
  rechargerDonnees(message) {
    const saisie = $("#vue form[data-form]") || $("#dlg-op").open || $("#dlg-rdv").open || $("#dlg").open;
    if (saisie) { this.autreOnglet = true; if (!$("#vue .alerte-globale")) $("#vue").insertAdjacentHTML("afterbegin", `<div class="page alerte-globale">${this.bandeauGlobal()}</div>`); return; }
    [Stockage, StockageDossiers, StockageTaches, StockageRdv, Parametres].forEach(x => { x.etat = "ok"; x.brut = null; x.ecritureEchouee = false; });
    Stockage.contacts = []; StockageDossiers.dossiers = []; StockageTaches.taches = []; StockageRdv.rdv = [];
    Parametres.auto = { actif: true, regles: copieDefaut() };
    [Stockage, StockageDossiers, StockageTaches, StockageRdv, Parametres].forEach(x => x.charger());
    this.afficher(true);
    toast(message || "Données mises à jour : elles ont été modifiées dans un autre onglet.");
  },
  /* garder = true : réaffiche la page sans remonter en haut (après ajout d’une opération, par exemple) */
  afficher(garder) {
    const [pid, a, b, c] = location.hash.slice(1).split("/");
    const id = ROUTES.some(r => r.id === pid) ? pid : "accueil";
    if (location.hash !== this.courant) { this.precedent = this.courant; this.courant = location.hash; }  // pour revenir à la page d’origine
    const surNouveauContact = id === "contacts" && a === "nouveau";
    if (!surNouveauContact) RetourEvenement = null;  // on a quitté le parcours « créer un contact depuis un événement »
    Operations.fermer(); fermerDialogue("#dlg-rdv");
    const html = Vues[id](a, b, c);
    if (!surNouveauContact) Brouillon = null;  // le brouillon n’est utilisé qu’une fois, par le formulaire d’événement
    if (html === null) { toast({ dossiers: "Cet événement n’existe pas ou a été supprimé.", taches: "Cette tâche n’existe pas ou a été supprimée.", parametres: "Cette automatisation n’existe pas ou a été supprimée.", calendrier: "Ce rendez-vous n’existe pas ou a été supprimé." }[id] || "Ce contact n’existe pas ou a été supprimé.", "err"); location.hash = "#" + id; return; }
    const vue = $("#vue"), y = vue.scrollTop, wy = window.scrollY;
    const alerte = this.bandeauGlobal();
    vue.innerHTML = (alerte ? `<div class="page alerte-globale">${alerte}</div>` : "") + html;
    const bulle = $("#bulle-stat"); if (bulle) bulle.hidden = true;
    if (id === "statistiques") Stats.dessiner();  // les graphiques ont besoin de la largeur réelle
    if (garder) { vue.scrollTop = y; window.scrollTo(0, wy); } else { vue.scrollTop = 0; window.scrollTo(0, 0); }
    document.querySelectorAll("#menu a").forEach(l => {
      if (l.dataset.r === id) l.setAttribute("aria-current", "page"); else l.removeAttribute("aria-current");
    });
    document.title = ROUTES.find(r => r.id === id).libelle + " — Atelier";
  }
};
App.init();
</script>
</body>
</html>
