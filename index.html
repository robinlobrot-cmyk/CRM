<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Atelier">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F7F2EB">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maëlys Lainé — Atelier</title>
<style>
:root{
  /* Thème « Maëlys Lainé » : ivoire, sable, lumière dorée, vignes de Champagne, noir et blanc doux */
  --fond:#F7F2EB; --surface:#FFFCF8; --encre:#2B2420; --doux:#7D7068; --trait:#E8DFD3; --sable:#EFE6DA; --film:#241E1B;
  --sauge:#6E7350; --sauge-clair:#EEEDE2; --laiton:#A8732F; --laiton-clair:#F6E9D5; --rose:#B0533B; --rose-clair:#F8E3DA;--ardoise:#5E6870;--ardoise-clair:#E9EBEC;
  --serif:"Lora Atelier","Cormorant Garamond",Didot,"Bodoni 72",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:6px;
}
@media (prefers-color-scheme:dark){
  :root{--fond:#171412;--surface:#211D1A;--encre:#F1E9DF;--doux:#AB9E92;--trait:#3A332D;--sable:#1D1916;--film:#0F0C0B;--sauge:#B0B58A;--sauge-clair:#2D2E23;--laiton:#DDAE68;--laiton-clair:#3A2F20;--rose:#E08C74;--rose-clair:#3D2620;--ardoise:#AAB6BE;--ardoise-clair:#283035}
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:16px/1.55 var(--sans);background:var(--fond);color:var(--encre);display:flex}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.2}
h1{font-size:2rem;letter-spacing:-.01em} h2{font-size:1.2rem} h3{font-size:1.05rem}
a{color:inherit}
:focus-visible{outline:2px solid var(--sauge);outline-offset:2px}

/* Navigation */
nav{width:236px;flex:none;background:var(--encre);color:#E9ECE7;padding:28px 18px;display:flex;flex-direction:column;gap:28px;position:sticky;top:0;height:100vh}
.logo{font:600 1.45rem var(--serif);padding:0 10px;display:flex;align-items:center;gap:10px}
.logo i{width:22px;height:22px;border:2px solid #E9ECE7;border-radius:50%;display:grid;place-items:center}
.logo i::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--laiton)}
nav ul{list-style:none;padding:0;display:flex;flex-direction:column;gap:4px}
nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;text-decoration:none;color:#B8C2BF;font-weight:500}
nav a:hover{background:#2B383C;color:#fff}
nav a[aria-current=page]{background:#E9ECE7;color:#1F2A2E}
nav svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav .lib-court{display:none}
.nav-pied{margin-top:auto;font-size:.82rem;color:#8E9B98;padding:0 10px}

main{flex:1;min-width:0;height:100vh;overflow-y:auto;padding:40px clamp(18px,4vw,56px) 56px}
.page{max-width:1080px;margin:0 auto}
.entete{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.entete p{color:var(--doux);margin-top:4px}
.btn{font:600 .92rem var(--sans);padding:10px 16px;border-radius:8px;border:1px solid var(--encre);background:var(--encre);color:var(--fond);cursor:pointer;display:inline-block;text-decoration:none;text-align:center}
.btn:hover{filter:brightness(1.15)}
.btn:disabled,.btn[aria-disabled=true]{cursor:not-allowed;opacity:.55;pointer-events:none}
.btn.sec{background:transparent;color:var(--encre)}
.btn.danger{background:var(--rose);border-color:var(--rose);color:var(--fond)}
.btn.danger.sec{background:transparent;color:var(--rose)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.retour{display:inline-block;margin-bottom:14px;color:var(--doux);font-size:.92rem}
.page.narrow{max-width:720px}
.outils{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.outils .recherche{margin:0;flex:1 1 260px;max-width:none}
.outils select,.champ input,.champ select,.champ textarea{padding:10px 12px;border:1px solid var(--trait);border-radius:8px;background:var(--surface);color:var(--encre);font:inherit}
.champ input,.champ select,.champ textarea{width:100%;background:var(--fond)}
.champ textarea{min-height:130px;resize:vertical}
.champ label{display:block;font-weight:600;font-size:.9rem;margin-bottom:6px}
.champ [aria-invalid=true]{border-color:var(--rose)}
.err{color:var(--rose);font-size:.84rem;margin-top:4px}.req{color:var(--rose)}
.form{display:grid;gap:18px}.duo{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.ligne{display:flex;align-items:center;gap:14px;flex:1;min-width:0;text-decoration:none}
.ligne:hover b{text-decoration:underline}
.idfiche{display:flex;gap:16px;align-items:center}
.avatar.grand{width:64px;height:64px;font-size:1.4rem}
.def{display:grid;grid-template-columns:auto 1fr;gap:10px 18px}.def dt{color:var(--doux);font-size:.9rem}.def dd{margin:0;word-break:break-word}
.vide{color:var(--doux)}.notes{white-space:pre-wrap}
.bandeau{border:1px solid var(--laiton);background:var(--laiton-clair);border-radius:var(--r);padding:14px 18px;margin-bottom:18px}
.bandeau.r{border-color:var(--rose);background:var(--rose-clair)}.bandeau .actions{margin-top:10px}
.etat-vide{text-align:center;padding:44px 20px}.etat-vide p{color:var(--doux);margin:6px 0 18px}
dialog{margin:auto;border:1px solid var(--trait);border-radius:var(--r);background:var(--surface);color:var(--encre);padding:24px;max-width:min(440px,90vw)}
dialog::backdrop{background:rgba(20,28,30,.55)}.dlg-t{margin:8px 0 20px}.dlg-t ul{margin:8px 0 8px 20px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--encre);color:var(--fond);padding:12px 20px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:9}
#toast.show{opacity:1}#toast.err{background:var(--rose)}
.puce.sa{background:var(--ardoise-clair);color:var(--ardoise)}.puce.sb{background:var(--laiton-clair);color:var(--laiton)}
.puce.sc{background:var(--sauge-clair);color:var(--sauge)}.puce.sd{background:var(--encre);color:var(--fond)}.puce.se{background:var(--rose-clair);color:var(--rose)}
.dos{flex-wrap:wrap}.dos .client{font-size:.9rem;color:var(--doux)}.dos .mt{min-width:78px;text-align:right;font-weight:600}
.sec-tete{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}.sec-tete h2{margin:0}
.statut-ligne{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.statut-ligne select{padding:10px 12px;border:1px solid var(--trait);border-radius:8px;background:var(--fond);color:var(--encre);font:inherit}
/* Itération 5 : sélecteur de contact, historique des opérations */
.btn.petit{padding:6px 11px;font-size:.82rem}
.coche{display:flex;gap:10px;align-items:center;font-weight:500;cursor:pointer}
.coche input{width:18px;height:18px;accent-color:var(--sauge);flex:none}
.contact-choisi{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--sauge);border-radius:8px;background:var(--sauge-clair)}
.contact-choisi .infos{flex:1;min-width:160px}.contact-choisi small{display:block;color:var(--doux)}
.resultats{list-style:none;padding:4px;margin-top:6px;border:1px solid var(--trait);border-radius:8px;background:var(--surface);max-height:300px;overflow-y:auto}
.resultats li{display:flex;gap:12px;align-items:center;padding:8px 10px;border-radius:6px;cursor:pointer}
.resultats li[aria-selected=true],.resultats li[role=option]:hover{background:var(--sauge-clair)}
.resultats li small{display:block;color:var(--doux)}
.resultats li.aucun{display:block;cursor:default;color:var(--doux)}.resultats li.aucun .btn{margin-top:10px}
.avatar.petit{width:32px;height:32px;font-size:.85rem}
.histo li{align-items:flex-start;flex-wrap:wrap}
.histo .op{flex:1;min-width:220px}
.histo .op-tete{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.histo .quand{font-size:.86rem;color:var(--doux)}
.histo .com{white-space:pre-wrap;margin-top:4px;font-size:.94rem}
.histo .actions{gap:6px}
/* Itération 6 : tâches */
.onglets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.onglets button{font:600 .9rem var(--sans);padding:8px 14px;border-radius:99px;border:1px solid var(--trait);background:var(--surface);color:var(--encre);cursor:pointer}
.onglets button span{color:var(--doux);font-weight:500;margin-left:4px}
.onglets button[aria-pressed=true]{background:var(--encre);border-color:var(--encre);color:var(--fond)}
.onglets button[aria-pressed=true] span{color:inherit;opacity:.75}
.tache{flex-wrap:wrap}
.tache .infos{flex:1;min-width:0}
.tache .infos a.titre-t{text-decoration:none}.tache .infos a.titre-t:hover b{text-decoration:underline}
.tache .note-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tache.faite b{text-decoration:line-through;color:var(--doux);font-weight:500}
.tache .actions{gap:6px}
.case-t{width:22px;height:22px;border:1.5px solid var(--doux);border-radius:6px;background:transparent;cursor:pointer;flex:none;padding:0;display:grid;place-items:center}
.case-t:hover{border-color:var(--sauge);background:var(--sauge-clair)}
.case-t[aria-pressed=true]{background:var(--sauge);border-color:var(--sauge)}
.case-t[aria-pressed=true]::after{content:"";width:10px;height:5px;border:2px solid var(--fond);border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.tache.retard .case-t{border-color:var(--rose)}
.faites{margin-top:14px;border-top:1px solid var(--trait);padding-top:12px}
.faites summary{cursor:pointer;color:var(--doux);font-weight:600;font-size:.92rem}
.faites .liste{margin-top:12px}
.aide{color:var(--doux);font-size:.84rem;margin-top:4px}
@media(max-width:620px){.tache .actions{width:100%;padding-left:36px}}
/* Itération 7 : automatisations et paramétrage */
.auto-t{display:inline-block;font-size:.7rem;font-weight:600;color:var(--doux);border:1px solid var(--trait);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:1px}
.interrupteur{position:relative;display:inline-block;width:40px;height:24px;flex:none;cursor:pointer}
.interrupteur input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.interrupteur span{position:absolute;inset:0;border-radius:99px;background:var(--trait);transition:background .15s;pointer-events:none}
.interrupteur span::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.interrupteur input:checked+span{background:var(--sauge)}
.interrupteur input:checked+span::after{transform:translateX(16px)}
.interrupteur input:focus-visible+span{outline:2px solid var(--sauge);outline-offset:2px}
.interrupteur input:disabled{cursor:not-allowed}
.global{display:flex;align-items:center;gap:14px}
.regle{flex-wrap:wrap}.regle .infos{flex:1;min-width:200px}.regle .actions{gap:6px}
.regle.inactive .infos{opacity:.55}
.form h2.etape{font-size:1rem;margin-bottom:-6px}
@media(max-width:620px){.regle .actions{width:100%;padding-left:54px}}
/* Itération 19 : synchronisation en ligne */
.nuage{display:flex;align-items:center;gap:8px;margin:auto 10px 10px;padding:7px 12px;border-radius:999px;font-size:.8rem;color:var(--doux);text-decoration:none;border:1px solid var(--trait);background:var(--surface)}
.nuage[hidden]{display:none}
.nuage + .nav-pied{margin-top:0}
.nuage:hover{color:var(--encre)}
.pastille{width:8px;height:8px;border-radius:50%;background:var(--doux);flex:none}
[data-etat=ok] .pastille{background:var(--sauge,#7c8f6a)}
[data-etat=synchro] .pastille,[data-etat=attente] .pastille{background:var(--laiton);animation:pulse-n 1.2s ease-in-out infinite}
[data-etat=horsligne] .pastille{background:var(--doux)}
[data-etat=erreur] .pastille,[data-etat=session] .pastille{background:var(--rose)}
@keyframes pulse-n{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.pastille{animation:none!important}}
.nuage-etat{display:flex;align-items:center;gap:8px;margin:8px 0 4px}
body.verrou>nav,body.verrou>main{visibility:hidden}
.connexion{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:var(--fond);overflow:auto}
.cx-carte{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--trait);border-radius:14px;padding:32px 28px;display:flex;flex-direction:column;gap:6px;text-align:left}
.cx-carte .portrait{align-self:center;border-radius:50%;object-fit:cover;margin-bottom:6px}
.cx-carte h1{text-align:center;font-size:1.9rem;margin:0}
.cx-sous{text-align:center;color:var(--doux);font-size:.9rem;margin-bottom:8px}
.cx-carte label{font-size:.86rem;color:var(--doux);margin-top:8px}
.cx-carte input{font:inherit;padding:11px 12px;border:1px solid var(--trait);border-radius:8px;background:var(--fond);color:var(--encre)}
.cx-carte input:focus{outline:none;border-color:var(--laiton);box-shadow:0 0 0 3px color-mix(in srgb,var(--laiton) 20%,transparent)}
.cx-carte .btn{margin-top:16px;justify-content:center}
.cx-msg{color:var(--rose);font-size:.9rem;min-height:0}.cx-msg:empty{display:none}
@media(max-width:780px){.nuage{position:fixed;top:10px;right:10px;margin:0;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.08)}.nuage .nuage-l{display:none}.nuage{padding:9px}}
/* Itération 18 : modification directe sur la fiche événement */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.titre-edit-zone{flex:1;min-width:0}
.titre-edit{font-family:var(--serif);font-weight:inherit;font-size:2rem;letter-spacing:-.01em;line-height:1.2;color:var(--encre);background:transparent;border:1px solid transparent;border-radius:8px;padding:2px 8px;margin-left:-9px;width:100%;max-width:100%}
.def-edit input,.def-edit select{font:inherit;background:transparent;border:1px solid transparent;border-radius:8px;padding:5px 8px;margin:-6px 0 -6px -9px;max-width:100%;color:inherit}
.def-edit select{appearance:auto}
.titre-edit,.def-edit input:not([type=checkbox]),.def-edit select,.notes-edit{border-bottom:1px dashed var(--trait)}
.def-edit dd{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px}
.def-edit dt{align-self:center}
.champ-euro{display:inline-flex;align-items:center;gap:4px;margin-right:6px}.champ-euro input{width:6.5em}
.notes-edit{width:100%;min-height:110px;font:inherit;line-height:1.55;background:transparent;border:1px solid transparent;border-radius:8px;padding:8px 10px;margin:-6px -11px;resize:vertical;color:inherit;box-sizing:content-box;max-width:100%}
.titre-edit:hover,.def-edit input:hover,.def-edit select:hover,.notes-edit:hover{border-color:var(--trait);background:var(--sable)}
.titre-edit:focus,.def-edit input:focus,.def-edit select:focus,.notes-edit:focus{outline:none;border-color:var(--laiton);background:var(--surface);box-shadow:0 0 0 3px color-mix(in srgb,var(--laiton) 20%,transparent)}
[data-edit][aria-invalid=true]{border-color:var(--rose)!important}
[data-edit]:disabled{cursor:not-allowed;opacity:.8}
.def-edit .err,.titre-edit-zone .err{flex-basis:100%;display:block}.def-edit .err:empty,.titre-edit-zone .err:empty{display:none}
.auto-save{margin:-6px 0 16px}
@media(max-width:780px){.titre-edit{font-size:1.6rem}.notes-edit{margin:-6px 0;width:calc(100% - 22px)}}
/* Itération 17 : acompte et reste à charge */
.duo-acompte .label-vide{display:block;font-size:.9rem;margin-bottom:6px}
.duo-acompte .coche{padding:10px 0}
.reste-form{margin-top:-6px;padding:10px 14px;border-radius:8px;background:var(--sable);font-size:.95rem}
.reste-form b{font-weight:600}
.coche-acompte{display:inline-flex;font-weight:500}
.reste{font-weight:600}
.dos .mt small{display:block;font-weight:500;color:var(--doux);font-size:.78rem}
@media(max-width:620px){.duo-acompte .label-vide{display:none}}
/* Itération 16 : statistiques (palette validée : contraste et daltonisme, clair et sombre) */
:root{--c1:#BA7924;--c2:#316DA2;--cp:#D9CFC3}
@media(prefers-color-scheme:dark){:root{--c1:#C18634;--c2:#4F8BC2;--cp:#4A423B}}
.filtres-stat{align-items:center}
.filtres-stat select{min-width:210px}
.date-stat{display:flex;gap:6px;align-items:center;font-size:.9rem;color:var(--doux)}
.date-stat input{padding:9px 10px;border:1px solid var(--trait);border-radius:8px;background:var(--surface);color:var(--encre);font:inherit}
.stat .stat-titre{display:block;font-weight:600;font-size:.85rem;color:var(--encre);margin-bottom:4px}
.note-stat{margin:12px 0 18px}
.demandes-stat .duo-stat{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.duo-stat>div{display:flex;gap:14px;align-items:flex-start}
.duo-stat b{font:400 2rem/1 var(--serif);min-width:44px}
.duo-stat small{display:block;color:var(--doux);font-size:.8rem;margin-top:2px}
.graph-stat{margin-top:18px}
.sous-graph{margin:-6px 0 12px;font-size:.9rem}
.legende-stat{display:flex;gap:18px;flex-wrap:wrap;font-size:.85rem;color:var(--doux);margin-bottom:8px}
.legende-stat .cle{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.cle.c1{background:var(--c1)}.cle.c2{background:var(--c2)}.cle.cp{background:var(--cp)}
.zone-graph svg{display:block;max-width:100%}
.zone-graph .c1{fill:var(--c1)}.zone-graph .c2{fill:var(--c2)}.zone-graph .cp{fill:var(--cp)}
.zone-graph .grille-l{stroke:var(--trait);stroke-width:1}
.zone-graph .base-l{stroke:var(--doux);stroke-width:1;opacity:.45}
.zone-graph .axe{fill:var(--doux);font:11px var(--sans);font-variant-numeric:tabular-nums}
.zone-graph .val{fill:var(--encre);font:600 12px var(--sans)}
.zone-graph .cible{fill:transparent;outline:none}
.zone-graph .cible:hover,.zone-graph .cible.actif{fill:var(--encre);fill-opacity:.05}
.zone-graph .cible:focus-visible{fill:var(--encre);fill-opacity:.08}
.graph-vide{padding:22px 0;text-align:center}
.chiffres{margin-top:12px}.chiffres summary{cursor:pointer;color:var(--doux);font-size:.88rem;font-weight:600}.chiffres .table-import{margin-top:10px}
.repart{list-style:none;padding:0;display:grid;gap:12px;margin-top:4px}
.repart li{display:grid;grid-template-columns:130px 1fr 90px;align-items:center;gap:12px}
.r-nom{font-size:.92rem}
.r-piste i{display:block;height:10px;background:var(--c1);border-radius:0 4px 4px 0;min-width:4px}
.r-val{text-align:right;font-variant-numeric:tabular-nums}.r-val small{color:var(--doux)}
.bulle-stat{position:fixed;z-index:20;background:var(--surface);color:var(--encre);border:1px solid var(--trait);border-radius:6px;padding:8px 12px;font-size:.85rem;box-shadow:0 6px 18px rgba(43,36,32,.15);pointer-events:none;min-width:160px;left:0;top:0}
.bulle-stat .b-titre{font-weight:600;color:var(--doux);font-size:.78rem;margin-bottom:4px}
.bulle-stat span{color:var(--doux)}
@media(max-width:620px){.demandes-stat .duo-stat{grid-template-columns:1fr}.repart li{grid-template-columns:92px 1fr 66px;gap:8px}.filtres-stat select{min-width:0;flex:1 1 100%}}
/* Itération 14 : adresse et import de contacts */
.table-import{overflow-x:auto;border:1px solid var(--trait);border-radius:var(--r)}
.table-import table{width:100%;border-collapse:collapse;font-size:.9rem}
.table-import th{text-align:left;font-weight:600;color:var(--doux);font-size:.8rem;padding:10px 12px;background:var(--sable);border-bottom:1px solid var(--trait)}
.table-import td{padding:8px 12px;border-top:1px solid var(--trait);vertical-align:middle}
.table-import tr:first-child td{border-top:0}
.table-import select{padding:7px 10px;border:1px solid var(--trait);border-radius:6px;background:var(--fond);color:var(--encre);font:inherit;min-width:210px}
.table-import tr.alerte-l td{background:var(--rose-clair)}
@media(max-width:620px){.mapping th:nth-child(2),.mapping td:nth-child(2){display:none}.table-import select{min-width:0;width:100%}.mapping td{padding:8px}}
.bilan-import{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:8px}
.bilan-import li::before{content:"✓";color:var(--sauge);font-weight:700;margin-right:8px}
.bilan-import li.att::before{content:"!";color:var(--laiton)}
.choix-doublons{border:0;padding:0;margin:16px 0 0;display:grid;gap:8px}
.choix-doublons legend{font-weight:600;margin-bottom:8px}
/* Itération 13 : journal des mouvements */
.journal li{align-items:flex-start;gap:12px;padding:10px 0}
.journal .log-h{width:44px;flex:none;font-variant-numeric:tabular-nums;color:var(--doux);font-size:.86rem;padding-top:1px}
.journal .puce{flex:none;min-width:92px;text-align:center}
.journal .infos{flex:1;min-width:0}
.journal .infos a{text-decoration:none}.journal .infos a:hover b{text-decoration:underline}
.journal small{overflow-wrap:anywhere}
@media(max-width:620px){.journal li{flex-wrap:wrap}.journal .infos{flex-basis:100%;padding-left:56px}}
/* Itération 10 : sauvegarde et sécurité des données */
.etat-sauv span{color:var(--laiton);font-weight:600}
.etat-sauv.jamais b{color:var(--rose)}
.rappel-sauv{margin-top:16px;padding:12px 14px;border-radius:8px;background:var(--sauge-clair);color:var(--encre)}
.copie-sec{margin-top:18px;padding:14px 16px;border:1px dashed var(--trait);border-radius:8px}
.copie-sec p{margin:4px 0 10px;font-size:.92rem}
.rappel-accueil{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:-8px 0 20px;font-size:.9rem;color:var(--doux)}
.rappel-accueil::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--laiton);flex:none}
.alerte-globale .bandeau{margin-bottom:18px}
/* Itération 9 : tableau de bord */
.acces{display:flex;gap:8px;flex-wrap:wrap;margin:-10px 0 22px}
.acces .btn{padding:8px 14px}
.acces span{font-weight:700;margin-right:2px}
a.card.stat{text-decoration:none;color:inherit;transition:border-color .15s}
a.card.stat:hover{border-color:var(--sauge)}
.stat.alerte{border-color:var(--rose);background:var(--rose-clair)}
.stat.alerte b,.stat.alerte span{color:var(--rose)}
.groupe{font:600 .78rem var(--sans);text-transform:uppercase;letter-spacing:.04em;color:var(--doux);margin:16px 0 6px}
.groupe:first-of-type{margin-top:0}
.groupe span{font-weight:500;margin-left:4px}
.groupe.retard{color:var(--rose)}
.avenir li{align-items:flex-start}
.av-date{width:92px;flex:none;font-size:.86rem;color:var(--doux);line-height:1.35}
.av-date b{display:block;color:var(--encre);font-weight:600}
.av-type{width:10px;height:10px;border-radius:3px;flex:none;margin-top:6px;background:var(--sauge)}
.av-type.av-evenement{background:var(--laiton)}.av-type.av-tache{background:var(--ardoise)}.av-type.av-retard{background:var(--rose)}
.avenir .infos{min-width:0;flex:1}
.g2+.g2{margin-top:18px}
@media(max-width:620px){.grille.indicateurs{grid-template-columns:1fr 1fr;gap:12px}.indicateurs .stat{padding:16px}.indicateurs .stat b{font-size:1.7rem}.av-date{width:76px}}
/* Itération 8 : calendrier dynamique et rendez-vous */
.ev.t{background:var(--ardoise-clair);color:var(--ardoise)}
.ev.x{text-decoration:line-through;opacity:.6}
a.ev{text-decoration:none}
button.ev{border:0;width:100%;text-align:left;font:inherit;font-weight:600;cursor:pointer}
.ev .h{font-weight:500;opacity:.85}
.legende .t::before{background:var(--ardoise-clair);border-color:var(--ardoise)}
.cal .c{position:relative;cursor:pointer}
.cal .c:hover{box-shadow:inset 0 0 0 2px var(--sauge-clair)}
.ajout-j{position:absolute;right:4px;top:4px;width:24px;height:24px;border-radius:50%;border:1px solid var(--trait);background:var(--surface);color:var(--doux);font:600 1rem/1 var(--sans);cursor:pointer;opacity:0;transition:opacity .1s;padding:0}
.c:hover .ajout-j,.sj:hover .ajout-j,.ajout-j:focus-visible{opacity:1}
.plus-j{display:block;margin-top:3px;font-size:.74rem;color:var(--doux);text-decoration:none;font-weight:600}
.plus-j:hover{text-decoration:underline}
.cal-outils{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.cal-outils .onglets{margin:0}
.cal-outils .coche{margin-left:auto;font-size:.9rem}
.nav-p{min-width:42px;font-size:1.1rem;padding:8px 12px;line-height:1.2}
.onglets a{font:600 .9rem var(--sans);padding:8px 14px;border-radius:99px;border:1px solid var(--trait);background:var(--surface);color:var(--encre);text-decoration:none}
.onglets a[aria-current=true]{background:var(--encre);border-color:var(--encre);color:var(--fond)}
.sem{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--trait);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.sj{border-left:1px solid var(--trait);min-height:280px;padding:8px;position:relative;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.sj:first-child{border-left:0}
.sj:hover{box-shadow:inset 0 0 0 2px var(--sauge-clair)}
.sj-t{display:flex;align-items:center;gap:6px;padding:0 2px 8px;border-bottom:1px solid var(--trait)}
.sj-t span{font-size:.8rem;color:var(--doux);font-weight:600;text-transform:capitalize}
.sj-t b{font:600 1.05rem var(--serif);min-width:28px;height:28px;line-height:28px;text-align:center;border-radius:50%}
.sj.auj .sj-t b{background:var(--encre);color:var(--fond)}
.sj .ajout-j{top:8px}
.sj .rien{color:var(--doux);font-size:.85rem;padding:0 2px}
.sem .item{flex-direction:column;gap:1px}
.item{display:flex;gap:10px;padding:6px 8px;border-radius:6px;border-left:3px solid var(--sauge);background:var(--sauge-clair);font-size:.85rem;cursor:default}
.item.it-evenement{border-color:var(--laiton);background:var(--laiton-clair)}
.item.it-tache{border-color:var(--ardoise);background:var(--ardoise-clair)}
.item.it-retard{border-color:var(--rose);background:var(--rose-clair)}
.item.it-x{opacity:.6}.item.it-x .it-titre{text-decoration:line-through}
.item .it-c{min-width:0;flex:1}
.it-titre{display:block;width:100%;padding:0;border:0;background:none;font:inherit;font-weight:600;color:var(--encre);text-align:left;text-decoration:none;cursor:pointer;overflow-wrap:anywhere}
.it-titre:hover{text-decoration:underline}
.item small{display:block;color:var(--doux);font-size:.78rem}
.item .it-h{font-weight:600;color:var(--doux);font-size:.78rem;white-space:nowrap}
.agenda-j+.agenda-j{margin-top:20px}
.agenda-j h3{font-size:1rem;margin-bottom:8px}
.agenda-j .item{font-size:.92rem;padding:10px 12px;margin-top:6px}
.agenda-j .it-h{min-width:112px}
.jour-panneau{display:none}
.jour-panneau .item+.item{margin-top:6px}
.planche a.vue{text-decoration:none}
.planche a.vue:hover .cadre{outline:2px solid #E9ECE7;outline-offset:1px}
#dlg-rdv{width:min(480px,92vw);max-width:none}
@media(max-width:620px){.duo.heures{grid-template-columns:1fr 1fr}}
@media(max-width:700px){
  .jour-panneau{display:block;margin-top:14px}
  .cal .c.sel{box-shadow:inset 0 0 0 2px var(--sauge)}
  .cal .ev{font-size:0;height:6px;padding:0;pointer-events:none}
  .cal .plus-j{pointer-events:none}
  .cal .plus-j{font-size:.62rem;margin-top:1px}
  .cal .ajout-j{display:none}
  .sem{grid-template-columns:1fr}
  .sj{border-left:0;border-top:1px solid var(--trait);min-height:0;cursor:default}
  .sj:first-child{border-top:0}
  .sj .ajout-j{opacity:1}
  .cal-outils .coche{margin-left:0}
  .agenda-j .item{flex-direction:column;gap:2px}
}
#dlg-op{width:min(540px,92vw);max-width:none}
#dlg-op .champ textarea{min-height:90px}
@media(max-width:700px){.liste li.dos .ligne{flex-basis:100%}}
@media(max-width:620px){.duo{grid-template-columns:1fr}}
@media(max-width:780px){#toast{bottom:84px}}
.card{background:var(--surface);border:1px solid var(--trait);border-radius:var(--r);padding:22px}
.card>h2{margin-bottom:14px}
.grille{display:grid;gap:18px}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g2{grid-template-columns:2fr 1.3fr;margin-top:18px}
@media(max-width:860px){.g2{grid-template-columns:1fr}}

/* Planche-contact : élément signature du tableau de bord */
.planche{display:flex;gap:10px;overflow-x:auto;padding:14px;background:var(--encre);border-radius:var(--r);margin-bottom:18px}
.vue{flex:0 0 150px;color:#E9ECE7;font-size:.82rem}
.vue .cadre{aspect-ratio:3/2;border-radius:3px;margin-bottom:8px;position:relative}
.vue .cadre.libre{background:transparent;border:1px dashed #51615F}
.vue b{display:block;font-size:.9rem}
.vue span{color:#9FAEAB}
.vue.auj .cadre::after{content:"Aujourd’hui";position:absolute;left:6px;top:6px;background:#E9ECE7;color:#1F2A2E;font-size:.7rem;font-weight:600;padding:1px 7px;border-radius:99px}

.stat b{display:block;font:600 2rem var(--serif)}
.stat span{color:var(--doux);font-size:.9rem}
.liste{list-style:none;padding:0}
.liste li{display:flex;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--trait)}
.liste li:first-child{border-top:0;padding-top:0}
.liste small{color:var(--doux);display:block}
.liste .fin{margin-left:auto;text-align:right;font-size:.88rem;color:var(--doux);white-space:nowrap}
.case{width:18px;height:18px;border:1.5px solid var(--doux);border-radius:5px;flex:none}

.puce{display:inline-block;font-size:.78rem;font-weight:600;padding:2px 10px;border-radius:99px;background:var(--sauge-clair);color:var(--sauge);white-space:nowrap}
.puce.l{background:var(--laiton-clair);color:var(--laiton)} .puce.r{background:var(--rose-clair);color:var(--rose)}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font:600 1rem var(--serif);flex:none;background:var(--sauge-clair);color:var(--sauge)}

/* Contacts */
.recherche{width:100%;max-width:360px;padding:10px 14px;border:1px solid var(--trait);border-radius:8px;background:var(--surface);color:var(--encre);font:inherit;margin-bottom:16px}
.contacts li{padding:14px 0}
.contacts .infos{min-width:0}
.contacts .infos b{display:block}
@media(max-width:620px){.contacts .fin .puce{display:none}}

/* Dossiers */
.dossiers{grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
.dossier h3{margin:10px 0 2px}
.dossier .qui{color:var(--doux);font-size:.92rem}
.etapes{display:flex;gap:4px;margin:16px 0 6px}
.etapes i{flex:1;height:5px;border-radius:3px;background:var(--trait)}
.etapes i.on{background:var(--sauge)}
.dossier footer{display:flex;justify-content:space-between;font-size:.86rem;color:var(--doux);border-top:1px solid var(--trait);margin-top:14px;padding-top:12px}

/* Calendrier */
.cal{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--trait);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.cal .j{padding:10px;text-align:center;font-size:.82rem;font-weight:600;color:var(--doux);border-bottom:1px solid var(--trait)}
.cal .c{min-height:104px;padding:6px;border-top:1px solid var(--trait);border-left:1px solid var(--trait);font-size:.78rem}
.cal .c:nth-child(7n+8){border-left:0}
.cal .c.cdi{background:repeating-linear-gradient(135deg,transparent 0 8px,var(--sauge-clair) 8px 9px)}
.cal .c.hors{opacity:.4}
.cal .n{font-weight:600;font-size:.85rem;display:inline-block;width:24px;height:24px;line-height:24px;text-align:center;border-radius:50%}
.cal .auj .n{background:var(--encre);color:var(--fond)}
.ev{display:block;margin-top:3px;padding:2px 6px;border-radius:5px;background:var(--sauge-clair);color:var(--sauge);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev.l{background:var(--laiton-clair);color:var(--laiton)} .ev.r{background:var(--rose-clair);color:var(--rose)}
.legende{display:flex;gap:18px;flex-wrap:wrap;margin:14px 0 22px;font-size:.86rem;color:var(--doux)}
.legende span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--sauge-clair);border:1px solid var(--sauge)}
.legende .l::before{background:var(--laiton-clair);border-color:var(--laiton)} .legende .r::before{background:var(--rose-clair);border-color:var(--rose)}
.legende .h::before{background:repeating-linear-gradient(135deg,transparent 0 3px,var(--sauge-clair) 3px 4px);border-color:var(--trait)}
@media(max-width:700px){.cal .c{min-height:64px;padding:3px}.ev{font-size:0;height:6px;padding:0}}

/* Mobile : barre d’onglets en bas */
@media(max-width:780px){
  body{flex-direction:column-reverse}
  nav{width:100%;height:auto;position:static;flex-direction:row;padding:6px 8px;gap:0}
  .logo,.nav-pied{display:none}
  nav ul{flex-direction:row;width:100%;justify-content:space-around}
  nav a{flex-direction:column;gap:2px;font-size:.7rem;padding:6px 3px}
  nav .lib{display:none} nav .lib-court{display:inline}
  main{height:auto;flex:1;padding-top:26px}
  h1{font-size:1.6rem}
}
@media(prefers-reduced-motion:no-preference){.page{animation:ap .25s ease-out}@keyframes ap{from{opacity:0}to{opacity:1}}}

body{font-size:15.5px;letter-spacing:.005em}
h1,h2,h3{font-family:var(--serif);font-weight:500;letter-spacing:-.005em}
h1{font-size:2.3rem;font-weight:400;line-height:1.1}
h2{font-size:1.22rem}
h1 em,h2 em{font-style:italic;font-weight:400}
::selection{background:var(--laiton-clair)}
/* Barre latérale : ivoire, portrait et signature */
nav{background:var(--sable);color:var(--encre);border-right:1px solid var(--trait);padding:30px 18px}
.logo{flex-direction:column;align-items:flex-start;gap:12px;padding:0 10px;font:400 1.45rem/1.1 var(--serif)}
.logo .portrait{width:58px;height:58px;border-radius:50%;object-fit:cover;border:3px solid var(--surface);box-shadow:0 2px 10px rgba(43,36,32,.12)}
.logo .signature{font-style:italic}
.logo small{display:block;font:600 .66rem var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--doux);margin-top:6px}
nav a{color:var(--doux);border-radius:4px}
nav a:hover{background:rgba(125,112,104,.1);color:var(--encre)}
nav a[aria-current=page]{background:var(--surface);color:var(--encre);box-shadow:0 1px 3px rgba(43,36,32,.08)}
nav a[aria-current=page] svg{stroke:var(--laiton)}
.nav-pied{color:var(--doux);font-size:.76rem;letter-spacing:.04em}
.nav-pied i{font-family:var(--serif)}
@media(max-width:780px){nav{border-right:0;border-top:1px solid var(--trait);padding:6px 6px}}
/* Éléments de base */
.btn{border-radius:3px;font-weight:500;letter-spacing:.02em}
.card{border-radius:var(--r);box-shadow:0 1px 2px rgba(43,36,32,.03)}
.surtitre{font:600 .72rem var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--laiton);margin:0 0 8px}
.stat b{font-weight:400;font-size:2.2rem}
dialog::backdrop{background:rgba(36,30,27,.55)}
dialog{border-radius:6px;box-shadow:0 20px 50px rgba(36,30,27,.25)}
.etat-vide h2{font-style:italic;font-weight:400;font-size:1.4rem}
/* Planche-contact : un vrai film, avec des photos */
.planche{background:var(--film);border-radius:4px;padding:16px 14px 14px;gap:12px}
.vue{color:#F1E9DF}
.vue .cadre{border-radius:2px;background-size:cover;background-position:center 30%}
.vue .cadre.libre{border:1px dashed #5B514A}
.vue span{color:#B4A69A}
.vue b{font:500 .95rem var(--serif)}
.vue.auj .cadre::after{background:#F7F2EB;color:#2B2420}
.vue .tag{position:absolute;left:6px;bottom:6px;font-size:.66rem;font-weight:600;padding:1px 7px;border-radius:99px;color:#fff;letter-spacing:.02em}
.planche a.vue:hover .cadre{outline-color:#F1E9DF}
.vue.suite .cadre{display:grid;place-items:center;text-align:center;font:italic .9rem var(--serif);color:#D8CABC}
.vue.suite:hover .cadre span{text-decoration:underline}
.planche-vide{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;width:100%;padding:10px 6px;color:#E8DCCF;font:italic 1.05rem var(--serif)}
.planche-vide .btn{border-color:#E8DCCF;color:#F1E9DF;font-style:normal}
/* En-tête éditorial du tableau de bord */
.hero{display:grid;grid-template-columns:1fr auto;gap:32px;align-items:center;margin-bottom:30px}
.hero h1{font-size:2.9rem}
.hero .resume{color:var(--doux);margin:10px 0 20px;max-width:46ch}
.hero .acces{margin:0}
.hero-photos{position:relative;width:330px;height:224px;flex:none}
.hero-photos img{position:absolute;object-fit:cover;border:6px solid var(--surface);box-shadow:0 10px 28px rgba(43,36,32,.18);border-radius:2px}
.hero-photos img:nth-child(1){width:124px;height:166px;left:0;top:36px;transform:rotate(-3deg)}
.hero-photos img:nth-child(2){width:140px;height:190px;left:96px;top:0;z-index:2}
.hero-photos img:nth-child(3){width:124px;height:166px;left:206px;top:42px;transform:rotate(2.5deg)}
@media(max-width:980px){.hero{grid-template-columns:1fr}.hero-photos{display:none}}
@media(max-width:620px){.hero h1{font-size:2.2rem}}
@media(prefers-color-scheme:dark){nav a[aria-current=page]{box-shadow:none}.logo .portrait{border-color:#3A332D}}
</style>
</head>

/* Écriture sécurisée dans le stockage du navigateur : chaque enregistrement est relu pour vérifier qu’il a bien été écrit.
   En cas d’échec (stockage plein, navigation privée…), une erreur est levée : les données restent affichées et un
   message général invite à télécharger une sauvegarde. Rien n’est jamais réinitialisé automatiquement. */
const CLE_META_MODIF = "atelier.meta.derniereModification", CLE_META_SAUVEGARDE = "atelier.meta.derniereSauvegarde";
const estQuota = e => !!e && (e.name === "QuotaExceededError" || e.name === "NS_ERROR_DOM_QUOTA_REACHED" || e.code === 22 || e.code === 1014);
let nuagePlanifier = () => {};  // remplacé par la synchronisation en ligne quand elle est active
const Disque = {
  plein: false,
  ecrire(cle, json) {
    try { localStorage.setItem(cle, json); }
    catch (e) {
      if (!(estQuota(e) && Journal.liberer())) { this.plein = estQuota(e); throw e; }
      try { localStorage.setItem(cle, json); } catch (e2) { this.plein = estQuota(e2); throw e2; }  // nouvel essai après avoir allégé le journal
    }
    if (localStorage.getItem(cle) !== json) throw new Error("verification");  // relecture
    this.plein = false;
    try { localStorage.setItem(CLE_META_MODIF, new Date().toISOString()); } catch (e) { /* sans gravité */ }
    nuagePlanifier();
  },
  lire(cle) { try { return localStorage.getItem(cle); } catch (e) { return null; } }
};

/* Journal des mouvements : trace horodatée de toutes les actions (création, modification, suppression, statut,
   automatisations, sauvegardes…). Stocké à part, résumé (jamais le contenu complet des notes), limité à 12 mois et
   5 000 entrées. Il passe toujours APRÈS les vraies données : en cas de manque de place, ce sont ses plus anciennes
   lignes qui sont effacées, jamais les contacts, événements, tâches ou rendez-vous. */
const CLE_JOURNAL = "atelier.journal.v1", JOURNAL_MAX = 5000, JOURNAL_MOIS = 12;
const Journal = {
  erreur: false,
  lire() {  // [] si vide, null si illisible (dans ce cas on ne l’écrase jamais)
    const t = Disque.lire(CLE_JOURNAL);
    if (!t) return [];
    try { const d = JSON.parse(t); if (!d || !Array.isArray(d.entrees)) return null; return d.entrees.filter(e => e && typeof e.t === "string" && typeof e.libelle === "string"); }
    catch (e) { return null; }
  },
  elaguer(l) {
    const lim = new Date(); lim.setMonth(lim.getMonth() - JOURNAL_MOIS);
    const iso = lim.toISOString();
    l = l.filter(e => e.t >= iso);
    return l.length > JOURNAL_MAX ? l.slice(l.length - JOURNAL_MAX) : l;
  },
  ecrire(l) {
    l = this.elaguer(l);
    for (let essai = 0; essai < 4; essai++) {
      try { localStorage.setItem(CLE_JOURNAL, JSON.stringify({ version: 1, entrees: l })); this.erreur = false; nuagePlanifier(); return true; }
      catch (e) { if (!estQuota(e) || l.length < 2) break; l = l.slice(Math.floor(l.length / 4)); }  // place manquante : on oublie les plus anciennes
    }
    this.erreur = true; return false;
  },
  noter(action, objet, libelle, o = {}) {
    try {
      const l = this.lire(); if (l === null) { this.erreur = true; return; }
      l.push({ id: nouvelId(), t: new Date().toISOString(), action, objet, ref: o.ref || "", libelle: String(libelle).slice(0, 200), details: String(o.details || "").slice(0, 400) });
      this.ecrire(l);
    } catch (e) { this.erreur = true; }  // le journal ne doit jamais bloquer l’application
  },
  liberer() {  // appelé quand les vraies données manquent de place
    const l = this.lire(); if (!l || l.length < 2) return false;
    try { localStorage.setItem(CLE_JOURNAL, JSON.stringify({ version: 1, entrees: l.slice(Math.floor(l.length / 2)) })); return true; } catch (e) { return false; }
  },
  fusionner(autres) {  // ajoute les entrées d’une sauvegarde sans doublon
    const l = this.lire(); if (l === null || !Array.isArray(autres)) return;
    const vus = new Set(l.map(e => e.id || e.t + e.libelle));
    autres.forEach(e => { const k = e.id || e.t + e.libelle; if (!vus.has(k)) { vus.add(k); l.push(e); } });
    l.sort((a, b) => a.t.localeCompare(b.t));
    this.ecrire(l);
  }
};

const Diff = {
  champs: {

    operation: { type: "type", titre: "titre", date: "date", commentaire: "commentaire" }
  },
  val(objet, k, v) {
    if (k === "acompteVerse") return v === true ? "oui" : "non";
    if (v === "" || v === null || v === undefined) return "—";

    if (k === "origine") return ORIGINES[v] || v;
    if (k === "statut") return objet === "tache" ? (v === "terminee" ? "Terminée" : "À faire") : (STATUTS[v] || {}).l || v;
    if (k === "contactId") { const c = Stockage.get(v); return c ? nomComplet(c) : "contact supprimé"; }
    if (k === "dossierId") { const d = StockageDossiers.get(v); return d ? d.titre : "événement supprimé"; }
    if (k === "acompteVerse") return v === true ? "oui" : "non";
    if (k === "montant" || k === "acompte") return typeof v === "number" ? euros(v) : String(v);
    if (k === "debut" || k === "fin") return fmtH(v);
    if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return dateSimple(v);

  texte(objet, avant, apres) {
    const libres = ["notes", "note", "commentaire"];
    return Object.entries(this.champs[objet]).filter(([k]) => k in apres && (avant[k] ?? "") !== (apres[k] ?? ""))
      .map(([k, lib]) => libres.includes(k) ? `${lib} modifié${lib === "notes" ? "es" : lib === "note" ? "e" : ""}` : `${lib} : ${this.val(objet, k, avant[k])} → ${this.val(objet, k, apres[k])}`).join(" ; ");
  }
};

/* Stockage : seule couche qui touche localStorage. Règle d’or : ne jamais écraser des données illisibles. */
const Stockage = {
  etat: "ok",              // "ok" | "indisponible" | "corrompu"
  ecritureEchouee: false,
  contacts: [],
  brut: null,              // contenu illisible conservé tel quel
  charger() {
    let brut;
    try { brut = localStorage.getItem(CLE_STOCKAGE); } catch (e) { this.etat = "indisponible"; return; }
    if (brut === null) return;  // premier lancement : liste vide, rien n’est écrit
    try {
      const d = JSON.parse(brut);
      if (!d || !Array.isArray(d.contacts) || !d.contacts.every(c => c && typeof c.id === "string" && typeof c.prenom === "string" && typeof c.nom === "string")) throw new Error("format");
      const defauts = { entreprise: "", email: "", telephone: "", adresse: "", codePostal: "", ville: "", type: "autre", origine: "", notes: "", creeLe: "" };
      this.contacts = d.contacts.map(c => ({ ...defauts, ...c }));
    } catch (e) { this.etat = "corrompu"; this.brut = brut; }
  },
  enregistrer() {
    if (this.etat !== "ok") return false;
    try { Disque.ecrire(CLE_STOCKAGE, JSON.stringify({ version: 1, contacts: this.contacts })); this.ecritureEchouee = false; return true; }
    catch (e) { this.ecritureEchouee = true; return false; }
  },
  get(id) { return this.contacts.find(c => c.id === id); },
  creer(d) { const c = { id: nouvelId(), ...d, creeLe: new Date().toISOString() }; this.contacts.push(c); return { c, ok: this.enregistrer() }; },
  creerPlusieurs(liste) {
    const t = new Date().toISOString(), ids = liste.map(d => { const c = { id: nouvelId(), ...d, creeLe: t }; this.contacts.push(c); return c.id; });
    return { ids, ok: this.enregistrer() };
  },
  modifier(id, d) { Object.assign(this.get(id), d, { modifieLe: new Date().toISOString() }); return this.enregistrer(); },
  supprimer(id) { this.contacts = this.contacts.filter(c => c.id !== id); return this.enregistrer(); },
  telechargerBrut() {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([this.brut], { type: "application/json" }));
    a.download = this.fichier || "contacts-sauvegarde.json"; a.click();
  },
  repartirDeZero() { // conserve une copie dans le navigateur avant de repartir
    try { localStorage.setItem(CLE_STOCKAGE + ".sauvegarde", this.brut); localStorage.removeItem(CLE_STOCKAGE); }
    catch (e) { return false; }
    this.etat = "ok"; this.brut = null; this.contacts = []; Journal.noter("donnees", "donnees", "Données illisibles remplacées : contacts", { details: "une copie a été conservée dans le navigateur" }); return true;
  }
};
Stockage.charger();

/* Retours à l’utilisateur */
let minuteurToast;
function toast(msg, ton) {
  const t = $("#toast"); t.textContent = msg; t.className = "show " + (ton || "");
  clearTimeout(minuteurToast); minuteurToast = setTimeout(() => t.className = "", 4500);
}
const retour = (ok, msgOk, msgKo) => toast(ok ? msgOk : msgKo, ok ? "" : "err");
const MSG_NON_SAUVE = " Attention : non enregistré dans ce navigateur.";
function confirmer(titre, texte, libelleOk) {
  const d = $("#dlg");
  if (typeof d.showModal !== "function") return Promise.resolve(window.confirm(titre + "\n\n" + texte.replace(/<[^>]+>/g, "")));
  d.innerHTML = `<form method="dialog"><h2 id="dlg-titre">${titre}</h2><div class="dlg-t">${texte}</div><div class="actions"><button class="btn sec" value="non" autofocus>Annuler</button><button class="btn danger" value="oui">${libelleOk}</button></div></form>`;
  return new Promise(res => { d.addEventListener("close", () => res(d.returnValue === "oui"), { once: true }); d.returnValue = "non"; d.showModal(); });
}

const Filtres = { q: "", type: "", tri: "nom-asc" };  // conservés pendant la session

const Contacts = {
  route(a, b) {
    if (!a) return this.liste();
    if (a === "nouveau") return Stockage.etat === "corrompu" ? this.liste() : this.form(null, b === "evenement");
    if (a === "import") return ImportC.page();
    const c = Stockage.get(a);
    if (!c) return null;
    return b === "modifier" ? this.form(c) : this.fiche(c);
  },
  bandeau() {
    if (Stockage.etat === "corrompu") return `<div class="bandeau r" role="alert"><b>Les données des contacts sont illisibles.</b> Elles n’ont pas été supprimées ni modifiées, mais l’ajout et la modification sont suspendus pour les protéger. Téléchargez une copie avant toute action.<div class="actions"><button class="btn sec" data-action="telecharger-brut">Télécharger une copie</button><button class="btn danger sec" data-action="reinitialiser">Repartir de zéro</button></div></div>`;
    return "";
  },
  /* --- Liste --- */
  filtrer() {
    const mots = norm(Filtres.q).split(/\s+/).filter(Boolean);
    const cmp = (a, b) => a.nom.localeCompare(b.nom, "fr", { sensitivity: "base" }) || a.prenom.localeCompare(b.prenom, "fr", { sensitivity: "base" });
    const tri = { "nom-asc": cmp, "nom-desc": (a, b) => cmp(b, a), recent: (a, b) => b.creeLe.localeCompare(a.creeLe), ancien: (a, b) => a.creeLe.localeCompare(b.creeLe) }[Filtres.tri] || cmp;
    return Stockage.contacts.filter(c => {
      if (Filtres.type && c.type !== Filtres.type) return false;
      const foin = norm([c.prenom, c.nom, c.entreprise, c.email, c.telephone, (c.telephone || "").replace(/\D/g, ""), c.ville, c.codePostal].join(" "));
      return mots.every(m => foin.includes(m));
    }).sort(tri);
  },
  compteur() {
    const n = Stockage.contacts.length, k = this.filtrer().length;
    return `${n} contact${n > 1 ? "s" : ""}` + (k !== n ? ` · ${k} affiché${k > 1 ? "s" : ""}` : "");
  },
  zone() {
    if (!Stockage.contacts.length) return Stockage.etat === "corrompu" ? "" : `<div class="card etat-vide"><h2>Aucun contact pour l’instant</h2><p>Ajoutez vos contacts (clients, partenaires…) pour retrouver leurs coordonnées, leurs événements et leur historique en un clic.</p><div class="actions" style="justify-content:center"><a class="btn" href="#contacts/nouveau">Créer le premier contact</a><a class="btn sec" href="#contacts/import" data-action="import-reset">Importer depuis Excel</a></div></div>`;

    return `<div class="card contacts"><ul class="liste">${l.map(c => `

        <span class="fin"><span class="puce l">${TYPES[c.type] || "Autre"}</span><small>Ajouté le ${dateFr(c.creeLe)}</small></span></a></li>`).join("")}</ul></div>`;

  majListe() { const z = $("#zone-liste"); if (z) { z.innerHTML = this.zone(); $("#compteur").textContent = this.compteur(); } },

      ${this.bandeau()}
      ${Stockage.contacts.length ? `<div class="outils">
        <input class="recherche" type="search" data-filtre="q" value="${echapper(Filtres.q)}" placeholder="Rechercher par nom, entreprise, email, téléphone ou ville" aria-label="Rechercher un contact">

      <div id="zone-liste">${this.zone()}</div></div>`;
  },

      ${Taches.section(StockageTaches.deContact(c.id), "#taches/nouveau/contact/" + c.id, { sansContact: true })}

  },
  /* --- Formulaire (création et modification) --- */
  form(c, avecEvenement) {
    const ret = !c && RetourEvenement;  // création lancée depuis le formulaire d’un événement
    const v = c || { type: "particulier", origine: "", ...(ret ? ret.prefill : {}) };
    const retourUrl = c ? "#contacts/" + c.id : ret ? ret.hash : App.precedent === "#accueil" ? "#accueil" : "#contacts";
    const coche = !c && !ret && StockageDossiers.etat !== "corrompu";
    const champ = (id, label, o = {}) => `<div class="champ"><label for="f-${id}">${label}${o.requis ? ' <span class="req" aria-hidden="true">*</span>' : ""}</label>

    const sel = (id, label, o, vide) => `<div class="champ"><label for="f-${id}">${label}</label><select id="f-${id}" name="${id}">${vide ? `<option value="">${vide}</option>` : ""}${Object.entries(o).map(([k, t]) => `<option value="${k}"${k === v[id] ? " selected" : ""}>${t}</option>`).join("")}</select></div>`;
    return `<div class="page narrow">
      <a class="retour" href="${retourUrl}">Annuler</a>
      <div class="entete"><h1>${c ? "Modifier le contact" : "Nouveau contact"}</h1></div>
      ${this.bandeau()}
      ${ret ? `<div class="bandeau">Ce contact sera associé à l’événement en cours de saisie. Après l’enregistrement, vous reviendrez au formulaire de l’événement.</div>` : ""}
      <form class="card form" novalidate data-form="contact" data-id="${c ? c.id : ""}">
        <div class="duo">${champ("prenom", "Prénom", { requis: true, auto: "off" })}${champ("nom", "Nom", { requis: true })}</div>
        ${champ("entreprise", "Entreprise (si applicable)")}
        <div class="duo">${champ("email", "Adresse email", { type: "email" })}${champ("telephone", "Téléphone", { type: "tel" })}</div>
        ${champ("adresse", "Adresse postale", { auto: "street-address" })}

        <p class="vide"><span class="req">*</span> Champs obligatoires. Tous les autres sont facultatifs.</p>
        <div class="actions"><button class="btn" type="submit">Enregistrer</button><a class="btn sec" href="${retourUrl}">Annuler</a></div></form></div>`;
  },
  erreur(champ, msg) {
    const e = $("#e-" + champ), i = $("#f-" + champ);
    if (e) e.textContent = msg || ""; if (i) msg ? i.setAttribute("aria-invalid", "true") : i.removeAttribute("aria-invalid");
  },
  enregistrer(f) {
    const d = {}; new FormData(f).forEach((val, k) => d[k] = String(val).trim());
    const err = {};
    if (!d.prenom) err.prenom = "Indiquez le prénom.";
    if (!d.nom) err.nom = "Indiquez le nom.";
    if (d.email && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(d.email)) err.email = "Cette adresse semble incomplète (exemple : prenom@exemple.fr).";
    if (d.telephone && (!/^[+\d\s().-]+$/.test(d.telephone) || d.telephone.replace(/\D/g, "").length < 6)) err.telephone = "Saisissez un numéro valide (chiffres, espaces, + . -).";
    if (d.codePostal && !/^[A-Za-z0-9 -]{2,10}$/.test(d.codePostal)) err.codePostal = "Code postal invalide (exemple : 51100).";
    ["prenom", "nom", "email", "telephone", "codePostal"].forEach(k => this.erreur(k, err[k]));
    const premier = Object.keys(err)[0];
    if (premier) { $("#f-" + premier).focus(); return; }
    const data = { prenom: d.prenom, nom: d.nom, entreprise: d.entreprise, email: d.email, telephone: d.telephone, adresse: d.adresse, codePostal: d.codePostal.toUpperCase(), ville: d.ville, type: TYPES[d.type] ? d.type : "autre", origine: ORIGINES[d.origine] ? d.origine : "", notes: d.notes };
    const id = f.dataset.id;
    if (id) {
      const av = { ...Stockage.get(id) }, ok = Stockage.modifier(id, data), dif = Diff.texte("contact", av, data);
      if (dif) Journal.noter("modification", "contact", `Contact modifié : ${nomComplet(Stockage.get(id))}`, { ref: id, details: dif });
      retour(ok, "Contact modifié.", "Contact modifié." + MSG_NON_SAUVE); location.hash = "#contacts/" + id;
    }
    else {
      if (f.dataset.enCours) return;  // évite un double enregistrement (double clic)
      f.dataset.enCours = "1";
      const r = Stockage.creer(data), ret = RetourEvenement;  // le contact est enregistré AVANT tout événement
      Journal.noter("creation", "contact", `Contact créé : ${nomComplet(r.c)}`, { ref: r.c.id, details: [TYPES[r.c.type], r.c.email, r.c.telephone].filter(Boolean).join(" · ") });
      if (ret) {
        RetourEvenement = null;
        if (Brouillon) Brouillon.valeurs.contactId = r.c.id; else Brouillon = { pour: "nouveau", valeurs: { contactId: r.c.id } };
        retour(r.ok, "Contact créé et associé à l’événement.", "Contact créé." + MSG_NON_SAUVE);
        location.hash = ret.hash;
      } else if (d.creerEvenement && StockageDossiers.etat !== "corrompu") {
        retour(r.ok, "Contact créé. Complétez maintenant l’événement.", "Contact créé." + MSG_NON_SAUVE);
        location.hash = "#dossiers/nouveau/" + r.c.id;
      } else { retour(r.ok, "Contact créé.", "Contact créé." + MSG_NON_SAUVE); location.hash = "#contacts/" + r.c.id; }
    }
  },
  async supprimer(id) {
    const c = Stockage.get(id); if (!c) return;
    if (StockageDossiers.etat === "corrompu") { toast("Suppression impossible : les données des événements sont illisibles, il est donc impossible de savoir quels événements sont liés à ce contact.", "err"); return; }
    const lies = StockageDossiers.deContact(id), n = lies.length, dids = lies.map(d => d.id);
    const nt = StockageTaches.liees(id, dids).length, nr = StockageRdv.liees(id, dids).length;
    const texteT = (nt ? `<p style="margin-top:10px">${nt > 1 ? `Ses ${nt} tâches sont conservées` : "Sa tâche est conservée"}, mais ne ${nt > 1 ? "seront" : "sera"} plus associée${nt > 1 ? "s" : ""} à ce contact.</p>` : "")
      + (nr ? `<p style="margin-top:10px">${nr > 1 ? `Ses ${nr} rendez-vous sont conservés` : "Son rendez-vous est conservé"} dans le calendrier, sans contact ni événement associé.</p>` : "");
    const texte = (n
      ? `<b>${echapper(nomComplet(c))}</b> possède <b>${n} événement${n > 1 ? "s" : ""}</b> :<ul>${lies.map(d => `<li>${echapper(d.titre)}</li>`).join("")}</ul>Si vous continuez, ${n > 1 ? "ces événements seront supprimés" : "cet événement sera supprimé"} avec le contact, ainsi que leur historique. Cette action est irréversible.`
      : `<b>${echapper(nomComplet(c))}</b> sera définitivement supprimé. Cette action est irréversible.`) + texteT;
    if (!await confirmer("Supprimer ce contact ?", texte, n ? `Supprimer le contact et ${n > 1 ? "ses " + n + " événements" : "son événement"}` : "Supprimer")) return;
    let ok = n ? StockageDossiers.supprimerDeContact(id) : true;
    ok = Stockage.supprimer(id) && ok;
    ok = StockageTaches.detacherContact(id, dids) && ok;  // tâches conservées, associations retirées
    ok = StockageRdv.detacherContact(id, dids) && ok;     // rendez-vous conservés, associations retirées
    Journal.noter("suppression", "contact", `Contact supprimé : ${nomComplet(c)}`, { details: [n ? `${n} événement${n > 1 ? "s" : ""} supprimé${n > 1 ? "s" : ""} : ${lies.map(d => d.titre).join(", ")}` : "",
      nt ? `${nt} tâche${nt > 1 ? "s" : ""} conservée${nt > 1 ? "s" : ""} sans lien` : "", nr ? `${nr} rendez-vous conservé${nr > 1 ? "s" : ""} sans lien` : ""].filter(Boolean).join(" ; ") });
    retour(ok, n ? "Contact et événements supprimés." : "Contact supprimé.", "Suppression effectuée." + MSG_NON_SAUVE);
    location.hash = "#contacts";
  },
  async reinitialiser() {
    if (!await confirmer("Repartir de zéro ?", "Une copie des données illisibles sera conservée dans le navigateur avant de les remplacer. Pensez à la télécharger d’abord.", "Repartir de zéro")) return;
    retour(Stockage.repartirDeZero(), "Liste de contacts réinitialisée.", "Impossible de conserver une copie : rien n’a été supprimé.");
    if (location.hash !== "#contacts") location.hash = "#contacts"; else App.afficher();
  }
};

/* ---------- 2c. Événements (appelés « dossiers » dans le code et le stockage, pour rester compatibles
   avec les données déjà enregistrées) : stockage, vues, logique ---------- */
const CLE_DOSSIERS = "atelier.dossiers.v1";
const VERSION_DOSSIERS = 2;  // v2 : ajout de l’historique d’opérations (tableau « operations » dans chaque événement)
const PRESTATIONS = { mariage: "Mariage", grossesse: "Grossesse", naissance: "Naissance", famille: "Famille", portrait: "Portrait", evenement: "Événementiel", entreprise: "Entreprise", autre: "Autre" };
/* Statuts, dans l’ordre du cycle de vie. g = famille de couleur (a ardoise, b laiton, c sauge, d encre, e rose) */
const STATUTS = {
  nouvelle: { l: "Nouvelle demande", g: "a" }, contact: { l: "Premier contact effectué", g: "a" }, "devis-prep": { l: "Devis à préparer", g: "a" },
  "devis-envoye": { l: "Devis envoyé", g: "b" }, attente: { l: "En attente de réponse", g: "b" },
  confirmee: { l: "Réservation confirmée", g: "c" }, realisee: { l: "Prestation réalisée", g: "c" }, livraison: { l: "Livraison en cours", g: "c" },
  termine: { l: "Terminé", g: "d" }, annule: { l: "Annulé", g: "e" }
};
const euros = n => n.toLocaleString("fr-FR", { style: "currency", currency: "EUR", minimumFractionDigits: Number.isInteger(n) ? 0 : 2 });
const dateSimple = iso => iso ? new Date(iso + "T12:00:00").toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" }) : "";
/* Reste à charge = montant estimé − acompte (seulement s’il est versé). null si aucun montant n’est renseigné. */
const resteACharge = d => typeof d.montant !== "number" ? null
  : Math.max(0, Math.round((d.montant - (d.acompteVerse && typeof d.acompte === "number" ? d.acompte : 0)) * 100) / 100);
const puceStatut = k => { const x = STATUTS[k] || { l: k, g: "a" }; return `<span class="puce s${x.g}">${echapper(x.l)}</span>`; };
/* "1 200,50" → 1200.5 ; vide → null (jamais 0 par défaut) ; invalide → NaN */
const saisieMontant = n => typeof n !== "number" ? "" : (Number.isInteger(n) ? String(n) : n.toFixed(2)).replace(".", ",");
const parseMontant = t => { if (!t) return null; const n = t.replace(/[\s\u00a0€]/g, "").replace(",", "."); return /^\d+(\.\d{1,2})?$/.test(n) ? Number(n) : NaN; };

/* Stockage des événements : même principe que les contacts (jamais d’écrasement de données illisibles).
   Les événements référencent leur contact par contactId uniquement.
   Migration v1 → v2 : les anciens événements reçoivent simplement un historique vide ; identifiants et champs
   existants sont conservés. Une copie des données d’origine est gardée une fois dans « atelier.dossiers.v1.avant-v2 ». */
const StockageDossiers = {
  etat: "ok", ecritureEchouee: false, dossiers: [], brut: null, fichier: "evenements-sauvegarde.json",
  charger() {
    let brut;
    try { brut = localStorage.getItem(CLE_DOSSIERS); } catch (e) { this.etat = "indisponible"; return; }
    if (brut === null) return;
    try {
      const d = JSON.parse(brut);
      const opOk = o => o && typeof o.id === "string" && typeof o.titre === "string";
      if (!d || !Array.isArray(d.dossiers) || !d.dossiers.every(x => x && typeof x.id === "string" && typeof x.titre === "string" && typeof x.contactId === "string"
        && (x.operations === undefined || (Array.isArray(x.operations) && x.operations.every(opOk))))) throw new Error("format");
      const defauts = { type: "autre", statut: "nouvelle", datePrestation: "", notes: "", creeLe: "", modifieLe: "" };
      const defautsOp = { type: "autre", date: "", commentaire: "", creeLe: "" };
      this.dossiers = d.dossiers.map(x => ({ ...defauts, ...x, montant: typeof x.montant === "number" ? x.montant : null,
        acompte: typeof x.acompte === "number" ? x.acompte : null, acompteVerse: x.acompteVerse === true, operations: (x.operations || []).map(o => ({ ...defautsOp, ...o })) }));
      if (d.version !== VERSION_DOSSIERS) {  // anciennes données : copie de sécurité avant leur première réécriture
        try { if (localStorage.getItem(CLE_DOSSIERS + ".avant-v2") === null) localStorage.setItem(CLE_DOSSIERS + ".avant-v2", brut); } catch (e) { /* sans gravité */ }
      }
    } catch (e) { this.etat = "corrompu"; this.brut = brut; }
  },
  enregistrer() {
    if (this.etat !== "ok") return false;
    try { Disque.ecrire(CLE_DOSSIERS, JSON.stringify({ version: VERSION_DOSSIERS, dossiers: this.dossiers })); this.ecritureEchouee = false; return true; }
    catch (e) { this.ecritureEchouee = true; return false; }
  },
  get(id) { return this.dossiers.find(d => d.id === id); },
  deContact(cid) { return this.dossiers.filter(d => d.contactId === cid); },
  creer(data) { const t = new Date().toISOString(), d = { id: nouvelId(), operations: [], ...data, creeLe: t, modifieLe: t }; this.dossiers.push(d); return { d, ok: this.enregistrer() }; },
  creerPlusieurs(liste) {
    const t = new Date().toISOString(), ids = liste.map(data => { const d = { id: nouvelId(), operations: [], ...data, creeLe: t, modifieLe: t }; this.dossiers.push(d); return d.id; });
    return { ids, ok: this.enregistrer() };
  },
  modifier(id, data) { Object.assign(this.get(id), data, { modifieLe: new Date().toISOString() }); return this.enregistrer(); },
  supprimer(id) { this.dossiers = this.dossiers.filter(d => d.id !== id); return this.enregistrer(); },
  /* Opérations (historique) d’un événement */
  getOp(did, oid) { const d = this.get(did); return d ? d.operations.find(o => o.id === oid) : undefined; },
  ajouterOp(did, data) { this.get(did).operations.push({ id: nouvelId(), ...data, creeLe: new Date().toISOString() }); return this.enregistrer(); },
  modifierOp(did, oid, data) { Object.assign(this.getOp(did, oid), data, { modifieLe: new Date().toISOString() }); return this.enregistrer(); },
  supprimerOp(did, oid) { const d = this.get(did); d.operations = d.operations.filter(o => o.id !== oid); return this.enregistrer(); },
  supprimerDeContact(cid) { this.dossiers = this.dossiers.filter(d => d.contactId !== cid); return this.enregistrer(); },
  telechargerBrut: Stockage.telechargerBrut,
  repartirDeZero() {
    try { localStorage.setItem(CLE_DOSSIERS + ".sauvegarde", this.brut); localStorage.removeItem(CLE_DOSSIERS); } catch (e) { return false; }
    this.etat = "ok"; this.brut = null; this.dossiers = []; Journal.noter("donnees", "donnees", "Données illisibles remplacées : événements", { details: "une copie a été conservée dans le navigateur" }); return true;
  }
};
StockageDossiers.charger();

const FiltresD = { q: "", statut: "", type: "", tri: "recent" };

const Dossiers = {
  route(a, b) {
    if (!a) return this.liste();
    if (a === "nouveau") return StockageDossiers.etat === "corrompu" ? this.liste() : this.form(null, b);
    if (a === "import") return ImportE.page();
    const d = StockageDossiers.get(a);
    if (!d) return null;
    return b === "modifier" ? this.form(d) : this.fiche(d);
  },
  bandeau() {
    const S = StockageDossiers;
    if (S.etat === "corrompu") return `<div class="bandeau r" role="alert"><b>Les données des événements sont illisibles.</b> Elles n’ont pas été supprimées ni modifiées, mais la création, la modification et la suppression d’événements (et de contacts) sont suspendues pour les protéger. Téléchargez une copie avant toute action.<div class="actions"><button class="btn sec" data-action="telecharger-brut-d">Télécharger une copie</button><button class="btn danger sec" data-action="reinitialiser-d">Repartir de zéro</button></div></div>`;
    return "";
  },
  client(d) { const c = Stockage.get(d.contactId); return c ? nomComplet(c) : "Contact introuvable"; },
  /* --- Liste --- */
  filtrer() {
    const mots = norm(FiltresD.q).split(/\s+/).filter(Boolean);
    const cle = d => { const c = Stockage.get(d.contactId); return c ? norm(c.nom + " " + c.prenom) : "\uffff"; };
    const presta = sens => (a, b) => !a.datePrestation && !b.datePrestation ? 0 : !a.datePrestation ? 1 : !b.datePrestation ? -1 : sens * a.datePrestation.localeCompare(b.datePrestation);
    const tri = { recent: (a, b) => b.creeLe.localeCompare(a.creeLe), ancien: (a, b) => a.creeLe.localeCompare(b.creeLe), proche: presta(1), lointaine: presta(-1), client: (a, b) => cle(a).localeCompare(cle(b)) }[FiltresD.tri] || (() => 0);
    return StockageDossiers.dossiers.filter(d => {
      if (FiltresD.statut && d.statut !== FiltresD.statut) return false;
      if (FiltresD.type && d.type !== FiltresD.type) return false;
      const c = Stockage.get(d.contactId), foin = norm([d.titre, c ? [c.prenom, c.nom, c.entreprise, c.email].join(" ") : ""].join(" "));
      return mots.every(m => foin.includes(m));
    }).sort(tri);
  },
  compteur() {
    const n = StockageDossiers.dossiers.length, k = this.filtrer().length;
    return `${n} événement${n > 1 ? "s" : ""}` + (k !== n ? ` · ${k} affiché${k > 1 ? "s" : ""}` : "");
  },
  zone() {
    if (!StockageDossiers.dossiers.length) return StockageDossiers.etat === "corrompu" ? "" : `<div class="card etat-vide"><h2>Aucun événement pour l’instant</h2><p>Un événement regroupe une prestation : demande, statut, date, montant, notes et historique des échanges. Il est toujours rattaché à un contact.</p><div class="actions" style="justify-content:center"><a class="btn" href="#dossiers/nouveau">Créer le premier événement</a><a class="btn sec" href="#dossiers/import" data-action="import-ev-reset">Importer depuis Excel</a></div></div>`;
    const l = this.filtrer();
    if (!l.length) return `<div class="card etat-vide"><h2>Aucun résultat</h2><p>Aucun événement ne correspond à cette recherche ou à ces filtres. Vérifiez l’orthographe ou élargissez les critères.</p><button class="btn sec" data-action="effacer-filtres-d">Effacer la recherche et les filtres</button></div>`;
    return `<div class="card contacts"><ul class="liste">${l.map(d => `
      <li class="dos"><a class="ligne" href="#dossiers/${d.id}"><div class="infos"><b>${echapper(d.titre)}</b><small>${PRESTATIONS[d.type] || "Autre"} · ${d.datePrestation ? "Prestation le " + dateSimple(d.datePrestation) : "Date non fixée"}</small></div></a>
        ${Stockage.get(d.contactId) ? `<a class="client" href="#contacts/${d.contactId}">${echapper(this.client(d))}</a>` : `<span class="client">${this.client(d)}</span>`}
        ${puceStatut(d.statut)}<span class="mt">${d.montant === null ? "—" : euros(d.montant)}${d.acompteVerse && d.montant !== null ? `<small>reste ${euros(resteACharge(d))}</small>` : ""}</span></li>`).join("")}</ul></div>`;
  },
  majListe() { const z = $("#zone-dossiers"); if (z) { z.innerHTML = this.zone(); $("#compteur-d").textContent = this.compteur(); } },
  liste() {
    const opt = (o, sel) => Object.entries(o).map(([k, v]) => `<option value="${k}"${k === sel ? " selected" : ""}>${v}</option>`).join("");
    const statuts = Object.fromEntries(Object.entries(STATUTS).map(([k, v]) => [k, v.l]));
    return `<div class="page">
      <div class="entete"><div><h1>Événements</h1><p id="compteur-d">${this.compteur()}</p></div>
        <div class="actions"><a class="btn sec" href="#dossiers/import" data-action="import-ev-reset"${StockageDossiers.etat === "corrompu" ? ' aria-disabled="true" tabindex="-1"' : ""}>Importer</a><a class="btn" href="#dossiers/nouveau"${StockageDossiers.etat === "corrompu" ? ' aria-disabled="true" tabindex="-1"' : ""}>Nouvel événement</a></div></div>
      ${this.bandeau()}
      ${StockageDossiers.dossiers.length ? `<div class="outils">
        <input class="recherche" type="search" data-fd="q" value="${echapper(FiltresD.q)}" placeholder="Rechercher par titre, contact, entreprise ou email" aria-label="Rechercher un événement">
        <select data-fd="statut" aria-label="Filtrer par statut"><option value="">Tous les statuts</option>${opt(statuts, FiltresD.statut)}</select>
        <select data-fd="type" aria-label="Filtrer par type de prestation"><option value="">Toutes les prestations</option>${opt(PRESTATIONS, FiltresD.type)}</select>
        <select data-fd="tri" aria-label="Trier les événements">${opt({ recent: "Création : plus récents", ancien: "Création : plus anciens", proche: "Prestation : la plus proche", lointaine: "Prestation : la plus lointaine", client: "Contact : de A à Z" }, FiltresD.tri)}</select></div>` : ""}
      <div id="zone-dossiers">${this.zone()}</div></div>`;
  },
  /* --- Fiche événement (avec son historique d’opérations) --- */
  fiche(d) {
    const c = Stockage.get(d.contactId), bloque = StockageDossiers.etat === "corrompu" ? " disabled" : "";
    const ed = (champ, o = {}) => `data-edit="${champ}" data-id="${d.id}" aria-describedby="ee-${champ}"${bloque}`;
    const err = champ => `<span class="err" id="ee-${champ}"></span>`;
    return `<div class="page">
      <a class="retour" href="#dossiers">Retour aux événements</a>
      <div class="entete"><div class="titre-edit-zone"><h1 class="sr-only" id="fiche-titre">${echapper(d.titre)}</h1><input class="titre-edit" value="${echapper(d.titre)}" aria-label="Titre de l’événement" autocomplete="off" ${ed("titre")}>${err("titre")}<p id="fiche-presta">${PRESTATIONS[d.type] || "Autre"}</p></div>
        <div class="actions"><button class="btn danger sec" data-action="supprimer-dossier" data-id="${d.id}">Supprimer</button></div></div>
      ${this.bandeau()}
      <p class="aide auto-save">Cliquez sur une information pour la modifier : elle est enregistrée dès que vous quittez le champ (ou appuyez sur Entrée). Échap annule la saisie en cours.</p>
      <section class="card"><h2>Statut</h2><div class="statut-ligne">${puceStatut(d.statut)}
        <label for="chg-statut" class="vide">Changer le statut</label>
        <select id="chg-statut" data-statut="${d.id}"${bloque}>${Object.entries(STATUTS).map(([k, x]) => `<option value="${k}"${k === d.statut ? " selected" : ""}>${x.l}</option>`).join("")}</select></div></section>
      <div class="grille" style="grid-template-columns:repeat(auto-fit,minmax(290px,1fr));margin-top:18px">
        <section class="card"><h2>Contact associé</h2>${c ? `<p><a href="#contacts/${c.id}"><b>${echapper(nomComplet(c))}</b></a></p><p class="vide">${echapper([c.entreprise, c.email, c.telephone].filter(Boolean).join(" · "))}</p><p style="margin-top:10px"><a href="#contacts/${c.id}">Ouvrir la fiche du contact</a></p>` : '<p class="vide">Le contact associé est introuvable. Rattachez l’événement à un contact existant.</p>'}
          ${bloque ? "" : `<p style="margin-top:10px"><a href="#dossiers/${d.id}/modifier" class="vide">Changer de contact</a></p>`}</section>
        <section class="card"><h2>Détails</h2><dl class="def def-edit">
          <dt><label for="ed-type">Prestation</label></dt><dd><select id="ed-type" ${ed("type")}>${Object.entries(PRESTATIONS).map(([k, t]) => `<option value="${k}"${k === d.type ? " selected" : ""}>${echapper(t)}</option>`).join("")}</select>${err("type")}</dd>
          <dt><label for="ed-datePrestation">Date de prestation</label></dt><dd><input id="ed-datePrestation" type="date" value="${echapper(d.datePrestation || "")}" ${ed("datePrestation")}>${err("datePrestation")}</dd>
          <dt><label for="ed-montant">Montant estimé</label></dt><dd><span class="champ-euro"><input id="ed-montant" inputmode="decimal" autocomplete="off" placeholder="Non renseigné" value="${saisieMontant(d.montant)}" ${ed("montant")}><span aria-hidden="true">€</span></span>${err("montant")}</dd>
          <dt><label for="ed-acompte">Acompte</label></dt><dd><span class="champ-euro"><input id="ed-acompte" inputmode="decimal" autocomplete="off" placeholder="Non renseigné" value="${saisieMontant(d.acompte)}" ${ed("acompte")}><span aria-hidden="true">€</span></span>
            <label class="coche coche-acompte"><input type="checkbox" data-acompte="${d.id}"${d.acompteVerse ? " checked" : ""}${bloque}> Versé</label>${err("acompte")}</dd>
          <dt>Reste à charge</dt><dd id="fiche-reste">${this.resteFiche(d)}</dd>
          <dt>Créé le</dt><dd>${dateFr(d.creeLe)}</dd><dt>Modifié le</dt><dd id="fiche-modifie">${dateFr(d.modifieLe)}</dd></dl></section></div>
      <section class="card" style="margin-top:18px"><h2><label for="ed-notes">Notes</label></h2><textarea id="ed-notes" class="notes-edit" placeholder="Aucune note. Cliquez ici pour en écrire une." ${ed("notes")}>${echapper(d.notes || "")}</textarea>${err("notes")}</section>
      ${Taches.section(StockageTaches.deEvenement(d.id), "#taches/nouveau/evenement/" + d.id, { sansContact: true, sansEvenement: true })}
      ${Operations.sectionEvenement(d)}</div>`;
  },
  resteFiche(d) { const r = resteACharge(d); return r === null ? '<span class="vide">Non renseigné</span>' : `<b class="reste">${euros(r)}</b>${d.acompteVerse ? "" : ' <span class="vide">(acompte non versé)</span>'}`; },
  /* Met à jour les zones calculées de la fiche sans la redessiner (le curseur reste où il est) */
  majFiche(d) {
    const z = (id, h) => { const el = $("#" + id); if (el) el.innerHTML = h; };
    z("fiche-reste", this.resteFiche(d)); z("fiche-modifie", dateFr(d.modifieLe)); z("fiche-presta", PRESTATIONS[d.type] || "Autre"); z("fiche-titre", echapper(d.titre));
    const m = $("#ed-montant"), a = $("#ed-acompte"), k = $(`[data-acompte="${d.id}"]`);
    if (m && document.activeElement !== m) m.value = saisieMontant(d.montant);
    if (a && document.activeElement !== a) a.value = saisieMontant(d.acompte);
    if (k) k.checked = d.acompteVerse === true;
  },
  /* Enregistrement d’un seul champ modifié directement sur la fiche */
  enregistrerChamp(el) {
    const champ = el.dataset.edit, d = StockageDossiers.get(el.dataset.id);
    if (!d || StockageDossiers.etat === "corrompu") return;
    const brut = el.value.trim(), msg = t => { const e = $("#ee-" + champ); if (e) e.textContent = t || ""; el.setAttribute("aria-invalid", t ? "true" : "false"); };
    let val, erreur = "";
    if (champ === "titre") { val = brut; if (!val) erreur = "Le titre ne peut pas être vide."; }
    else if (champ === "type") val = PRESTATIONS[brut] ? brut : "autre";
    else if (champ === "datePrestation") { val = brut; if (val && (!/^\d{4}-\d{2}-\d{2}$/.test(val) || isNaN(new Date(val + "T12:00:00")))) erreur = "Saisissez une date valide."; }
    else if (champ === "montant") {
      val = parseMontant(brut);
      if (Number.isNaN(val)) erreur = "Saisissez un montant en euros (exemple : 450 ou 1 200,50).";
      else if (val !== null && typeof d.acompte === "number" && d.acompte > val) erreur = `Le montant ne peut pas être inférieur à l’acompte (${euros(d.acompte)}).`;
    }
    else if (champ === "acompte") {
      val = parseMontant(brut);
      if (Number.isNaN(val)) erreur = "Saisissez un montant en euros (exemple : 300 ou 150,50).";
      else if (val === null && d.acompteVerse) erreur = "L’acompte est coché « versé » : décochez d’abord la case pour effacer son montant.";
      else if (val !== null && typeof d.montant === "number" && val > d.montant) erreur = "L’acompte ne peut pas dépasser le montant estimé.";
    }
    else if (champ === "notes") val = el.value.replace(/\s+$/, "");
    else return;
    msg(erreur);
    if (erreur) return;
    if ((d[champ] ?? (champ === "montant" || champ === "acompte" ? null : "")) === val) { if (champ === "montant" || champ === "acompte") el.value = saisieMontant(val); return; }
    const av = { ...d }, ok = StockageDossiers.modifier(d.id, { [champ]: val }), dif = Diff.texte("evenement", av, d);
    if (dif) Journal.noter("modification", "evenement", `Événement modifié : ${d.titre}`, { ref: d.id, details: dif });
    if (champ === "montant" || champ === "acompte") el.value = saisieMontant(val);
    this.majFiche(d);
    retour(ok, "Modification enregistrée.", "Modification enregistrée." + MSG_NON_SAUVE);
  },
  /* Échap : revenir à la valeur enregistrée */
  annulerChamp(el) {
    const d = StockageDossiers.get(el.dataset.id); if (!d) return;
    const c = el.dataset.edit;
    el.value = c === "montant" || c === "acompte" ? saisieMontant(d[c]) : (d[c] || "");
    const e = $("#ee-" + c); if (e) e.textContent = ""; el.removeAttribute("aria-invalid");
  },
  /* --- Section « Événements » de la fiche contact --- */
  sectionContact(c) {
    const l = StockageDossiers.deContact(c.id), lien = `#dossiers/nouveau/${c.id}`;
    const bloque = StockageDossiers.etat === "corrompu";
    return `<section class="card" style="margin-top:18px"><div class="sec-tete"><h2>Événements${l.length ? " (" + l.length + ")" : ""}</h2>
      <a class="btn sec" href="${lien}"${bloque ? ' aria-disabled="true" tabindex="-1"' : ""}>Nouvel événement</a></div>
      ${this.bandeau()}
      ${l.length ? `<ul class="liste">${l.sort((a, b) => b.creeLe.localeCompare(a.creeLe)).map(d => `
        <li class="dos"><a class="ligne" href="#dossiers/${d.id}"><div class="infos"><b>${echapper(d.titre)}</b><small>${PRESTATIONS[d.type] || "Autre"}${d.datePrestation ? " · Prestation le " + dateSimple(d.datePrestation) : ""}${d.operations.length ? " · " + d.operations.length + " opération" + (d.operations.length > 1 ? "s" : "") : ""}</small></div></a>${puceStatut(d.statut)}</li>`).join("")}</ul>`
        : (bloque ? "" : `<p class="vide">Aucun événement pour ce contact. Créez-en un pour suivre une prestation, du premier échange à la livraison.</p>`)}</section>`;
  },
  /* --- Formulaire --- */
  form(d, prefill) {
    if (!Stockage.contacts.length) return `<div class="page narrow"><a class="retour" href="#dossiers">Retour aux événements</a><div class="entete"><h1>Nouvel événement</h1></div><div class="card etat-vide"><h2>Aucun contact disponible</h2><p>Un événement doit toujours être rattaché à un contact. Créez d’abord le contact concerné : le formulaire de l’événement s’ouvrira ensuite automatiquement.</p><a class="btn" href="#contacts/nouveau/evenement">Créer un contact</a></div></div>`;
    const base = d ? { ...d, montant: saisieMontant(d.montant), acompte: saisieMontant(d.acompte) }
      : { titre: "", contactId: Stockage.get(prefill) ? prefill : "", type: "autre", statut: "nouvelle", datePrestation: "", montant: "", acompte: "", acompteVerse: false, notes: "" };
    const br = Brouillon && Brouillon.pour === (d ? d.id : "nouveau") ? Brouillon.valeurs : null;  // saisie en cours conservée
    const v = br ? { ...base, ...br } : base;
    const retourUrl = d ? "#dossiers/" + d.id : (Stockage.get(prefill) ? "#contacts/" + prefill : App.precedent === "#accueil" ? "#accueil" : "#dossiers");
    const perdu = v.contactId && !Stockage.get(v.contactId);
    const champ = (id, label, o = {}) => `<div class="champ"><label for="f-${id}">${label}${o.requis ? ' <span class="req" aria-hidden="true">*</span>' : ""}</label>
      <input id="f-${id}" name="${id}" type="${o.type || "text"}" value="${echapper(v[id])}" autocomplete="off"${o.mode ? ` inputmode="${o.mode}"` : ""} aria-describedby="e-${id}"${o.requis ? " required" : ""}><div class="err" id="e-${id}"></div></div>`;
    const sel = (id, label, opts, o = {}) => `<div class="champ"><label for="f-${id}">${label}${o.requis ? ' <span class="req" aria-hidden="true">*</span>' : ""}</label>
      <select id="f-${id}" name="${id}" aria-describedby="e-${id}">${o.vide ? `<option value="">${o.vide}</option>` : ""}${opts.map(([k, t]) => `<option value="${k}"${k === v[id] ? " selected" : ""}>${echapper(t)}</option>`).join("")}</select><div class="err" id="e-${id}"></div></div>`;
    return `<div class="page narrow">
      <a class="retour" href="${retourUrl}">Annuler</a>
      <div class="entete"><h1>${d ? "Modifier l’événement" : "Nouvel événement"}</h1></div>
      ${this.bandeau()}
